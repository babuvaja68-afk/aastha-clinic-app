          object SecurityEngine {
              private const val SECRET_KEY = "AasthaClinic#2026@SecKeySecure99"

              fun encrypt(input: String): String {
                  return try {
                      val keySpec = SecretKeySpec(SECRET_KEY.toByteArray(Charsets.UTF_8), "AES")
                      val cipher = Cipher.getInstance("AES/ECB/PKCS5Padding")
                      cipher.init(Cipher.ENCRYPT_MODE, keySpec)
                      val encryptedBytes = cipher.doFinal(input.toByteArray(Charsets.UTF_8))
                      Base64.encodeToString(encryptedBytes, Base64.DEFAULT)
                  } catch (e: Exception) { input }
              }

              fun decrypt(encryptedInput: String): String {
                  return try {
                      val keySpec = SecretKeySpec(SECRET_KEY.toByteArray(Charsets.UTF_8), "AES")
                      val cipher = Cipher.getInstance("AES/ECB/PKCS5Padding")
                      cipher.init(Cipher.DECRYPT_MODE, keySpec)
                      val decodedBytes = Base64.decode(encryptedInput, Base64.DEFAULT)
                      String(cipher.doFinal(decodedBytes), Charsets.UTF_8)
                  } catch (e: Exception) { encryptedInput }
              }
          }

          object LocalStorageManager {
              private const val PREF_NAME = "aastha_clinic_local_db"
              private const val KEY_PATIENTS = "saved_patients_json"

              fun savePatientsLocally(context: Context, list: List<Patient>) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val jsonArray = JSONArray()
                  list.forEach { p ->
                      val obj = JSONObject()
                      obj.put("id", p.id)
                      obj.put("name", p.name)
                      obj.put("phone", p.phone)
                      obj.put("village", p.village)
                      obj.put("age", p.age)
                      obj.put("disease", p.disease)
                      obj.put("medicine", p.medicine)
                      obj.put("amount", p.amount)
                      obj.put("paymentMode", p.paymentMode)
                      obj.put("doctorName", p.doctorName)
                      obj.put("timeSlot", p.timeSlot)
                      obj.put("date", p.date)
                      obj.put("timestamp", p.timestamp)
                      jsonArray.put(obj)
                  }
                  prefs.edit().putString(KEY_PATIENTS, jsonArray.toString()).apply()
              }

              fun getLocalPatients(context: Context): List<Patient> {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val rawJson = prefs.getString(KEY_PATIENTS, null) ?: return emptyList()
                  return try {
                      val jsonArray = JSONArray(rawJson)
                      val list = mutableListOf<Patient>()
                      for (i in 0 until jsonArray.length()) {
                          val obj = jsonArray.getJSONObject(i)
                          list.add(
                              Patient(
                                  id = obj.optString("id", UUID.randomUUID().toString()),
                                  name = obj.optString("name"),
                                  phone = obj.optString("phone"),
                                  village = obj.optString("village"),
                                  age = obj.optString("age"),
                                  disease = obj.optString("disease"),
                                  medicine = obj.optString("medicine"),
                                  amount = obj.optString("amount"),
                                  paymentMode = obj.optString("paymentMode"),
                                  doctorName = obj.optString("doctorName"),
                                  timeSlot = obj.optString("timeSlot"),
                                  date = obj.optString("date"),
                                  timestamp = obj.optLong("timestamp", System.currentTimeMillis())
                              )
                          )
                      }
                      list.sortedByDescending { it.timestamp }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }
          }

          object CloudSyncManager {
              private const val CLOUD_URL = "https://jsonblob.com/api/jsonBlob/1341050011854495744"

              suspend fun pushToCloud(patients: List<Patient>): Boolean {
                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL(CLOUD_URL)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout = 4000
                          conn.readTimeout = 4000
                          conn.requestMethod = "PUT"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.doOutput = true

                          val jsonArray = JSONArray()
                          patients.forEach { p ->
                              val obj = JSONObject()
                              obj.put("id", SecurityEngine.encrypt(p.id))
                              obj.put("name", SecurityEngine.encrypt(p.name))
                              obj.put("phone", SecurityEngine.encrypt(p.phone))
                              obj.put("village", SecurityEngine.encrypt(p.village))
                              obj.put("age", SecurityEngine.encrypt(p.age))
                              obj.put("disease", SecurityEngine.encrypt(p.disease))
                              obj.put("medicine", SecurityEngine.encrypt(p.medicine))
                              obj.put("amount", SecurityEngine.encrypt(p.amount))
                              obj.put("paymentMode", SecurityEngine.encrypt(p.paymentMode))
                              obj.put("doctorName", SecurityEngine.encrypt(p.doctorName))
                              obj.put("timeSlot", SecurityEngine.encrypt(p.timeSlot))
                              obj.put("date", SecurityEngine.encrypt(p.date))
                              obj.put("timestamp", p.timestamp)
                              jsonArray.put(obj)
                          }

                          val wr = OutputStreamWriter(conn.outputStream)
                          wr.write(jsonArray.toString())
                          wr.flush()
                          conn.responseCode == 200
                      } catch (e: Exception) { false }
                  }
              }

              suspend fun fetchFromCloud(): List<Patient>? {
                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL(CLOUD_URL)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout = 4000
                          conn.readTimeout = 4000
                          conn.requestMethod = "GET"
                          conn.setRequestProperty("Accept", "application/json")

                          if (conn.responseCode == 200) {
                              val reader = BufferedReader(InputStreamReader(conn.inputStream))
                              val response = reader.readText()
                              val jsonArray = JSONArray(response)
                              val list = mutableListOf<Patient>()
                              for (i in 0 until jsonArray.length()) {
                                  val obj = jsonArray.getJSONObject(i)
                                  list.add(
                                      Patient(
                                          id = SecurityEngine.decrypt(obj.optString("id")),
                                          name = SecurityEngine.decrypt(obj.optString("name")),
                                          phone = SecurityEngine.decrypt(obj.optString("phone")),
                                          village = SecurityEngine.decrypt(obj.optString("village")),
                                          age = SecurityEngine.decrypt(obj.optString("age")),
                                          disease = SecurityEngine.decrypt(obj.optString("disease")),
                                          medicine = SecurityEngine.decrypt(obj.optString("medicine")),
                                          amount = SecurityEngine.decrypt(obj.optString("amount")),
                                          paymentMode = SecurityEngine.decrypt(obj.optString("paymentMode")),
                                          doctorName = SecurityEngine.decrypt(obj.optString("doctorName")),
                                          timeSlot = SecurityEngine.decrypt(obj.optString("timeSlot")),
                                          date = SecurityEngine.decrypt(obj.optString("date")),
                                          timestamp = obj.optLong("timestamp", System.currentTimeMillis())
                                      )
                                  )
                              }
                              list.sortedByDescending { it.timestamp }
                          } else { null }
                      } catch (e: Exception) { null }
                  }
              }
          }

