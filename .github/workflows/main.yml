                                  selectedStandard != null -> StandardSubjectsScreen(selectedStandard!!, isGu, onSubjectSelect = { selectedSubject = it })
                                  else -> StandardsListScreen(standards, isGu, onStandardSelect = { selectedStandard = it })
                              }
