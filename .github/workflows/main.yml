                              onSelectFolder = { activeFolder = it },
                              headerTitle = if (isGu) "💻 કમ્પ્યુટર શીખો (Complete Course)" else "💻 Learn Computer Course",
                              headerSubtitle = if (isGu) "બેઝિક્સ, શોર્ટકટ્સ, MS Office, ઈન્ટરનેટ અને AI" else "Basics, Shortcuts, MS Office, Internet & AI"
                          )
                          2 -> FolderViewScreen(
