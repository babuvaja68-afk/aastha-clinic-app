name: Build Aastha Clinic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle and Build Files
        run: |
          mkdir -p gradle/wrapper app/src/main/res/values

          # Environment files
          touch .env .env.example
          touch app/.env app/.env.example

          # Fix SDK version in build.gradle.kts
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
          fi

          # Strings
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Aastha Clinic</string>
          </resources>
          EOF

          # Version Catalog
          cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "8.7.3"
          kotlin = "2.0.21"
          coreKtx = "1.15.0"
          lifecycleRuntimeKtx = "2.8.7"
          activityCompose = "1.9.3"
          composeBom = "2024.12.01"
          material3 = "1.3.1"
          room = "2.6.1"
          ksp = "2.0.21-1.0.28"
          moshi = "1.15.2"
          retrofit = "2.11.0"
          okhttp = "4.12.0"
          coroutines = "1.9.0"
          navigation = "2.8.5"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
          androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
          androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
          androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
          moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
          moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }
          converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "retrofit" }
          retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
          okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
          logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
          firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version = "33.7.0" }
          firebase-ai = { group = "com.google.firebase", name = "firebase-vertexai" }
          firebase-appcheck-recaptcha = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
          google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
          secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version = "2.0.1" }
          roborazzi = { id = "io.github.takahirom.roborazzi", version = "1.38.0" }
          EOF

          # Root Settings
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "aastha-clinic"
          include(":app")
          EOF

          # Root Build
          cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.compose) apply false
              alias(libs.plugins.google.devtools.ksp) apply false
              alias(libs.plugins.secrets) apply false
              alias(libs.plugins.roborazzi) apply false
              alias(libs.plugins.google.services) apply false
          }
          EOF

          # Setup compatible Gradle Wrapper (8.10.2)
          gradle wrapper --gradle-version 8.10.2

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aastha-Clinic-App
          path: app/build/outputs/apk/debug/*.apk
          
