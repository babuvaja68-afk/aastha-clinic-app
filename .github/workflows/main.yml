name: Build Aastha Clinic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix Directory Structure and Resources
        run: |
          # 1. Flatten nested app/app directory if exists
          if [ -d "app/app" ]; then
            cp -r app/app/* app/ 2>/dev/null || true
            rm -rf app/app
          fi

          # 2. Create proper resource directories
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          # 3. Move XML rules to res/xml folder (fixes MergingException)
          mv app/src/main/res/values/*rules*.xml app/src/main/res/xml/ 2>/dev/null || true
          mv *rules*.xml app/src/main/res/xml/ 2>/dev/null || true

          # 4. Create proper data_extraction_rules.xml & backup_rules.xml
          cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <include domain="root" path="."/>
              </cloud-backup>
              <device-transfer>
                  <include domain="root" path="."/>
              </device-transfer>
          </data-extraction-rules>
          EOF

          cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <include domain="root" path="."/>
          </full-backup-content>
          EOF

          # 5. Fix gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 6. Ensure strings.xml exists in values
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Aastha Clinic</string>
          </resources>
          EOF

          # 7. Create Dummy environment files
          touch .env .env.example
          touch app/.env app/.env.example

          # 8. Fix app/build.gradle.kts
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
          else
            cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.aastha.clinic"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.aastha.clinic"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF
          fi

          # 9. Root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "aastha-clinic"
          include(":app")
          EOF

          # 10. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          # 11. Setup Gradle Wrapper
          gradle wrapper --gradle-version 8.10.2

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aastha-Clinic-App
          path: "**/*.apk"
          
