          @Composable
          fun AddPatientScreen(
              lang: AppLang,
              patientList: List<Patient>,
              onSave: (Patient) -> Unit,
              onBack: () -> Unit,
              onSlotInfoClick: (String, String) -> Unit
          ) {
              var name by remember { mutableStateOf("") }
              var village by remember { mutableStateOf("") }
              var age by remember { mutableStateOf("") }
              var disease by remember { mutableStateOf("") }
              var medicine by remember { mutableStateOf("") }
              var amount by remember { mutableStateOf("") }
              var paymentMode by remember { mutableStateOf("Cash") }
              var selectedDoctor by remember { mutableStateOf("DR. BIRJU K. SIRODARIA (11:00 AM - 03:30 PM)") }

              val morningSlots = listOf(
                  "11:00 AM - 11:15 AM", "11:15 AM - 11:30 AM", "11:30 AM - 11:45 AM", "11:45 AM - 12:00 PM",
                  "12:00 PM - 12:15 PM", "12:15 PM - 12:30 PM", "12:30 PM - 12:45 PM", "12:45 PM - 01:00 PM",
                  "01:00 PM - 01:15 PM", "01:15 PM - 01:30 PM", "01:30 PM - 01:45 PM", "01:45 PM - 02:00 PM",
                  "02:00 PM - 02:15 PM", "02:15 PM - 02:30 PM", "02:30 PM - 02:45 PM", "02:45 PM - 03:00 PM",
                  "03:00 PM - 03:15 PM", "03:15 PM - 03:30 PM"
              )

              val eveningSlots = listOf(
                  "05:00 PM - 05:15 PM", "05:15 PM - 05:30 PM", "05:30 PM - 05:45 PM", "05:45 PM - 06:00 PM",
                  "06:00 PM - 06:15 PM", "06:15 PM - 06:30 PM", "06:30 PM - 06:45 PM", "06:45 PM - 07:00 PM",
                  "07:00 PM - 07:15 PM", "07:15 PM - 07:30 PM", "07:30 PM - 07:45 PM", "07:45 PM - 08:00 PM"
              )

              val currentSlots = if (selectedDoctor.contains("BIRJU")) morningSlots else eveningSlots
              var selectedSlot by remember(selectedDoctor) { mutableStateOf(currentSlots.first()) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp)
              ) {
                  Text(tr("select_doctor", lang), fontWeight = FontWeight.Bold, fontSize = 14.sp)
                  Spacer(modifier = Modifier.height(4.dp))

                  listOf(
                      "DR. BIRJU K. SIRODARIA (11:00 AM - 03:30 PM)",
                      "DR. NIDDHI JAVIA (05:00 PM - 08:00 PM)"
                  ).forEach { doc ->
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier.clickable { selectedDoctor = doc }
                      ) {
                          RadioButton(selected = (selectedDoctor == doc), onClick = { selectedDoctor = doc })
                          Text(text = doc, fontSize = 13.sp)
                      }
                  }

                  Spacer(modifier = Modifier.height(10.dp))
                  Text(tr("time_slot_label", lang), fontWeight = FontWeight.Bold, fontSize = 14.sp)
                  Spacer(modifier = Modifier.height(6.dp))

                  Column(modifier = Modifier.fillMaxWidth()) {
                      currentSlots.chunked(2).forEach { rowSlots ->
                          Row(modifier = Modifier.fillMaxWidth()) {
                              rowSlots.forEach { slot ->
                                  val docKey = if (selectedDoctor.contains("BIRJU")) "BIRJU" else "NIDDHI"
                                  val slotPatients = patientList.filter { it.timeSlot == slot && it.doctorName.contains(docKey) }
                                  val bookedCount = slotPatients.size
                                  val allChecked = bookedCount > 0 && slotPatients.all { it.isChecked }
                                  val isPending = bookedCount > 0 && slotPatients.any { !it.isChecked }

                                  val cardBgColor = when {
                                      selectedSlot == slot -> Color(0xFF0D276B)
                                      allChecked -> Color(0xFFDC2626)
                                      isPending -> Color(0xFF16A34A)
                                      else -> Color.White
                                  }

                                  Card(
                                      modifier = Modifier
                                          .weight(1f)
                                          .padding(3.dp)
                                          .clickable {
                                              selectedSlot = slot
                                              onSlotInfoClick(slot, selectedDoctor)
                                          },
                                      colors = CardDefaults.cardColors(containerColor = cardBgColor),
                                      shape = RoundedCornerShape(8.dp)
                                  ) {
                                      Column(modifier = Modifier.padding(8.dp)) {
                                          Text(
                                              text = slot,
                                              fontSize = 11.sp,
                                              fontWeight = FontWeight.Bold,
                                              color = if (selectedSlot == slot || bookedCount > 0) Color.White else Color(0xFF0D276B)
                                          )
                                          Text(
                                              text = when {
                                                  allChecked -> "🔴 તપાસાઈ ગયા (Red)"
                                                  isPending -> "🟢 તપાસવાના બાકી"
                                                  else -> "$bookedCount/3 દર્દી"
                                              },
                                              fontSize = 10.sp,
                                              color = if (selectedSlot == slot || bookedCount > 0) Color.White.copy(alpha = 0.9f) else Color.Gray
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(14.dp))

                  OutlinedTextField(
                      value = name,
                      onValueChange = { name = it },
                      label = { Text(tr("patient_name", lang)) },
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(10.dp))

                  Row(modifier = Modifier.fillMaxWidth()) {
                      OutlinedTextField(
                          value = village,
                          onValueChange = { village = it },
                          label = { Text(tr("village", lang)) },
                          modifier = Modifier.weight(1.5f)
                      )
                      Spacer(modifier = Modifier.width(8.dp))
                      OutlinedTextField(
                          value = age,
                          onValueChange = { age = it },
                          label = { Text(tr("age", lang)) },
                          modifier = Modifier.weight(1f)
                      )
                  }
                  Spacer(modifier = Modifier.height(10.dp))

                  OutlinedTextField(
                      value = disease,
                      onValueChange = { disease = it },
                      label = { Text(tr("disease", lang)) },
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(10.dp))

                  OutlinedTextField(
                      value = medicine,
                      onValueChange = { medicine = it },
                      label = { Text(tr("medicines", lang)) },
                      modifier = Modifier.fillMaxWidth(),
                      minLines = 2
                  )
                  Spacer(modifier = Modifier.height(10.dp))

                  OutlinedTextField(
                      value = amount,
                      onValueChange = { amount = it },
                      label = { Text(tr("fee_amount", lang)) },
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(10.dp))

                  Text(tr("payment_mode", lang), fontWeight = FontWeight.Bold)
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      listOf("Cash", "Online (UPI)", "Offline").forEach { mode ->
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.clickable { paymentMode = mode }
                          ) {
                              RadioButton(selected = (paymentMode == mode), onClick = { paymentMode = mode })
                              Text(text = mode, fontSize = 12.sp)
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(20.dp))

                  Button(
                      onClick = {
                          if (name.isNotBlank()) {
                              onSave(
                                  Patient(
                                      id = (100..999).random(),
                                      name = name,
                                      village = village,
                                      age = age,
                                      disease = disease,
                                      medicine = medicine,
                                      amount = amount,
                                      paymentMode = paymentMode,
                                      doctorName = if (selectedDoctor.contains("BIRJU")) "DR. BIRJU K. SIRODARIA" else "DR. NIDDHI JAVIA",
                                      timeSlot = selectedSlot,
                                      isChecked = false
                                  )
                              )
                          }
                      },
                      modifier = Modifier.fillMaxWidth(),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B)),
                      shape = RoundedCornerShape(8.dp)
                  ) {
                      Text(tr("save_booking", lang), fontSize = 15.sp)
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedButton(
                      onClick = onBack,
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(8.dp)
                  ) {
                      Text(tr("back", lang))
                  }
              }
          }

          @Composable
          fun PatientRecordsScreen(
              lang: AppLang,
              patients: List<Patient>,
              onBack: () -> Unit,
              onToggleCheck: (Patient) -> Unit
          ) {
              var searchQuery by remember { mutableStateOf("") }
              val filteredPatients = patients.filter {
                  it.name.contains(searchQuery, ignoreCase = true) ||
                  it.village.contains(searchQuery, ignoreCase = true) ||
                  it.disease.contains(searchQuery, ignoreCase = true) ||
                  it.doctorName.contains(searchQuery, ignoreCase = true)
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      OutlinedTextField(
                          value = searchQuery,
                          onValueChange = { searchQuery = it },
                          placeholder = { Text(tr("search_hint", lang)) },
                          modifier = Modifier.weight(1f),
                          singleLine = true
                      )
                      Spacer(modifier = Modifier.width(8.dp))
                      Button(
                          onClick = onBack,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B))
                      ) {
                          Text(tr("home_btn", lang))
                      }
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                      items(filteredPatients) { p ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 6.dp),
                              colors = CardDefaults.cardColors(
                                  containerColor = if (p.isChecked) Color(0xFFFFEBEE) else Color.White
                              ),
                              elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)
                          ) {
                              Column(modifier = Modifier.padding(14.dp)) {
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(text = p.name, fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF0D276B))
                                      Button(
                                          onClick = { onToggleCheck(p) },
                                          colors = ButtonDefaults.buttonColors(
                                              containerColor = if (p.isChecked) Color(0xFFDC2626) else Color(0xFF16A34A)
                                          ),
                                          contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                          modifier = Modifier.height(30.dp)
                                      ) {
                                          Text(
                                              text = if (p.isChecked) "🔴 તપાસાઈ ગયા" else "🟢 બાકી",
                                              fontSize = 11.sp,
                                              color = Color.White
                                          )
                                      }
                                  }
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Text(text = "⏰ ${p.timeSlot} | 👨‍⚕️ ${p.doctorName}", fontSize = 12.sp, fontWeight = FontWeight.SemiBold, color = Color(0xFF0288D1))
                                  Spacer(modifier = Modifier.height(2.dp))
                                  Text(text = "${tr("village", lang)}: ${p.village} | ${tr("age", lang)}: ${p.age}", fontSize = 13.sp, color = Color.DarkGray)
                                  Spacer(modifier = Modifier.height(2.dp))
                                  Text(text = "${tr("disease", lang)}: ${p.disease}", fontSize = 13.sp, fontWeight = FontWeight.Medium, color = Color(0xFFD32F2F))
                                  Spacer(modifier = Modifier.height(2.dp))
                                  Text(text = "${tr("medicines", lang)}: ${p.medicine}", fontSize = 12.sp, color = Color.Gray)
                                  Spacer(modifier = Modifier.height(2.dp))
                                  Text(text = "ફી: ₹${p.amount} (${p.paymentMode})", fontSize = 12.sp, fontWeight = FontWeight.Bold, color = Color(0xFF2E7D32))
                              }
                          }
                      }
                  }
              }
          }
          EOF

