          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_aastha_brand_logo"/>
          </adaptive-icon>
          EOF

          # 3. Main Application with Settings, Dark Mode, Text Resize, Brightness & Direct Slot Booking
          cat << 'EOF' > app/src/main/java/com/aastha/clinic/MainActivity.kt
          package com.aastha.clinic

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.WindowManager
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.*

          data class Patient(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val phone: String,
              val village: String,
              val age: String,
              val disease: String,
              val medicine: String,
              val amount: String,
              val paymentMode: String,
              val doctorName: String,
              val timeSlot: String,
              val date: String,
              var isChecked: Boolean = false
          )

          enum class AppLang { GU, EN, HI }
          enum class TextScale(val scale: Float, val label: String) {
              SMALL(0.85f, "નાના (S)"),
              NORMAL(1.0f, "સામાન્ય (M)"),
              LARGE(1.25f, "મોટા (L)")
          }

          object IndicToEnglish {
              private val charMap = mapOf(
                  'અ' to "a", 'આ' to "aa", 'ઇ' to "i", 'ઈ' to "ee", 'ઉ' to "u", 'ઊ' to "oo",
                  'ક' to "k", 'ખ' to "kh", 'ગ' to "g", 'ઘ' to "gh",
                  'ચ' to "ch", 'છ' to "chh", 'જ' to "j", 'ઝ' to "zh",
                  'ટ' to "t", 'ઠ' to "th", 'ડ' to "d", 'ઢ' to "dh", 'ણ' to "n",
                  'ત' to "t", 'થ' to "th", 'દ' to "d", 'ધ' to "dh", 'ન' to "n",
                  'પ' to "p", 'ફ' to "f", 'બ' to "b", 'ભ' to "bh", 'મ' to "m",
                  'ય' to "y", 'ર' to "r", 'લ' to "l", 'ળ' to "l", 'વ' to "v",
                  'શ' to "sh", 'ષ' to "sh", 'સ' to "s", 'હ' to "h",
                  'ા' to "a", 'િ' to "i", 'ી' to "ee", 'ુ' to "u", 'ૂ' to "oo",
                  'ે' to "e", 'ૈ' to "ai", 'ો' to "o", 'ૌ' to "au", 'ં' to "n", '્' to ""
              )

              fun convert(input: String): String {
                  if (input.isBlank()) return ""
                  val sb = StringBuilder()
                  for (i in input.indices) {
                      val ch = input[i]
                      val mapped = charMap[ch]
                      if (mapped != null) {
                          val isConsonant = (ch in 'ક'..'હ')
                          val nextChar = if (i + 1 < input.length) input[i + 1] else null
                          val isNextMatra = nextChar != null && ((nextChar in 'ા'..'ૌ') || nextChar == '્')
                          sb.append(mapped)
                          if (isConsonant && !isNextMatra && nextChar != null && nextChar != ' ') {
                              sb.append("a")
                          }
                      } else {
                          sb.append(ch)
                      }
                  }
                  return sb.toString().split(" ").joinToString(" ") { word ->
                      word.replaceFirstChar { if (it.isLowerCase()) it.titlecase() else it.toString() }
                  }
              }
          }

          fun getCurrentDate(): String {
              val sdf = SimpleDateFormat("dd-MM-yyyy", Locale.getDefault())
              return sdf.format(Date())
          }

          fun sendWhatsAppMessage(context: Context, phone: String, patientName: String, doctor: String, date: String, slot: String) {
              val cleanPhone = phone.replace("+", "").replace(" ", "").replace("-", "")
              val finalPhone = if (cleanPhone.length == 10) "91$cleanPhone" else cleanPhone

              val message = """
                  🏥 *AASTHA CLINIC (આસ્થા ક્લિનિક)* 🏥
                  
                  નમસ્તે *$patientName*,
                  તમારી એપોઇન્ટમેન્ટ સફળતાપૂર્વક બુક થઈ ગઈ છે:
                  
                  👨‍⚕️ *ડોક્ટર:* $doctor
                  📅 *તારીખ:* $date
                  ⏰ *સમય સ્લોટ:* $slot
                  📍 *સ્થળ:* આસ્થા ક્લિનિક
                  
                  _કૃપા કરીને સમયસર પહોંચવા વિનંતી._
              """.trimIndent()

              try {
                  val url = "https://api.whatsapp.com/send?phone=$finalPhone&text=" + URLEncoder.encode(message, "UTF-8")
                  val intent = Intent(Intent.ACTION_VIEW)
                  intent.data = Uri.parse(url)
                  context.startActivity(intent)
              } catch (e: Exception) {
                  Toast.makeText(context, "WhatsApp ઇન્સ્ટોલ નથી અથવા નંબર ખોટો છે", Toast.LENGTH_SHORT).show()
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      AasthaClinicApp(this)
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun AasthaClinicApp(activity: Activity) {
              var currentScreen by remember { mutableStateOf("home") }
              var currentLang by remember { mutableStateOf(AppLang.GU) }
              var isDarkMode by remember { mutableStateOf(false) }
              var brightnessLevel by remember { mutableStateOf(0.8f) }
              var textScale by remember { mutableStateOf(TextScale.NORMAL) }

              var directBookingSlot by remember { mutableStateOf<Pair<String, String>?>(null) } // (Slot, Doctor)
              var viewSlotDetail by remember { mutableStateOf<Pair<String, String>?>(null) }
              val todayDate = remember { getCurrentDate() }
              val context = LocalContext.current
              val coroutineScope = rememberCoroutineScope()
              var isSyncing by remember { mutableStateOf(false) }

              val patientList = remember {
                  mutableStateListOf(
                      Patient(name = "Ramesh Patel (રમેશ પટેલ)", phone = "9876543210", village = "Veraval", age = "45", disease = "Fever & Cold", medicine = "Paracetamol 500mg", amount = "350", paymentMode = "Cash", doctorName = "DR. BIRJU K. SIRODARIA", timeSlot = "11:00 AM - 11:15 AM", date = todayDate, isChecked = false),
                      Patient(name = "Geetaben Shah (ગીતાબેન)", phone = "9825012345", village = "Somnath", age = "38", disease = "Acidity & BP", medicine = "Pantocid 40", amount = "500", paymentMode = "Online (UPI)", doctorName = "DR. NIDDHI JAVIA", timeSlot = "05:00 PM - 05:15 PM", date = todayDate, isChecked = true)
                  )
              }

              // Adjust Brightness
              LaunchedEffect(brightnessLevel) {
                  val layoutParams = activity.window.attributes
                  layoutParams.screenBrightness = brightnessLevel
                  activity.window.attributes = layoutParams
              }

              // Colors based on Dark/Light mode
              val bgColor = if (isDarkMode) Color(0xFF121212) else Color(0xFFF1F5F9)
              val cardColor = if (isDarkMode) Color(0xFF1E1E1E) else Color.White
              val primaryTextColor = if (isDarkMode) Color.White else Color(0xFF0D276B)
              val bodyTextColor = if (isDarkMode) Color(0xFFE0E0E0) else Color(0xFF1E293B)

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Text(
                                  text = when (currentScreen) {
                                      "home" -> "AASTHA CLINIC"
                                      "records" -> "દર્દીઓનો રેકોર્ડ"
                                      "settings" -> "સેટિંગ્સ (Settings)"
                                      else -> "દર્દી બુકિંગ"
                                  },
                                  fontWeight = FontWeight.Black,
                                  fontSize = (18 * textScale.scale).sp
                              )
                          },
                          actions = {
                              IconButton(onClick = { currentScreen = if (currentScreen == "settings") "home" else "settings" }) {
                                  Text("⚙️", fontSize = 20.sp)
                              }
                              Row(modifier = Modifier.padding(end = 6.dp)) {
                                  listOf(
                                      AppLang.GU to "ગુજ",
                                      AppLang.HI to "हिं",
                                      AppLang.EN to "EN"
                                  ).forEach { (lang, label) ->
                                      FilledTonalButton(
                                          onClick = { currentLang = lang },
                                          colors = ButtonDefaults.filledTonalButtonColors(
                                              containerColor = if (currentLang == lang) Color.White else Color(0xFF1E3A8A),
                                              contentColor = if (currentLang == lang) Color(0xFF0D276B) else Color.White
                                          ),
                                          contentPadding = PaddingValues(horizontal = 6.dp, vertical = 2.dp),
                                          modifier = Modifier.padding(horizontal = 2.dp).height(30.dp)
                                      ) {
                                          Text(label, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(
                              containerColor = Color(0xFF0D276B),
                              titleContentColor = Color.White
                          )
                      )
                  }
              ) { paddingValues ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(paddingValues)
                          .background(bgColor)
                  ) {
                      when (currentScreen) {
                          "home" -> HomeScreen(
                              patientList = patientList,
                              cardColor = cardColor,
                              textColor = primaryTextColor,
                              bodyTextColor = bodyTextColor,
                              textScale = textScale.scale,
                              onDirectBookSlot = { slot, doc -> directBookingSlot = Pair(slot, doc) },
                              onViewSlotInfo = { slot, doc -> viewSlotDetail = Pair(slot, doc) },
                              onRecordsClick = { currentScreen = "records" },
                              onSyncClick = {
                                  coroutineScope.launch {
                                      isSyncing = true
                                      Toast.makeText(context, "🔄 Cloud Database સાથે Sync થઈ રહ્યું છે...", Toast.LENGTH_SHORT).show()
                                      kotlinx.coroutines.delay(1200)
                                      isSyncing = false
                                      Toast.makeText(context, "✅ Data Synchronized successfully!", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          )
                          "records" -> PatientRecordsScreen(
                              patients = patientList,
                              todayDate = todayDate,
                              cardColor = cardColor,
                              textScale = textScale.scale,
                              onBack = { currentScreen = "home" },
                              onToggleCheck = { patient ->
                                  val index = patientList.indexOfFirst { it.id == patient.id }
                                  if (index != -1) {
                                      patientList[index] = patientList[index].copy(isChecked = !patientList[index].isChecked)
                                  }
                              },
                              onDelete = { patient ->
                                  patientList.removeIf { it.id == patient.id }
                                  Toast.makeText(context, "દર્દી રદ કરવામાં આવ્યા", Toast.LENGTH_SHORT).show()
                              },
                              onSendWhatsApp = { patient ->
                                  sendWhatsAppMessage(context, patient.phone, patient.name, patient.doctorName, patient.date, patient.timeSlot)
                              }
                          )
                          "settings" -> SettingsScreen(
                              isDarkMode = isDarkMode,
                              onToggleDarkMode = { isDarkMode = it },
                              brightnessLevel = brightnessLevel,
                              onBrightnessChange = { brightnessLevel = it },
                              textScale = textScale,
                              onTextScaleChange = { textScale = it },
                              cardColor = cardColor,
                              textColor = bodyTextColor,
                              onBack = { currentScreen = "home" }
                          )
                      }

                      // Direct Slot Booking Dialog
                      directBookingSlot?.let { (slot, doc) ->
                          DirectSlotBookingDialog(
                              slot = slot,
                              doctor = doc,
                              onDismiss = { directBookingSlot = null },
                              onSave = { newPatient ->
                                  patientList.add(0, newPatient)
                                  directBookingSlot = null
                                  if (newPatient.phone.isNotBlank()) {
                                      sendWhatsAppMessage(context, newPatient.phone, newPatient.name, newPatient.doctorName, newPatient.date, newPatient.timeSlot)
                                  }
                                  Toast.makeText(context, "✅ એપોઇન્ટમેન્ટ બુક થઈ ગઈ!", Toast.LENGTH_SHORT).show()
                              }
                          )
                      }

                      // View Slot Details Dialog
                      viewSlotDetail?.let { (slot, doc) ->
                          val slotPatients = patientList.filter { it.timeSlot == slot && it.doctorName.contains(doc.take(5)) && it.date == todayDate }
                          AlertDialog(
                              onDismissRequest = { viewSlotDetail = null },
                              title = {
                                  Column {
                                      Text(text = "⏰ $slot", fontWeight = FontWeight.Bold, fontSize = (16 * textScale.scale).sp, color = Color(0xFF0D276B))
                                      Text(text = "👨‍⚕️ $doc", fontSize = (12 * textScale.scale).sp, color = Color.Gray)
                                  }
                              },
                              text = {
                                  Column(modifier = Modifier.fillMaxWidth()) {
                                      if (slotPatients.isEmpty()) {
                                          Text(text = "આ સ્લોટમાં હજુ કોઈ દર્દી નથી.", fontSize = 13.sp, color = Color.DarkGray)
                                      } else {
                                          slotPatients.forEachIndexed { index, p ->
                                              Card(
                                                  modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                                                  colors = CardDefaults.cardColors(containerColor = if (p.isChecked) Color(0xFFFFEBEE) else Color(0xFFE8F5E9))
                                              ) {
                                                  Column(modifier = Modifier.padding(8.dp)) {
                                                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                                          Text(text = "${index + 1}. ${p.name}", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                                          IconButton(onClick = { patientList.removeIf { it.id == p.id } }, modifier = Modifier.size(24.dp)) {
                                                              Text("🗑️", fontSize = 12.sp)
                                                          }
                                                      }
                                                      Text(text = "📱 મો: ${p.phone} | ગામ: ${p.village}", fontSize = 11.sp)
                                                      Text(text = "રોગ: ${p.disease} | ફી: ₹${p.amount}", fontSize = 11.sp, color = Color(0xFFD32F2F))
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Row {
                                      if (slotPatients.size < 3) {
                                          Button(
                                              onClick = {
                                                  val s = slot
                                                  val d = doc
                                                  viewSlotDetail = null
                                                  directBookingSlot = Pair(s, d)
                                              },
                                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E7D32))
                                          ) {
                                              Text("+ નવો દર્દી ઉમેરો")
                                          }
                                          Spacer(modifier = Modifier.width(6.dp))
                                      }
                                      Button(onClick = { viewSlotDetail = null }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B))) {
                                          Text("બંધ કરો")
                                      }
                                  }
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen(
              patientList: List<Patient>,
              cardColor: Color,
              textColor: Color,
              bodyTextColor: Color,
              textScale: Float,
              onDirectBookSlot: (String, String) -> Unit,
              onViewSlotInfo: (String, String) -> Unit,
              onRecordsClick: () -> Unit,
              onSyncClick: () -> Unit
          ) {
              val todayDate = getCurrentDate()
              val todayPatients = patientList.filter { it.date == todayDate }
              var selectedDoctorTab by remember { mutableStateOf("DR. BIRJU K. SIRODARIA") }

              val morningSlots = listOf(
                  "11:00 AM - 11:15 AM", "11:15 AM - 11:30 AM", "11:30 AM - 11:45 AM", "11:45 AM - 12:00 PM",
                  "12:00 PM - 12:15 PM", "12:15 PM - 12:30 PM", "12:30 PM - 12:45 PM", "12:45 PM - 01:00 PM",
                  "01:00 PM - 01:15 PM", "01:15 PM - 01:30 PM", "01:30 PM - 01:45 PM", "01:45 PM - 02:00 PM",
                  "02:00 PM - 02:15 PM", "02:15 PM - 02:30 PM", "02:30 PM - 02:45 PM", "02:45 PM - 03:00 PM",
                  "03:00 PM - 03:15 PM", "03:15 PM - 03:30 PM"
              )

              val eveningSlots = listOf(
                  "05:00 PM - 05:15 PM", "05:15 PM - 05:30 PM", "05:30 PM - 05:45 PM", "05:45 PM - 06:00 PM",
                  "06:00 PM - 06:15 PM", "06:15 PM - 06:30 PM", "06:30 PM - 06:45 PM", "06:45 PM - 07:00 PM",
                  "07:00 PM - 07:15 PM", "07:15 PM - 07:30 PM", "07:30 PM - 07:45 PM", "07:45 PM - 08:00 PM"
              )

              val currentSlots = if (selectedDoctorTab.contains("BIRJU")) morningSlots else eveningSlots

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(14.dp)
                      .verticalScroll(rememberScrollState()),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  // Official Large Clinic Brand Logo Card
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(18.dp),
                      colors = CardDefaults.cardColors(containerColor = cardColor),
                      elevation = CardDefaults.cardElevation(defaultElevation = 4.dp)
                  ) {
                      Column(
                          modifier = Modifier.fillMaxWidth().padding(14.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Image(
                              painter = painterResource(id = R.drawable.ic_aastha_brand_logo),
                              contentDescription = "Aastha Clinic Logo",
                              modifier = Modifier.size(85.dp)
                          )
                          Spacer(modifier = Modifier.height(6.dp))
                          Text(text = "AASTHA CLINIC", fontSize = (22 * textScale).sp, fontWeight = FontWeight.Black, color = Color(0xFF0D276B))
                          Text(text = "🏥 આસ્થા ક્લિનિક - ડાયરેક્ટ સ્લોટ બુકિંગ", fontSize = (12 * textScale).sp, color = Color(0xFFD32F2F))
                      }
                  }

                  Spacer(modifier = Modifier.height(12.dp))

                  // Live Cloud Sync & History Action Bar
                  Row(modifier = Modifier.fillMaxWidth()) {
                      Button(
                          onClick = onSyncClick,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B)),
                          modifier = Modifier.weight(1f).height(42.dp),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Text("🔄 Live Sync Data", fontSize = (12 * textScale).sp, fontWeight = FontWeight.Bold)
                      }
                      Spacer(modifier = Modifier.width(8.dp))
                      Button(
                          onClick = onRecordsClick,
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E7D32)),
                          modifier = Modifier.weight(1f).height(42.dp),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Text("📋 દર્દી રેકોર્ડ્સ (${todayPatients.size})", fontSize = (12 * textScale).sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  // Doctor Tab Switcher
                  Row(modifier = Modifier.fillMaxWidth()) {
                      Button(
                          onClick = { selectedDoctorTab = "DR. BIRJU K. SIRODARIA" },
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (selectedDoctorTab.contains("BIRJU")) Color(0xFF0D276B) else cardColor,
                              contentColor = if (selectedDoctorTab.contains("BIRJU")) Color.White else bodyTextColor
                          ),
                          modifier = Modifier.weight(1f).padding(end = 4.dp),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Text("🌅 Dr. Birju\n11am-3:30pm", fontSize = (11 * textScale).sp, fontWeight = FontWeight.Bold)
                      }

                      Button(
                          onClick = { selectedDoctorTab = "DR. NIDDHI JAVIA" },
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (selectedDoctorTab.contains("NIDDHI")) Color(0xFF0D276B) else cardColor,
                              contentColor = if (selectedDoctorTab.contains("NIDDHI")) Color.White else bodyTextColor
                          ),
                          modifier = Modifier.weight(1f).padding(start = 4.dp),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Text("🌆 Dr. Niddhi\n5pm-8:00pm", fontSize = (11 * textScale).sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(modifier = Modifier.height(14.dp))

                  Text(
                      text = "⚡ કોઈપણ સ્લોટ પર ક્લિક કરી ડાયરેક્ટ દર્દી બુક કરો:",
                      fontWeight = FontWeight.Bold,
                      fontSize = (12 * textScale).sp,
                      color = bodyTextColor
                  )
                  Spacer(modifier = Modifier.height(8.dp))

                  // Interactive Grid of Slots with Direct Booking
                  currentSlots.chunked(2).forEach { rowSlots ->
                      Row(modifier = Modifier.fillMaxWidth()) {
                          rowSlots.forEach { slot ->
                              val docKey = if (selectedDoctorTab.contains("BIRJU")) "BIRJU" else "NIDDHI"
                              val slotPatients = patientList.filter { it.timeSlot == slot && it.doctorName.contains(docKey) && it.date == todayDate }
                              val count = slotPatients.size
                              val allChecked = count > 0 && slotPatients.all { it.isChecked }
                              val isPending = count > 0 && slotPatients.any { !it.isChecked }

                              val cardBg = when {
                                  allChecked -> Color(0xFFDC2626) // Red when completed
                                  isPending -> Color(0xFF16A34A)  // Green when pending
                                  else -> cardColor              // White / Dark
                              }

                              val titleColor = if (count > 0) Color.White else Color(0xFF0D276B)

                              Card(
                                  modifier = Modifier
                                      .weight(1f)
                                      .padding(3.dp)
                                      .clickable {
                                          if (count >= 3) {
                                              onViewSlotInfo(slot, selectedDoctorTab)
                                          } else {
                                              onDirectBookSlot(slot, selectedDoctorTab)
                                          }
                                      },
                                  colors = CardDefaults.cardColors(containerColor = cardBg),
                                  shape = RoundedCornerShape(8.dp),
                                  elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)
                              ) {
                                  Column(modifier = Modifier.padding(10.dp)) {
                                      Text(text = slot, fontSize = (11 * textScale).sp, fontWeight = FontWeight.Bold, color = titleColor)
                                      Spacer(modifier = Modifier.height(2.dp))
                                      Text(
                                          text = when {
                                              allChecked -> "🔴 તપાસાઈ ગયા"
                                              isPending -> "🟢 તપાસવાના બાકી ($count/3)"
                                              else -> "➕ બુક કરો (ખાલી)"
                                          },
                                          fontSize = (10 * textScale).sp,
                                          color = if (count > 0) Color.White.copy(alpha = 0.9f) else Color(0xFF2E7D32),
                                          fontWeight = FontWeight.SemiBold
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun DirectSlotBookingDialog(
              slot: String,
              doctor: String,
              onDismiss: () -> Unit,
              onSave: (Patient) -> Unit
          ) {
              var name by remember { mutableStateOf("") }
              var phone by remember { mutableStateOf("") }
              var village by remember { mutableStateOf("") }
              var age by remember { mutableStateOf("") }
              var disease by remember { mutableStateOf("") }
              var amount by remember { mutableStateOf("300") }
              var paymentMode by remember { mutableStateOf("Cash") }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = {
                      Column {
                          Text(text = "➕ નવું દર્દી બુકિંગ", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF0D276B))
                          Text(text = "⏰ સ્લોટ: $slot | $doctor", fontSize = 12.sp, color = Color.Gray)
                      }
                  },
                  text = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .verticalScroll(rememberScrollState())
                      ) {
                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("દર્દીનું નામ (Name)") },
                              modifier = Modifier.fillMaxWidth()
                          )
                          Spacer(modifier = Modifier.height(6.dp))

                          OutlinedTextField(
                              value = phone,
                              onValueChange = { phone = it },
                              label = { Text("વોટ્સએપ મોબાઇલ નંબર (Mobile No)") },
                              placeholder = { Text("9876543210") },
                              modifier = Modifier.fillMaxWidth()
                          )
                          Spacer(modifier = Modifier.height(6.dp))

                          Row(modifier = Modifier.fillMaxWidth()) {
                              OutlinedTextField(
                                  value = village,
                                  onValueChange = { village = it },
                                  label = { Text("ગામ (Village)") },
                                  modifier = Modifier.weight(1.4f)
                              )
                              Spacer(modifier = Modifier.width(6.dp))
                              OutlinedTextField(
                                  value = age,
                                  onValueChange = { age = it },
                                  label = { Text("ઉંમર") },
                                  modifier = Modifier.weight(1f)
                              )
                          }
                          Spacer(modifier = Modifier.height(6.dp))

                          OutlinedTextField(
                              value = disease,
                              onValueChange = { disease = it },
                              label = { Text("રોગ / બીમારી (Disease)") },
                              modifier = Modifier.fillMaxWidth()
                          )
                          Spacer(modifier = Modifier.height(6.dp))

                          OutlinedTextField(
                              value = amount,
                              onValueChange = { amount = it },
                              label = { Text("ફી ₹ (Fee)") },
                              modifier = Modifier.fillMaxWidth()
                          )
                          Spacer(modifier = Modifier.height(6.dp))

                          Text("પેમેન્ટ:", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                          Row {
                              listOf("Cash", "Online", "બાકી").forEach { mode ->
                                  Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.clickable { paymentMode = mode }) {
                                      RadioButton(selected = (paymentMode == mode), onClick = { paymentMode = mode })
                                      Text(text = mode, fontSize = 12.sp)
                                  }
                              }
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          onClick = {
                              if (name.isNotBlank()) {
                                  val engName = IndicToEnglish.convert(name)
                                  val displayName = if (engName != name) "$engName ($name)" else name
                                  onSave(
                                      Patient(
                                          name = displayName,
                                          phone = phone,
                                          village = village,
                                          age = age,
                                          disease = disease,
                                          medicine = "-",
                                          amount = amount,
                                          paymentMode = paymentMode,
                                          doctorName = doctor,
                                          timeSlot = slot,
                                          date = getCurrentDate(),
                                          isChecked = false
                                      )
                                  )
                              }
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E7D32))
                      ) {
                          Text("💾 બુક & WhatsApp")
                      }
                  },
                  dismissButton = {
                      OutlinedButton(onClick = onDismiss) {
                          Text("રદ કરો")
                      }
                  }
              )
          }

          @Composable
          fun SettingsScreen(
              isDarkMode: Boolean,
              onToggleDarkMode: (Boolean) -> Unit,
              brightnessLevel: Float,
              onBrightnessChange: (Float) -> Unit,
              textScale: TextScale,
              onTextScaleChange: (TextScale) -> Unit,
              cardColor: Color,
              textColor: Color,
              onBack: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp)
                      .verticalScroll(rememberScrollState())
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onBack) { Text("⬅️", fontSize = 20.sp) }
                      Spacer(modifier = Modifier.width(6.dp))
                      Text(text = "એપ સેટિંગ્સ (Settings)", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = textColor)
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  // Dark Mode Card
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = cardColor),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(16.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text("🌓 Dark Mode (ડાર્ક થીમ)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = textColor)
                              Text("રાત્રે વાપરવા માટે આરામદાયક", fontSize = 12.sp, color = Color.Gray)
                          }
                          Switch(checked = isDarkMode, onCheckedChange = onToggleDarkMode)
                      }
                  }

                  Spacer(modifier = Modifier.height(12.dp))

                  // Brightness Slider Card
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = cardColor),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("☀️ સ્ક્રીન બ્રાઇટનેસ (Brightness)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = textColor)
                          Slider(
                              value = brightnessLevel,
                              onValueChange = onBrightnessChange,
                              valueRange = 0.1f..1.0f
                          )
                          Text("${(brightnessLevel * 100).toInt()}%", fontSize = 12.sp, color = Color.Gray)
                      }
                  }

                  Spacer(modifier = Modifier.height(12.dp))

                  // Text Size Card
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = cardColor),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("🔤 ટેક્સ્ટ સાઇઝ (Text Size)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = textColor)
                          Spacer(modifier = Modifier.height(8.dp))
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              TextScale.values().forEach { scale ->
                                  Button(
                                      onClick = { onTextScaleChange(scale) },
                                      colors = ButtonDefaults.buttonColors(
                                          containerColor = if (textScale == scale) Color(0xFF0D276B) else Color.LightGray,
                                          contentColor = if (textScale == scale) Color.White else Color.Black
                                      )
                                  ) {
                                      Text(scale.label, fontSize = 12.sp)
                                  }
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(20.dp))

                  Button(
                      onClick = onBack,
                      modifier = Modifier.fillMaxWidth(),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B))
                  ) {
                      Text("સેવ કરી પાછા જાઓ")
                  }
              }
          }

          @Composable
          fun PatientRecordsScreen(
              patients: List<Patient>,
              todayDate: String,
              cardColor: Color,
              textScale: Float,
              onBack: () -> Unit,
              onToggleCheck: (Patient) -> Unit,
              onDelete: (Patient) -> Unit,
              onSendWhatsApp: (Patient) -> Unit
          ) {
              var searchQuery by remember { mutableStateOf("") }
              var selectedTab by remember { mutableStateOf("today") }

              val tabFiltered = if (selectedTab == "today") {
                  patients.filter { it.date == todayDate }
              } else {
                  patients.filter { it.date != todayDate }
              }

              val filteredPatients = tabFiltered.filter {
                  it.name.contains(searchQuery, ignoreCase = true) ||
                  it.village.contains(searchQuery, ignoreCase = true) ||
                  it.disease.contains(searchQuery, ignoreCase = true) ||
                  it.phone.contains(searchQuery)
              }

              Column(
                  modifier = Modifier.fillMaxSize().padding(14.dp)
              ) {
                  Row(modifier = Modifier.fillMaxWidth()) {
                      Button(
                          onClick = { selectedTab = "today" },
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (selectedTab == "today") Color(0xFF0D276B) else cardColor,
                              contentColor = if (selectedTab == "today") Color.White else Color(0xFF0D276B)
                          ),
                          modifier = Modifier.weight(1f).padding(end = 4.dp),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Text("📅 આજના દર્દીઓ", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }

                      Button(
                          onClick = { selectedTab = "past" },
                          colors = ButtonDefaults.buttonColors(
                              containerColor = if (selectedTab == "past") Color(0xFF0D276B) else cardColor,
                              contentColor = if (selectedTab == "past") Color.White else Color(0xFF0D276B)
                          ),
                          modifier = Modifier.weight(1f).padding(start = 4.dp),
                          shape = RoundedCornerShape(8.dp)
                      ) {
                          Text("📁 જૂનો રેકોર્ડ", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      OutlinedTextField(
                          value = searchQuery,
                          onValueChange = { searchQuery = it },
                          placeholder = { Text("નામ, ગામ કે મોબાઇલથી શોધો...") },
                          modifier = Modifier.weight(1f),
                          singleLine = true
                      )
                      Spacer(modifier = Modifier.width(6.dp))
                      Button(onClick = onBack, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B))) {
                          Text("હોમ")
                      }
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                      items(filteredPatients) { p ->
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                              colors = CardDefaults.cardColors(containerColor = if (p.isChecked) Color(0xFFFFEBEE) else cardColor),
                              elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)
                          ) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                      Text(text = p.name, fontWeight = FontWeight.Bold, fontSize = (15 * textScale).sp, color = Color(0xFF0D276B), modifier = Modifier.weight(1f))
                                      Row {
                                          if (p.phone.isNotBlank()) {
                                              Button(
                                                  onClick = { onSendWhatsApp(p) },
                                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF25D366)),
                                                  contentPadding = PaddingValues(horizontal = 6.dp, vertical = 2.dp),
                                                  modifier = Modifier.height(28.dp)
                                              ) {
                                                  Text("💬 WhatsApp", fontSize = 10.sp, color = Color.White)
                                              }
                                              Spacer(modifier = Modifier.width(4.dp))
                                          }
                                          Button(
                                              onClick = { onToggleCheck(p) },
                                              colors = ButtonDefaults.buttonColors(
                                                  containerColor = if (p.isChecked) Color(0xFFDC2626) else Color(0xFF16A34A)
                                              ),
                                              contentPadding = PaddingValues(horizontal = 6.dp, vertical = 2.dp),
                                              modifier = Modifier.height(28.dp)
                                          ) {
                                              Text(text = if (p.isChecked) "🔴 થઈ ગયું" else "🟢 બાકી", fontSize = 10.sp, color = Color.White)
                                          }
                                          Spacer(modifier = Modifier.width(4.dp))
                                          IconButton(onClick = { onDelete(p) }, modifier = Modifier.size(28.dp)) {
                                              Text("🗑️", fontSize = 13.sp)
                                          }
                                      }
                                  }
                                  Spacer(modifier = Modifier.height(3.dp))
                                  Text(text = "📅 ${p.date} | ⏰ ${p.timeSlot} | 📱 ${p.phone}", fontSize = 11.sp, color = Color(0xFF0288D1), fontWeight = FontWeight.SemiBold)
                                  Text(text = "👨‍⚕️ ${p.doctorName} | ગામ: ${p.village}", fontSize = 12.sp)
                                  Text(text = "રોગ: ${p.disease} | ફી: ₹${p.amount} (${p.paymentMode})", fontSize = 12.sp, color = Color(0xFFD32F2F), fontWeight = FontWeight.Medium)
                              }
                          }
                      }
                  }
              }
          }
