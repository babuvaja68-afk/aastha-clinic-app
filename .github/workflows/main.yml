name: Build Aastha Clinic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Professional Clinic App with Exact Custom App Icon
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/aastha/clinic
          mkdir -p gradle/wrapper

          # 0. Gradle Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "AasthaClinic"
          include ':app'
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aastha.clinic'
              compileSdk 34

              defaultConfig {
                  applicationId "com.aastha.clinic"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Aastha Clinic"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # EXACT MATCH AASTHA CLINIC BRAND ICON (Blue caring figures + Medical Cross + AA emblem)
          cat << 'EOF' > app/src/main/res/drawable/ic_aastha_brand_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              
              <!-- Clean White Circular Plate Backdrop -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,12 C77.2,12 96,30.8 96,54 C96,77.2 77.2,96 54,96 C30.8,96 12,77.2 12,54 C12,30.8 30.8,12 54,12 Z"/>
              
              <!-- Subtle Border Ring -->
              <path
                  android:strokeColor="#E2E8F0"
                  android:strokeWidth="1.5"
                  android:pathData="M54,12 C77.2,12 96,30.8 96,54 C96,77.2 77.2,96 54,96 C30.8,96 12,77.2 12,54 C12,30.8 30.8,12 54,12 Z"/>

              <!-- Outer Medical Cross in Rich Crimson -->
              <path
                  android:fillColor="#B71C1C"
                  android:pathData="M46,28 h16 v18 h18 v16 h-18 v18 h-16 v-18 h-18 v-16 h18 z"/>

              <!-- 4 Surrounding Blue Caring Angelic Figures / Hands -->
              <!-- Top Figure Head -->
              <path
                  android:fillColor="#1565C0"
                  android:pathData="M54,20 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0"/>
              <!-- Bottom Figure Head -->
              <path
                  android:fillColor="#1565C0"
                  android:pathData="M54,88 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0"/>
              <!-- Left Figure Head -->
              <path
                  android:fillColor="#1565C0"
                  android:pathData="M20,54 m0,-4 a4,4 0 1,0 0,8 a4,4 0 1,0 0,-8"/>
              <!-- Right Figure Head -->
              <path
                  android:fillColor="#1565C0"
                  android:pathData="M88,54 m0,-4 a4,4 0 1,0 0,8 a4,4 0 1,0 0,-8"/>

              <!-- Blue Protective Flow Curves -->
              <path
                  android:fillColor="#1976D2"
                  android:pathData="M54,25 C45,28 35,38 35,46 C39,42 45,40 54,43 C63,40 69,42 73,46 C73,38 63,28 54,25 Z"/>
              <path
                  android:fillColor="#1976D2"
                  android:pathData="M54,83 C45,80 35,70 35,62 C39,66 45,68 54,65 C63,68 69,66 73,62 C73,70 63,80 54,83 Z"/>
              <path
                  android:fillColor="#0D47A1"
                  android:pathData="M25,54 C28,45 38,35 46,35 C42,39 40,45 43,54 C40,63 42,69 46,73 C38,73 28,63 25,54 Z"/>
              <path
                  android:fillColor="#0D47A1"
                  android:pathData="M83,54 C80,45 70,35 62,35 C66,39 68,45 65,54 C68,63 66,69 62,73 C70,73 80,63 83,54 Z"/>

              <!-- Center White Shield Badge -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,42 C60.6,42 66,47.4 66,54 C66,60.6 60.6,66 54,66 C47.4,66 42,60.6 42,54 C42,47.4 47.4,42 54,42 Z"/>
              <path
                  android:strokeColor="#B71C1C"
                  android:strokeWidth="1"
                  android:pathData="M54,42 C60.6,42 66,47.4 66,54 C66,60.6 60.6,66 54,66 C47.4,66 42,60.6 42,54 C42,47.4 47.4,42 54,42 Z"/>

              <!-- Center "AA" Typography Monogram -->
              <!-- First A -->
              <path
                  android:fillColor="#880E4F"
                  android:pathData="M48.5,49 L46.5,59 h2.2 l0.5,-2.2 h2.4 l0.5,2.2 h2.2 L52,49 h-3.5 z M49.8,51.8 h1.0 l0.4,3.2 h-1.8 z"/>
              <!-- Second A -->
              <path
                  android:fillColor="#880E4F"
                  android:pathData="M55.5,49 L53.5,59 h2.2 l0.5,-2.2 h2.4 l0.5,2.2 h2.2 L59,49 h-3.5 z M56.8,51.8 h1.0 l0.4,3.2 h-1.8 z"/>
          </vector>
          EOF

          # Launcher Background
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#F8FAFC"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          # Adaptive Launcher Icon Configuration
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_aastha_brand_logo"/>
          </adaptive-icon>
          EOF

          # Main Application Code with Live Sync & History
          cat << 'EOF' > app/src/main/java/com/aastha/clinic/MainActivity.kt
          package com.aastha.clinic

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.util.Base64
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.*
          import javax.crypto.Cipher
          import javax.crypto.spec.SecretKeySpec

          data class Patient(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val phone: String,
              val village: String,
              val age: String,
              val disease: String,
              val medicine: String,
              val amount: String,
              val paymentMode: String,
              val doctorName: String,
              val timeSlot: String,
              val date: String,
              val timestamp: Long = System.currentTimeMillis()
          )

          object SecurityEngine {
              private const val SECRET_KEY = "AasthaClinic#2026@SecKeySecure99"

              fun encrypt(input: String): String {
                  return try {
                      val keySpec = SecretKeySpec(SECRET_KEY.toByteArray(Charsets.UTF_8), "AES")
                      val cipher = Cipher.getInstance("AES/ECB/PKCS5Padding")
                      cipher.init(Cipher.ENCRYPT_MODE, keySpec)
                      val encryptedBytes = cipher.doFinal(input.toByteArray(Charsets.UTF_8))
                      Base64.encodeToString(encryptedBytes, Base64.DEFAULT)
                  } catch (e: Exception) {
                      input
                  }
              }

              fun decrypt(encryptedInput: String): String {
                  return try {
                      val keySpec = SecretKeySpec(SECRET_KEY.toByteArray(Charsets.UTF_8), "AES")
                      val cipher = Cipher.getInstance("AES/ECB/PKCS5Padding")
                      cipher.init(Cipher.DECRYPT_MODE, keySpec)
                      val decodedBytes = Base64.decode(encryptedInput, Base64.DEFAULT)
                      String(cipher.doFinal(decodedBytes), Charsets.UTF_8)
                  } catch (e: Exception) {
                      encryptedInput
                  }
              }
          }

          object CloudSyncManager {
              private const val CLOUD_URL = "https://jsonblob.com/api/jsonBlob/1341050011854495744"

              suspend fun pushToCloud(patients: List<Patient>): Boolean {
                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL(CLOUD_URL)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "PUT"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.doOutput = true

                          val jsonArray = JSONArray()
                          patients.forEach { p ->
                              val obj = JSONObject()
                              obj.put("id", SecurityEngine.encrypt(p.id))
                              obj.put("name", SecurityEngine.encrypt(p.name))
                              obj.put("phone", SecurityEngine.encrypt(p.phone))
                              obj.put("village", SecurityEngine.encrypt(p.village))
                              obj.put("age", SecurityEngine.encrypt(p.age))
                              obj.put("disease", SecurityEngine.encrypt(p.disease))
                              obj.put("medicine", SecurityEngine.encrypt(p.medicine))
                              obj.put("amount", SecurityEngine.encrypt(p.amount))
                              obj.put("paymentMode", SecurityEngine.encrypt(p.paymentMode))
                              obj.put("doctorName", SecurityEngine.encrypt(p.doctorName))
                              obj.put("timeSlot", SecurityEngine.encrypt(p.timeSlot))
                              obj.put("date", SecurityEngine.encrypt(p.date))
                              obj.put("timestamp", p.timestamp)
                              jsonArray.put(obj)
                          }

                          val wr = OutputStreamWriter(conn.outputStream)
                          wr.write(jsonArray.toString())
                          wr.flush()
                          conn.responseCode == 200
                      } catch (e: Exception) {
                          false
                      }
                  }
              }

              suspend fun fetchFromCloud(): List<Patient>? {
                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL(CLOUD_URL)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "GET"
                          conn.setRequestProperty("Accept", "application/json")

                          if (conn.responseCode == 200) {
                              val reader = BufferedReader(InputStreamReader(conn.inputStream))
                              val response = reader.readText()
                              val jsonArray = JSONArray(response)
                              val list = mutableListOf<Patient>()
                              for (i in 0 until jsonArray.length()) {
                                  val obj = jsonArray.getJSONObject(i)
                                  list.add(
                                      Patient(
                                          id = SecurityEngine.decrypt(obj.optString("id")),
                                          name = SecurityEngine.decrypt(obj.optString("name")),
                                          phone = SecurityEngine.decrypt(obj.optString("phone")),
                                          village = SecurityEngine.decrypt(obj.optString("village")),
                                          age = SecurityEngine.decrypt(obj.optString("age")),
                                          disease = SecurityEngine.decrypt(obj.optString("disease")),
                                          medicine = SecurityEngine.decrypt(obj.optString("medicine")),
                                          amount = SecurityEngine.decrypt(obj.optString("amount")),
                                          paymentMode = SecurityEngine.decrypt(obj.optString("paymentMode")),
                                          doctorName = SecurityEngine.decrypt(obj.optString("doctorName")),
                                          timeSlot = SecurityEngine.decrypt(obj.optString("timeSlot")),
                                          date = SecurityEngine.decrypt(obj.optString("date")),
                                          timestamp = obj.optLong("timestamp", System.currentTimeMillis())
                                      )
                                  )
                              }
                              list.sortedByDescending { it.timestamp }
                          } else {
                              null
                          }
                      } catch (e: Exception) {
                          null
                      }
                  }
              }
          }

          fun getCurrentDate(): String {
              val sdf = SimpleDateFormat("dd-MM-yyyy", Locale.getDefault())
              return sdf.format(Date())
          }

          fun getCurrentTimeSlot(): String {
              val sdf = SimpleDateFormat("hh:mm a", Locale.getDefault())
              return sdf.format(Date())
          }

          fun sendWhatsAppReceipt(context: Context, patient: Patient) {
              val cleanPhone = patient.phone.replace("+", "").replace(" ", "").replace("-", "")
              val finalPhone = if (cleanPhone.length == 10) "91$cleanPhone" else cleanPhone

              val message = """
                  🏥 *AASTHA CLINIC & DIAGNOSTIC*
                  ---------------------------------
                  📋 *Patient Name:* ${patient.name}
                  🎂 *Age:* ${patient.age} | 📍 *Village:* ${patient.village}
                  👨‍⚕️ *Doctor:* ${patient.doctorName}
                  📅 *Date:* ${patient.date} (${patient.timeSlot})
                  
                  🩺 *Diagnosis:* ${patient.disease}
                  💊 *Prescription / Advice:*
                  ${patient.medicine}
                  
                  💰 *Amount Paid:* ₹${patient.amount} (${patient.paymentMode})
                  ---------------------------------
                  _Take care & get well soon!_
              """.trimIndent()

              try {
                  val url = "https://api.whatsapp.com/send?phone=$finalPhone&text=" + URLEncoder.encode(message, "UTF-8")
                  val intent = Intent(Intent.ACTION_VIEW)
                  intent.data = Uri.parse(url)
                  context.startActivity(intent)
              } catch (e: Exception) {
                  Toast.makeText(context, "WhatsApp open karva ma samasya aavi", Toast.LENGTH_SHORT).show()
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      AasthaClinicApp()
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun AasthaClinicApp() {
              val context = LocalContext.current
              val coroutineScope = rememberCoroutineScope()
              val todayDate = remember { getCurrentDate() }

              val patientList = remember { mutableStateListOf<Patient>() }
              var selectedTab by remember { mutableStateOf(0) }
              var isSyncing by remember { mutableStateOf(false) }

              // New Entry Form State
              var nameInput by remember { mutableStateOf("") }
              var phoneInput by remember { mutableStateOf("") }
              var villageInput by remember { mutableStateOf("") }
              var ageInput by remember { mutableStateOf("") }
              var diseaseInput by remember { mutableStateOf("") }
              var medicineInput by remember { mutableStateOf("") }
              var amountInput by remember { mutableStateOf("300") }
              var paymentMode by remember { mutableStateOf("Cash") }
              var doctorName by remember { mutableStateOf("DR. BIRJU K. SIRODARIA") }

              // Patient History State
              var historySearchQuery by remember { mutableStateOf("") }
              var selectedPatientHistory by remember { mutableStateOf<List<Patient>?>(null) }
              var viewHistoryPatientName by remember { mutableStateOf("") }

              // Live Auto Background Sync Loop (Every 6 seconds)
              LaunchedEffect(Unit) {
                  while (true) {
                      try {
                          val cloudData = CloudSyncManager.fetchFromCloud()
                          if (cloudData != null && cloudData != patientList.toList()) {
                              patientList.clear()
                              patientList.addAll(cloudData)
                          }
                      } catch (e: Exception) { }
                      delay(6000)
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Image(
                                      painter = painterResource(id = R.drawable.ic_aastha_brand_logo),
                                      contentDescription = "Aastha Logo",
                                      modifier = Modifier.size(36.dp)
                                  )
                                  Spacer(modifier = Modifier.width(10.dp))
                                  Column {
                                      Text("AASTHA CLINIC", fontWeight = FontWeight.Black, fontSize = 18.sp, color = Color.White, letterSpacing = 1.sp)
                                      Text("Live Staff Portal • Dr. Birju & Dr. Niddhi", fontSize = 11.sp, color = Color(0xFFBBDEFB))
                                  }
                              }
                          },
                          actions = {
                              IconButton(onClick = {
                                  coroutineScope.launch {
                                      isSyncing = true
                                      val cloudData = CloudSyncManager.fetchFromCloud()
                                      if (cloudData != null) {
                                          patientList.clear()
                                          patientList.addAll(cloudData)
                                          Toast.makeText(context, "Data Updated Live!", Toast.LENGTH_SHORT).show()
                                      }
                                      isSyncing = false
                                  }
                              }) {
                                  Icon(Icons.Default.Refresh, contentDescription = "Sync", tint = Color.White)
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF0D276B))
                      )
                  },
                  bottomBar = {
                      NavigationBar(containerColor = Color.White, tonalElevation = 8.dp) {
                          NavigationBarItem(
                              selected = selectedTab == 0,
                              onClick = { selectedTab = 0 },
                              icon = { Icon(Icons.Default.ListAlt, contentDescription = null) },
                              label = { Text("Today (${patientList.count { it.date == todayDate }})") }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 1,
                              onClick = { selectedTab = 1 },
                              icon = { Icon(Icons.Default.PersonAdd, contentDescription = null) },
                              label = { Text("New Checkup") }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 2,
                              onClick = { selectedTab = 2 },
                              icon = { Icon(Icons.Default.History, contentDescription = null) },
                              label = { Text("Search & History") }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                          .background(Color(0xFFF4F7FB))
                  ) {
                      when (selectedTab) {
                          0 -> TodayPatientScreen(patientList, todayDate, onPatientClick = { p ->
                              viewHistoryPatientName = p.name
                              selectedPatientHistory = patientList.filter { it.phone == p.phone || it.name.equals(p.name, ignoreCase = true) }
                          })
                          1 -> NewCheckupScreen(
                              patientList = patientList,
                              nameInput = nameInput, onNameChange = { nameInput = it },
                              phoneInput = phoneInput, onPhoneChange = { phoneInput = it },
                              villageInput = villageInput, onVillageChange = { villageInput = it },
                              ageInput = ageInput, onAgeChange = { ageInput = it },
                              diseaseInput = diseaseInput, onDiseaseChange = { diseaseInput = it },
                              medicineInput = medicineInput, onMedicineChange = { medicineInput = it },
                              amountInput = amountInput, onAmountChange = { amountInput = it },
                              paymentMode = paymentMode, onPaymentChange = { paymentMode = it },
                              doctorName = doctorName, onDoctorChange = { doctorName = it },
                              onSubmit = { newP ->
                                  patientList.add(0, newP)
                                  coroutineScope.launch {
                                      CloudSyncManager.pushToCloud(patientList)
                                  }
                                  sendWhatsAppReceipt(context, newP)
                                  nameInput = ""; phoneInput = ""; villageInput = ""; ageInput = ""; diseaseInput = ""; medicineInput = ""
                                  selectedTab = 0
                                  Toast.makeText(context, "Dardi Record Live Save Thai Gayo!", Toast.LENGTH_LONG).show()
                              },
                              onSelectExisting = { existing ->
                                  nameInput = existing.name
                                  phoneInput = existing.phone
                                  villageInput = existing.village
                                  ageInput = existing.age
                                  diseaseInput = existing.disease
                                  doctorName = existing.doctorName
                              }
                          )
                          2 -> PatientHistoryScreen(
                              patientList = patientList,
                              query = historySearchQuery,
                              onQueryChange = { historySearchQuery = it },
                              onSelectPatient = { p ->
                                  viewHistoryPatientName = p.name
                                  selectedPatientHistory = patientList.filter { it.phone == p.phone || it.name.equals(p.name, ignoreCase = true) }
                              }
                          )
                      }

                      // Medical History Modal Dialog
                      if (selectedPatientHistory != null) {
                          AlertDialog(
                              onDismissRequest = { selectedPatientHistory = null },
                              title = {
                                  Column {
                                      Text("📋 Full Medical History", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color(0xFF0D276B))
                                      Text("Patient: $viewHistoryPatientName", fontSize = 13.sp, color = Color.Gray)
                                  }
                              },
                              text = {
                                  LazyColumn(modifier = Modifier.fillMaxWidth().heightIn(max = 400.dp)) {
                                      items(selectedPatientHistory!!) { rec ->
                                          Card(
                                              modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                                              colors = CardDefaults.cardColors(containerColor = Color(0xFFEEF2F6))
                                          ) {
                                              Column(modifier = Modifier.padding(10.dp)) {
                                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                                      Text(rec.date, fontWeight = FontWeight.Bold, fontSize = 13.sp, color = Color(0xFF0D276B))
                                                      Text(rec.timeSlot, fontSize = 11.sp, color = Color.DarkGray)
                                                  }
                                                  Spacer(modifier = Modifier.height(2.dp))
                                                  Text("👨‍⚕️ Doctor: ${rec.doctorName}", fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                                                  Text("🩺 Disease: ${rec.disease}", fontSize = 12.sp, color = Color(0xFFC62828))
                                                  Text("💊 Medicine: ${rec.medicine}", fontSize = 12.sp, color = Color(0xFF1565C0))
                                                  Text("💰 Paid: ₹${rec.amount} (${rec.paymentMode})", fontSize = 12.sp, color = Color(0xFF2E7D32))
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Button(onClick = { selectedPatientHistory = null }) {
                                      Text("Close")
                                  }
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun TodayPatientScreen(patientList: List<Patient>, todayDate: String, onPatientClick: (Patient) -> Unit) {
              val todayList = patientList.filter { it.date == todayDate }
              val totalCollection = todayList.sumOf { it.amount.toDoubleOrNull() ?: 0.0 }
              val context = LocalContext.current

              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  // Stats Summary Header
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF0D276B)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("Today's Patients", color = Color(0xFFBBDEFB), fontSize = 12.sp)
                              Text("${todayList.size}", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF2E7D32)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("Collection", color = Color(0xFFA5D6A7), fontSize = 12.sp)
                              Text("₹${totalCollection.toInt()}", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(14.dp))
                  Text("🔴 Live Patient Queue (Real-Time)", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color(0xFF0D276B))
                  Spacer(modifier = Modifier.height(8.dp))

                  if (todayList.isEmpty()) {
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("Aaje haji sudhi koi dardi aavyu nathi.\nNavu naam umerva 'New Checkup' par jaao.", color = Color.Gray, fontSize = 14.sp)
                      }
                  } else {
                      LazyColumn(modifier = Modifier.fillMaxSize()) {
                          items(todayList) { patient ->
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 5.dp)
                                      .clickable { onPatientClick(patient) },
                                  colors = CardDefaults.cardColors(containerColor = Color.White),
                                  elevation = CardDefaults.cardElevation(2.dp),
                                  shape = RoundedCornerShape(10.dp)
                              ) {
                                  Column(modifier = Modifier.padding(12.dp)) {
                                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                          Text(patient.name, fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF0D276B))
                                          Text(patient.timeSlot, fontSize = 12.sp, color = Color.Gray, fontWeight = FontWeight.Medium)
                                      }
                                      Text("📍 ${patient.village} | 📞 ${patient.phone} | Age: ${patient.age}", fontSize = 13.sp, color = Color.DarkGray)
                                      Spacer(modifier = Modifier.height(4.dp))
                                      Text("🩺 ${patient.disease}", fontSize = 13.sp, color = Color(0xFFD32F2F), fontWeight = FontWeight.SemiBold)
                                      Text("💊 ${patient.medicine}", fontSize = 13.sp, color = Color(0xFF1565C0))
                                      Spacer(modifier = Modifier.height(6.dp))
                                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                          Text("₹${patient.amount} (${patient.paymentMode})", color = Color(0xFF2E7D32), fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                              OutlinedButton(
                                                  onClick = { onPatientClick(patient) },
                                                  contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp)
                                              ) {
                                                  Text("History", fontSize = 11.sp)
                                              }
                                              Button(
                                                  onClick = { sendWhatsAppReceipt(context, patient) },
                                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF25D366)),
                                                  contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp)
                                              ) {
                                                  Text("Receipt", fontSize = 11.sp, color = Color.White)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun NewCheckupScreen(
              patientList: List<Patient>,
              nameInput: String, onNameChange: (String) -> Unit,
              phoneInput: String, onPhoneChange: (String) -> Unit,
              villageInput: String, onVillageChange: (String) -> Unit,
              ageInput: String, onAgeChange: (String) -> Unit,
              diseaseInput: String, onDiseaseChange: (String) -> Unit,
              medicineInput: String, onMedicineChange: (String) -> Unit,
              amountInput: String, onAmountChange: (String) -> Unit,
              paymentMode: String, onPaymentChange: (String) -> Unit,
              doctorName: String, onDoctorChange: (String) -> Unit,
              onSubmit: (Patient) -> Unit,
              onSelectExisting: (Patient) -> Unit
          ) {
              val scrollState = rememberScrollState()

              val matchingPatients = remember(phoneInput, nameInput) {
                  if (phoneInput.length >= 3 || nameInput.length >= 2) {
                      patientList.filter {
                          (phoneInput.isNotBlank() && it.phone.contains(phoneInput)) ||
                          (nameInput.isNotBlank() && it.name.contains(nameInput, ignoreCase = true))
                      }.distinctBy { it.phone }
                  } else emptyList()
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(scrollState)
                      .padding(16.dp)
              ) {
                  Text("🩺 Patient Checkup Entry", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color(0xFF0D276B))
                  Text("Auto-searches old records for repeat patients", fontSize = 12.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(12.dp))

                  if (matchingPatients.isNotEmpty()) {
                      Card(
                          modifier = Modifier.fillMaxWidth().padding(bottom = 10.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFFFF9C4))
                      ) {
                          Column(modifier = Modifier.padding(10.dp)) {
                              Text("⚡ Returning Patient Found! Click to Auto-fill:", fontWeight = FontWeight.Bold, fontSize = 12.sp, color = Color(0xFFF57F17))
                              matchingPatients.take(3).forEach { oldP ->
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable { onSelectExisting(oldP) }
                                          .padding(vertical = 4.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Text("👤 ${oldP.name} (${oldP.village})", fontSize = 13.sp, fontWeight = FontWeight.Medium)
                                      Text("Tap to Fill ➡️", fontSize = 12.sp, color = Color(0xFF0D276B))
                                  }
                              }
                          }
                      }
                  }

                  OutlinedTextField(
                      value = phoneInput,
                      onValueChange = onPhoneChange,
                      label = { Text("Mobile Number (ફોન નંબર)") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedTextField(
                      value = nameInput,
                      onValueChange = onNameChange,
                      label = { Text("Patient Full Name (દર્દીનું નામ)") },
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(8.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(
                          value = ageInput,
                          onValueChange = onAgeChange,
                          label = { Text("Age (ઉંમર)") },
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                          modifier = Modifier.weight(1f)
                      )
                      OutlinedTextField(
                          value = villageInput,
                          onValueChange = onVillageChange,
                          label = { Text("Village / City (ગામ)") },
                          modifier = Modifier.weight(1.5f)
                      )
                  }
                  Spacer(modifier = Modifier.height(8.dp))

                  Text("Select Doctor:", fontSize = 13.sp, fontWeight = FontWeight.Medium)
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      FilterChip(
                          selected = doctorName == "DR. BIRJU K. SIRODARIA",
                          onClick = { onDoctorChange("DR. BIRJU K. SIRODARIA") },
                          label = { Text("Dr. Birju", fontSize = 12.sp) }
                      )
                      FilterChip(
                          selected = doctorName == "DR. NIDDHI JAVIA",
                          onClick = { onDoctorChange("DR. NIDDHI JAVIA") },
                          label = { Text("Dr. Niddhi", fontSize = 12.sp) }
                      )
                  }
                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedTextField(
                      value = diseaseInput,
                      onValueChange = onDiseaseChange,
                      label = { Text("Diagnosis / Symptoms (રોગ / તકલીફ)") },
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedTextField(
                      value = medicineInput,
                      onValueChange = onMedicineChange,
                      label = { Text("Prescribed Medicine / Advice (દવાઓ)") },
                      modifier = Modifier.fillMaxWidth(),
                      minLines = 2
                  )
                  Spacer(modifier = Modifier.height(8.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(
                          value = amountInput,
                          onValueChange = onAmountChange,
                          label = { Text("Fees (₹)") },
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                          modifier = Modifier.weight(1f)
                      )
                      Column(modifier = Modifier.weight(1.5f)) {
                          Text("Payment Mode", fontSize = 11.sp, color = Color.Gray)
                          Row {
                              FilterChip(
                                  selected = paymentMode == "Cash",
                                  onClick = { onPaymentChange("Cash") },
                                  label = { Text("Cash", fontSize = 11.sp) }
                              )
                              Spacer(modifier = Modifier.width(4.dp))
                              FilterChip(
                                  selected = paymentMode == "Online",
                                  onClick = { onPaymentChange("Online") },
                                  label = { Text("Online", fontSize = 11.sp) }
                              )
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  Button(
                      onClick = {
                          if (nameInput.isNotBlank()) {
                              val p = Patient(
                                  name = nameInput.trim(),
                                  phone = phoneInput.trim(),
                                  village = villageInput.trim(),
                                  age = ageInput.trim(),
                                  disease = diseaseInput.trim(),
                                  medicine = medicineInput.trim(),
                                  amount = amountInput.trim(),
                                  paymentMode = paymentMode,
                                  doctorName = doctorName,
                                  timeSlot = getCurrentTimeSlot(),
                                  date = getCurrentDate()
                              )
                              onSubmit(p)
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B)),
                      shape = RoundedCornerShape(10.dp)
                  ) {
                      Text("SAVE & SEND RECEIPT 🚀", fontWeight = FontWeight.Bold, fontSize = 15.sp)
                  }
              }
          }

          @Composable
          fun PatientHistoryScreen(
              patientList: List<Patient>,
              query: String,
              onQueryChange: (String) -> Unit,
              onSelectPatient: (Patient) -> Unit
          ) {
              val filtered = remember(query, patientList) {
                  if (query.isBlank()) {
                      patientList.distinctBy { it.phone.ifBlank { it.name } }
                  } else {
                      patientList.filter {
                          it.name.contains(query, ignoreCase = true) ||
                          it.phone.contains(query) ||
                          it.village.contains(query, ignoreCase = true) ||
                          it.disease.contains(query, ignoreCase = true)
                      }.distinctBy { it.phone.ifBlank { it.name } }
                  }
              }

              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Text("🔍 Patient Medical History Finder", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color(0xFF0D276B))
                  Text("Search by Name, Phone, Village, or Disease", fontSize = 12.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(10.dp))

                  OutlinedTextField(
                      value = query,
                      onValueChange = onQueryChange,
                      placeholder = { Text("Type name or phone number...") },
                      leadingIcon = { Icon(Icons.Default.Search, contentDescription = null) },
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(12.dp)
                  )
                  Spacer(modifier = Modifier.height(10.dp))

                  Text("Total Unique Patients: ${filtered.size}", fontSize = 12.sp, fontWeight = FontWeight.SemiBold, color = Color.DarkGray)
                  Spacer(modifier = Modifier.height(6.dp))

                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                      items(filtered) { patient ->
                          val visitCount = patientList.count { it.phone == patient.phone || it.name.equals(patient.name, ignoreCase = true) }
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 5.dp)
                                  .clickable { onSelectPatient(patient) },
                              colors = CardDefaults.cardColors(containerColor = Color.White),
                              elevation = CardDefaults.cardElevation(2.dp),
                              shape = RoundedCornerShape(10.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(14.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(patient.name, fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF0D276B))
                                      Text("📞 ${patient.phone} | 📍 ${patient.village}", fontSize = 13.sp, color = Color.Gray)
                                      Text("Last Checked: ${patient.date} • ${patient.disease}", fontSize = 12.sp, color = Color(0xFFD32F2F))
                                  }
                                  Surface(
                                      color = Color(0xFFE3F2FD),
                                      shape = RoundedCornerShape(20.dp)
                                  ) {
                                      Text(
                                          text = "$visitCount Visits",
                                          modifier = Modifier.padding(horizontal = 10.dp, vertical = 5.dp),
                                          fontSize = 11.sp,
                                          fontWeight = FontWeight.Bold,
                                          color = Color(0xFF1565C0)
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          chmod +x gradlew || gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aastha-Clinic-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
