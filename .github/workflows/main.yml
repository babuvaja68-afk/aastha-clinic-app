              var selectedTab by remember { mutableStateOf(0) }
              var isOnline by remember { mutableStateOf(true) }

              // Settings State
              var isDarkMode by remember { mutableStateOf(false) }
              var textScale by remember { mutableStateOf(TextScale.MEDIUM) }
              val scale = textScale.factor

              // Entry Form State
              var nameInput by remember { mutableStateOf("") }
              var phoneInput by remember { mutableStateOf("") }
              var villageInput by remember { mutableStateOf("") }
              var ageInput by remember { mutableStateOf("") }
              var diseaseInput by remember { mutableStateOf("") }
              var medicineInput by remember { mutableStateOf("") }
              var amountInput by remember { mutableStateOf("300") }
              var paymentMode by remember { mutableStateOf("Cash") }
              var doctorName by remember { mutableStateOf("DR. BIRJU K. SIRODARIA") }
              var selectedSlot by remember { mutableStateOf("11:00 AM - 11:15 AM") }

              // History State
              var historySearchQuery by remember { mutableStateOf("") }
              var selectedPatientHistory by remember { mutableStateOf<List<Patient>?>(null) }
              var viewHistoryPatientName by remember { mutableStateOf("") }

              // Auto-Sync and Network Handler Loop
              LaunchedEffect(Unit) {
                  while (true) {
                      try {
                          val cloudData = CloudSyncManager.fetchFromCloud()
                          if (cloudData != null) {
                              isOnline = true
                              val merged = (patientList + cloudData).distinctBy { it.id }.sortedByDescending { it.timestamp }
                              if (merged != patientList.toList()) {
                                  patientList.clear()
                                  patientList.addAll(merged)
                                  LocalStorageManager.savePatientsLocally(context, merged)
                              }
                          } else {
                              isOnline = false
                          }
                      } catch (e: Exception) {
                          isOnline = false
                      }
                      delay(6000)
                  }
              }

              val bgColor = if (isDarkMode) Color(0xFF121212) else Color(0xFFF4F7FB)
              val cardBg = if (isDarkMode) Color(0xFF1E1E1E) else Color.White
              val textColor = if (isDarkMode) Color.White else Color(0xFF0D276B)
              val bodyTextColor = if (isDarkMode) Color(0xFFB0BEC5) else Color(0xFF333333)

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Image(
                                      painter = painterResource(id = R.drawable.ic_aastha_brand_logo),
                                      contentDescription = "Logo",
                                      modifier = Modifier.size((34 * scale).dp)
                                  )
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Column {
                                      Text("AASTHA CLINIC", fontWeight = FontWeight.Black, fontSize = (17 * scale).sp, color = Color.White, letterSpacing = 1.sp)
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Surface(
                                              shape = RoundedCornerShape(4.dp),
                                              color = if (isOnline) Color(0xFF4CAF50) else Color(0xFFFF9800),
                                              modifier = Modifier.padding(end = 4.dp)
                                          ) {
                                              Text(
                                                  if (isOnline) " ONLINE " else " OFFLINE ",
                                                  fontSize = (8 * scale).sp,
                                                  color = Color.White,
                                                  fontWeight = FontWeight.Bold
                                              )
                                          }
                                          Text("Dr. Birju & Dr. Niddhi", fontSize = (10 * scale).sp, color = Color(0xFFBBDEFB))
                                      }
                                  }
                              }
                          },
                          actions = {
                              IconButton(onClick = {
                                  coroutineScope.launch {
                                      val cloudData = CloudSyncManager.fetchFromCloud()
                                      if (cloudData != null) {
                                          isOnline = true
                                          val merged = (patientList + cloudData).distinctBy { it.id }.sortedByDescending { it.timestamp }
                                          patientList.clear()
                                          patientList.addAll(merged)
                                          LocalStorageManager.savePatientsLocally(context, merged)
                                          CloudSyncManager.pushToCloud(merged)
                                          Toast.makeText(context, "Data Synced Online!", Toast.LENGTH_SHORT).show()
                                      } else {
                                          isOnline = false
                                          Toast.makeText(context, "Offline Mode: Saved locally in phone storage.", Toast.LENGTH_SHORT).show()
                                      }
                                  }
                              }) {
                                  Icon(Icons.Default.Refresh, contentDescription = "Sync", tint = Color.White)
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF0D276B))
                      )
                  },
                  bottomBar = {
                      NavigationBar(containerColor = if (isDarkMode) Color(0xFF1E1E1E) else Color.White) {
                          NavigationBarItem(
                              selected = selectedTab == 0,
                              onClick = { selectedTab = 0 },
                              icon = { Icon(Icons.Default.ListAlt, contentDescription = null) },
                              label = { Text("Today (${patientList.count { it.date == todayDate }})", fontSize = (11 * scale).sp) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 1,
                              onClick = { selectedTab = 1 },
                              icon = { Icon(Icons.Default.Schedule, contentDescription = null) },
                              label = { Text("Dr. Slots", fontSize = (11 * scale).sp) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 2,
                              onClick = { selectedTab = 2 },
                              icon = { Icon(Icons.Default.PersonAdd, contentDescription = null) },
                              label = { Text("New Entry", fontSize = (11 * scale).sp) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 3,
                              onClick = { selectedTab = 3 },
                              icon = { Icon(Icons.Default.History, contentDescription = null) },
                              label = { Text("History", fontSize = (11 * scale).sp) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 4,
                              onClick = { selectedTab = 4 },
                              icon = { Icon(Icons.Default.Settings, contentDescription = null) },
                              label = { Text("Settings", fontSize = (11 * scale).sp) }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                          .background(bgColor)
                  ) {
                      when (selectedTab) {
                          0 -> TodayPatientScreen(patientList, todayDate, scale, cardBg, textColor, bodyTextColor, onPatientClick = { p ->
                              viewHistoryPatientName = p.name
                              selectedPatientHistory = patientList.filter { it.phone == p.phone || it.name.equals(p.name, ignoreCase = true) }
                          })
                          1 -> DoctorSlotsScreen(
                              patientList = patientList,
                              todayDate = todayDate,
                              scale = scale,
                              cardBg = cardBg,
                              textColor = textColor,
                              onBookSlot = { doc, slot ->
                                  doctorName = doc
                                  selectedSlot = slot
                                  selectedTab = 2
                              }
                          )
                          2 -> NewCheckupScreen(
                              patientList = patientList,
                              scale = scale,
                              cardBg = cardBg,
                              textColor = textColor,
                              nameInput = nameInput, onNameChange = { nameInput = it },
                              phoneInput = phoneInput, onPhoneChange = { phoneInput = it },
                              villageInput = villageInput, onVillageChange = { villageInput = it },
                              ageInput = ageInput, onAgeChange = { ageInput = it },
                              diseaseInput = diseaseInput, onDiseaseChange = { diseaseInput = it },
                              medicineInput = medicineInput, onMedicineChange = { medicineInput = it },
                              amountInput = amountInput, onAmountChange = { amountInput = it },
                              paymentMode = paymentMode, onPaymentChange = { paymentMode = it },
                              doctorName = doctorName, onDoctorChange = { doctorName = it },
                              selectedSlot = selectedSlot, onSlotChange = { selectedSlot = it },
                              onSubmit = { newP ->
                                  patientList.add(0, newP)
                                  LocalStorageManager.savePatientsLocally(context, patientList)

                                  coroutineScope.launch {
                                      CloudSyncManager.pushToCloud(patientList)
                                  }

                                  sendWhatsAppAppointmentOnly(context, newP)
                                  nameInput = ""; phoneInput = ""; villageInput = ""; ageInput = ""; diseaseInput = ""; medicineInput = ""
                                  selectedTab = 0
                                  Toast.makeText(context, "Dardi Record Phone & Cloud ma Save Thai Gayo!", Toast.LENGTH_LONG).show()
                              },
                              onSelectExisting = { existing ->
                                  nameInput = existing.name
                                  phoneInput = existing.phone
                                  villageInput = existing.village
                                  ageInput = existing.age
                                  diseaseInput = existing.disease
                                  medicineInput = existing.medicine
                                  doctorName = existing.doctorName
                              }
                          )
                          3 -> PatientHistoryScreen(
                              patientList = patientList,
                              query = historySearchQuery,
                              scale = scale,
                              cardBg = cardBg,
                              textColor = textColor,
                              onQueryChange = { historySearchQuery = it },
                              onSelectPatient = { p ->
                                  viewHistoryPatientName = p.name
                                  selectedPatientHistory = patientList.filter { it.phone == p.phone || it.name.equals(p.name, ignoreCase = true) }
                              }
                          )
                          4 -> SettingsScreen(
                              isDarkMode = isDarkMode,
                              onToggleDarkMode = { isDarkMode = it },
                              textScale = textScale,
                              onSelectTextScale = { textScale = it },
                              scale = scale,
                              cardBg = cardBg,
                              textColor = textColor
                          )
                      }

                      // Medical History Dialog
                      if (selectedPatientHistory != null) {
                          AlertDialog(
                              onDismissRequest = { selectedPatientHistory = null },
                              title = {
                                  Column {
                                      Text("📋 Full Medical History", fontWeight = FontWeight.Bold, fontSize = (17 * scale).sp, color = Color(0xFF0D276B))
                                      Text("Patient: $viewHistoryPatientName", fontSize = (12 * scale).sp, color = Color.Gray)
                                  }
                              },
                              text = {
                                  LazyColumn(modifier = Modifier.fillMaxWidth().heightIn(max = 400.dp)) {
                                      items(selectedPatientHistory!!) { rec ->
                                          Card(
                                              modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                                              colors = CardDefaults.cardColors(containerColor = Color(0xFFEEF2F6))
                                          ) {
                                              Column(modifier = Modifier.padding(10.dp)) {
                                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                                      Text(rec.date, fontWeight = FontWeight.Bold, fontSize = (13 * scale).sp, color = Color(0xFF0D276B))
                                                      Text(rec.timeSlot, fontSize = (11 * scale).sp, color = Color.DarkGray)
                                                  }
                                                  Spacer(modifier = Modifier.height(2.dp))
                                                  Text("👨‍⚕️ ${rec.doctorName}", fontSize = (12 * scale).sp, fontWeight = FontWeight.SemiBold)
                                                  Text("🩺 Disease (રોગ): ${rec.disease}", fontSize = (12 * scale).sp, color = Color(0xFFC62828), fontWeight = FontWeight.Medium)
                                                  Text("💊 Medicine (દવા): ${rec.medicine}", fontSize = (12 * scale).sp, color = Color(0xFF1565C0))
                                                  Text("💰 Paid: ₹${rec.amount} (${rec.paymentMode})", fontSize = (12 * scale).sp, color = Color(0xFF2E7D32), fontWeight = FontWeight.Bold)
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Button(onClick = { selectedPatientHistory = null }) {
                                      Text("Close")
                                  }
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun DoctorSlotsScreen(
              patientList: List<Patient>,
              todayDate: String,
              scale: Float,
              cardBg: Color,
              textColor: Color,
              onBookSlot: (String, String) -> Unit
          ) {
              var selectedDoctorTab by remember { mutableStateOf(0) }
              val morningSlots = remember { getMorningSlots() }
              val eveningSlots = remember { getEveningSlots() }

              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Text("🩺 Doctor Appointment Slots", fontWeight = FontWeight.Bold, fontSize = (18 * scale).sp, color = textColor)
                  Text("Morning: 11 AM - 3:30 PM (Dr. Birju) | Evening: 5 PM - 8 PM (Dr. Niddhi)", fontSize = (11 * scale).sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(10.dp))

                  TabRow(selectedTabIndex = selectedDoctorTab, containerColor = cardBg) {
                      Tab(
                          selected = selectedDoctorTab == 0,
                          onClick = { selectedDoctorTab = 0 },
                          text = { Text("Dr. Birju (Morning)", fontSize = (12 * scale).sp, fontWeight = FontWeight.Bold) }
                      )
                      Tab(
                          selected = selectedDoctorTab == 1,
                          onClick = { selectedDoctorTab = 1 },
                          text = { Text("Dr. Niddhi (Evening)", fontSize = (12 * scale).sp, fontWeight = FontWeight.Bold) }
                      )
                  }

                  Spacer(modifier = Modifier.height(12.dp))

                  val currentDoctor = if (selectedDoctorTab == 0) "DR. BIRJU K. SIRODARIA" else "DR. NIDDHI JAVIA"
                  val currentSlots = if (selectedDoctorTab == 0) morningSlots else eveningSlots

                  LazyVerticalGrid(
                      columns = GridCells.Fixed(2),
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      items(currentSlots) { slot ->
                          val bookedCount = patientList.count { it.date == todayDate && it.doctorName == currentDoctor && it.timeSlot == slot }
                          val isFull = bookedCount >= 3

                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clickable { onBookSlot(currentDoctor, slot) },
                              colors = CardDefaults.cardColors(
                                  containerColor = if (isFull) Color(0xFFFFEBEE) else cardBg
                              ),
                              shape = RoundedCornerShape(10.dp),
                              elevation = CardDefaults.cardElevation(2.dp)
                          ) {
                              Column(modifier = Modifier.padding(10.dp)) {
                                  Text(slot, fontWeight = FontWeight.Bold, fontSize = (12 * scale).sp, color = if (isFull) Color(0xFFC62828) else textColor)
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text("$bookedCount / 3 Dardi", fontSize = (11 * scale).sp, color = if (isFull) Color.Red else Color(0xFF2E7D32), fontWeight = FontWeight.SemiBold)
                                      Text(if (isFull) "Full" else "Book ➡️", fontSize = (10 * scale).sp, color = if (isFull) Color.Gray else Color(0xFF1565C0))
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun TodayPatientScreen(
              patientList: List<Patient>,
              todayDate: String,
              scale: Float,
              cardBg: Color,
              textColor: Color,
              bodyTextColor: Color,
              onPatientClick: (Patient) -> Unit
          ) {
              val todayList = patientList.filter { it.date == todayDate }
              val totalCollection = todayList.sumOf { it.amount.toDoubleOrNull() ?: 0.0 }
              val context = LocalContext.current

              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF0D276B)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("Today's Patients", color = Color(0xFFBBDEFB), fontSize = (11 * scale).sp)
                              Text("${todayList.size}", color = Color.White, fontSize = (22 * scale).sp, fontWeight = FontWeight.Bold)
                          }
                      }
                      Card(
                          modifier = Modifier.weight(1f),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF2E7D32)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("Collection", color = Color(0xFFA5D6A7), fontSize = (11 * scale).sp)
                              Text("₹${totalCollection.toInt()}", color = Color.White, fontSize = (22 * scale).sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(14.dp))
                  Text("🔴 Live Patient Queue (Real-Time)", fontWeight = FontWeight.Bold, fontSize = (15 * scale).sp, color = textColor)
                  Spacer(modifier = Modifier.height(8.dp))

                  if (todayList.isEmpty()) {
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("Aaje haji sudhi koi dardi nathi.\nNavi entry karva 'New Entry' par click karo.", color = Color.Gray, fontSize = (14 * scale).sp)
                      }
                  } else {
                      LazyColumn(modifier = Modifier.fillMaxSize()) {
                          items(todayList) { patient ->
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 5.dp)
                                      .clickable { onPatientClick(patient) },
                                  colors = CardDefaults.cardColors(containerColor = cardBg),
                                  elevation = CardDefaults.cardElevation(2.dp),
                                  shape = RoundedCornerShape(10.dp)
                              ) {
                                  Column(modifier = Modifier.padding(12.dp)) {
                                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                          Text(patient.name, fontWeight = FontWeight.Bold, fontSize = (15 * scale).sp, color = textColor)
                                          Text(patient.timeSlot, fontSize = (11 * scale).sp, color = Color.Gray, fontWeight = FontWeight.Medium)
                                      }
                                      Text("👨‍⚕️ ${patient.doctorName}", fontSize = (12 * scale).sp, color = Color(0xFF1565C0), fontWeight = FontWeight.SemiBold)
                                      Text("📍 ${patient.village} | 📞 ${patient.phone} | Age: ${patient.age}", fontSize = (12 * scale).sp, color = bodyTextColor)
                                      
                                      Spacer(modifier = Modifier.height(4.dp))
                                      Surface(
                                          color = Color(0xFFF1F5F9),
                                          shape = RoundedCornerShape(6.dp),
                                          modifier = Modifier.fillMaxWidth()
                                      ) {
                                          Column(modifier = Modifier.padding(8.dp)) {
                                              Text("🩺 રોગ: ${patient.disease.ifBlank { "N/A" }}", fontSize = (12 * scale).sp, color = Color(0xFFC62828), fontWeight = FontWeight.SemiBold)
                                              Text("💊 દવા: ${patient.medicine.ifBlank { "N/A" }}", fontSize = (12 * scale).sp, color = Color(0xFF0288D1))
                                          }
                                      }

                                      Spacer(modifier = Modifier.height(6.dp))
                                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                          Text("₹${patient.amount} (${patient.paymentMode})", color = Color(0xFF2E7D32), fontWeight = FontWeight.Bold, fontSize = (13 * scale).sp)
                                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                              OutlinedButton(
                                                  onClick = { onPatientClick(patient) },
                                                  contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp)
                                              ) {
                                                  Text("History", fontSize = (11 * scale).sp)
                                              }
                                              Button(
                                                  onClick = { sendWhatsAppAppointmentOnly(context, patient) },
                                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF25D366)),
                                                  contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp)
                                              ) {
                                                  Text("WhatsApp Slot", fontSize = (11 * scale).sp, color = Color.White)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun NewCheckupScreen(
              patientList: List<Patient>,
              scale: Float,
              cardBg: Color,
              textColor: Color,
              nameInput: String, onNameChange: (String) -> Unit,
              phoneInput: String, onPhoneChange: (String) -> Unit,
              villageInput: String, onVillageChange: (String) -> Unit,
              ageInput: String, onAgeChange: (String) -> Unit,
              diseaseInput: String, onDiseaseChange: (String) -> Unit,
              medicineInput: String, onMedicineChange: (String) -> Unit,
              amountInput: String, onAmountChange: (String) -> Unit,
              paymentMode: String, onPaymentChange: (String) -> Unit,
              doctorName: String, onDoctorChange: (String) -> Unit,
              selectedSlot: String, onSlotChange: (String) -> Unit,
              onSubmit: (Patient) -> Unit,
              onSelectExisting: (Patient) -> Unit
          ) {
              val scrollState = rememberScrollState()

              // Auto Match Returning Patients
              val matchingPatients = remember(phoneInput, nameInput) {
                  if (phoneInput.length >= 3 || nameInput.length >= 2) {
                      patientList.filter {
                          (phoneInput.isNotBlank() && it.phone.contains(phoneInput)) ||
                          (nameInput.isNotBlank() && it.name.contains(nameInput, ignoreCase = true))
                      }.distinctBy { it.phone }
                  } else emptyList()
              }

              // Auto Search English Medical Conditions
              val suggestedConditions = remember(diseaseInput) {
                  if (diseaseInput.isNotBlank()) {
                      MedicalDictionary.search(diseaseInput)
                  } else emptyList()
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(scrollState)
                      .padding(16.dp)
              ) {
                  Text("🩺 Patient Appointment & Clinical Entry", fontWeight = FontWeight.Bold, fontSize = (18 * scale).sp, color = textColor)
                  Spacer(modifier = Modifier.height(10.dp))

                  if (matchingPatients.isNotEmpty()) {
                      Card(
                          modifier = Modifier.fillMaxWidth().padding(bottom = 10.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFFFF9C4))
                      ) {
                          Column(modifier = Modifier.padding(10.dp)) {
                              Text("⚡ Returning Patient! Tap to auto-fill:", fontWeight = FontWeight.Bold, fontSize = (12 * scale).sp, color = Color(0xFFF57F17))
                              matchingPatients.take(3).forEach { oldP ->
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable { onSelectExisting(oldP) }
                                          .padding(vertical = 4.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Text("👤 ${oldP.name} (${oldP.village})", fontSize = (12 * scale).sp, fontWeight = FontWeight.Medium)
                                      Text("Fill ➡️", fontSize = (11 * scale).sp, color = Color(0xFF0D276B))
                                  }
                              }
                          }
                      }
                  }

                  OutlinedTextField(
                      value = phoneInput,
                      onValueChange = onPhoneChange,
                      label = { Text("Mobile Number (વોટ્સએપ નંબર)", fontSize = (13 * scale).sp) },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedTextField(
                      value = nameInput,
                      onValueChange = onNameChange,
                      label = { Text("Patient Full Name (દર્દીનું નામ)", fontSize = (13 * scale).sp) },
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(8.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(
                          value = ageInput,
                          onValueChange = onAgeChange,
                          label = { Text("Age (ઉંમર)", fontSize = (13 * scale).sp) },
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                          modifier = Modifier.weight(1f)
                      )
                      OutlinedTextField(
                          value = villageInput,
                          onValueChange = onVillageChange,
                          label = { Text("Village (ગામ)", fontSize = (13 * scale).sp) },
                          modifier = Modifier.weight(1.5f)
                      )
                  }
                  Spacer(modifier = Modifier.height(8.dp))

                  Text("Select Doctor & Timing:", fontSize = (13 * scale).sp, fontWeight = FontWeight.Medium, color = textColor)
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      FilterChip(
                          selected = doctorName == "DR. BIRJU K. SIRODARIA",
                          onClick = {
                              onDoctorChange("DR. BIRJU K. SIRODARIA")
                              onSlotChange(getMorningSlots().first())
                          },
                          label = { Text("Dr. Birju (Morning)", fontSize = (11 * scale).sp) }
                      )
                      FilterChip(
                          selected = doctorName == "DR. NIDDHI JAVIA",
                          onClick = {
                              onDoctorChange("DR. NIDDHI JAVIA")
                              onSlotChange(getEveningSlots().first())
                          },
                          label = { Text("Dr. Niddhi (Evening)", fontSize = (11 * scale).sp) }
                      )
                  }
                  Spacer(modifier = Modifier.height(6.dp))

                  OutlinedCard(modifier = Modifier.fillMaxWidth()) {
                      Column(modifier = Modifier.padding(10.dp)) {
                          Text("⏰ Current Time Slot: $selectedSlot", fontWeight = FontWeight.Bold, fontSize = (12 * scale).sp, color = Color(0xFF1565C0))
                          Text("Change slot directly from 'Dr. Slots' tab.", fontSize = (10 * scale).sp, color = Color.Gray)
                      }
                  }
                  Spacer(modifier = Modifier.height(10.dp))

                  // Smart Disease Auto-Suggest Search Input
                  Text("🩺 Smart Diagnosis (બીમારી / રોગનું નામ ટાઈપ કરો):", fontWeight = FontWeight.Bold, fontSize = (13 * scale).sp, color = textColor)
                  Spacer(modifier = Modifier.height(4.dp))

                  OutlinedTextField(
                      value = diseaseInput,
                      onValueChange = onDiseaseChange,
                      label = { Text("Type English / Gujarati keyword (e.g. BP, Sugar, Taav, Gas)", fontSize = (12 * scale).sp) },
                      modifier = Modifier.fillMaxWidth(),
                      leadingIcon = { Icon(Icons.Default.Search, contentDescription = null) }
                  )

                  // Instant Auto-Suggestion Dropdown Card
                  if (suggestedConditions.isNotEmpty()) {
                      Card(
                          modifier = Modifier.fillMaxWidth().padding(top = 4.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFE8F5E9)),
                          elevation = CardDefaults.cardElevation(3.dp)
                      ) {
                          Column(modifier = Modifier.padding(8.dp)) {
                              Text("💡 Tap below to auto-fill Disease & Standard Medicine:", fontSize = (11 * scale).sp, fontWeight = FontWeight.Bold, color = Color(0xFF2E7D32))
                              suggestedConditions.take(4).forEach { cond ->
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable {
                                              onDiseaseChange(cond.name)
                                              if (medicineInput.isBlank()) {
                                                  onMedicineChange(cond.defaultMedicine)
                                              }
                                          }
                                          .padding(vertical = 6.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text("• ${cond.name}", fontWeight = FontWeight.SemiBold, fontSize = (12 * scale).sp, color = Color(0xFF1B5E20))
                                          Text("Rx: ${cond.defaultMedicine}", fontSize = (10 * scale).sp, color = Color(0xFF388E3C), maxLines = 1)
                                      }
                                      Text("Select ➡️", fontSize = (11 * scale).sp, color = Color(0xFF1565C0), fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedTextField(
                      value = medicineInput,
                      onValueChange = onMedicineChange,
                      label = { Text("Prescribed Medicine / Treatment (દવાઓની વિગત)", fontSize = (13 * scale).sp) },
                      modifier = Modifier.fillMaxWidth(),
                      minLines = 2
                  )
                  Spacer(modifier = Modifier.height(10.dp))

                  Text("💰 Payment & Fees Slot (ફી અને ચુકવણી)", fontWeight = FontWeight.Bold, fontSize = (13 * scale).sp, color = textColor)
                  Spacer(modifier = Modifier.height(4.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(
                          value = amountInput,
                          onValueChange = onAmountChange,
                          label = { Text("Fees (₹)", fontSize = (13 * scale).sp) },
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                          modifier = Modifier.weight(1f)
                      )
                      Column(modifier = Modifier.weight(1.5f)) {
                          Text("Payment Mode", fontSize = (11 * scale).sp, color = Color.Gray)
                          Row {
                              FilterChip(
                                  selected = paymentMode == "Cash",
                                  onClick = { onPaymentChange("Cash") },
                                  label = { Text("💵 Cash", fontSize = (11 * scale).sp) }
                              )
                              Spacer(modifier = Modifier.width(4.dp))
                              FilterChip(
                                  selected = paymentMode == "Online",
                                  onClick = { onPaymentChange("Online") },
                                  label = { Text("📲 Online", fontSize = (11 * scale).sp) }
                              )
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  Button(
                      onClick = {
                          if (nameInput.isNotBlank()) {
                              val p = Patient(
                                  name = nameInput.trim(),
                                  phone = phoneInput.trim(),
                                  village = villageInput.trim(),
                                  age = ageInput.trim(),
                                  disease = diseaseInput.trim(),
                                  medicine = medicineInput.trim(),
                                  amount = amountInput.trim(),
                                  paymentMode = paymentMode,
                                  doctorName = doctorName,
                                  timeSlot = selectedSlot,
                                  date = getCurrentDate()
                              )
                              onSubmit(p)
                          }
                      },
                      modifier = Modifier.fillMaxWidth().height(50.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B)),
                      shape = RoundedCornerShape(10.dp)
                  ) {
                      Text("BOOK & SEND APPOINTMENT WHATSAPP 🚀", fontWeight = FontWeight.Bold, fontSize = (13 * scale).sp)
                  }
              }
          }

          @Composable
          fun PatientHistoryScreen(
              patientList: List<Patient>,
              query: String,
              scale: Float,
              cardBg: Color,
              textColor: Color,
              onQueryChange: (String) -> Unit,
              onSelectPatient: (Patient) -> Unit
          ) {
              val filtered = remember(query, patientList) {
                  if (query.isBlank()) {
                      patientList.distinctBy { it.phone.ifBlank { it.name } }
                  } else {
                      patientList.filter {
                          it.name.contains(query, ignoreCase = true) ||
                          it.phone.contains(query) ||
                          it.village.contains(query, ignoreCase = true) ||
                          it.disease.contains(query, ignoreCase = true)
                      }.distinctBy { it.phone.ifBlank { it.name } }
                  }
              }

              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Text("🔍 Patient Medical History Finder", fontWeight = FontWeight.Bold, fontSize = (18 * scale).sp, color = textColor)
                  Spacer(modifier = Modifier.height(10.dp))

                  OutlinedTextField(
                      value = query,
                      onValueChange = onQueryChange,
                      placeholder = { Text("Search by name, phone, village or disease...", fontSize = (13 * scale).sp) },
                      leadingIcon = { Icon(Icons.Default.Search, contentDescription = null) },
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(12.dp)
                  )
                  Spacer(modifier = Modifier.height(10.dp))

                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                      items(filtered) { patient ->
                          val visitCount = patientList.count { it.phone == patient.phone || it.name.equals(patient.name, ignoreCase = true) }
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 5.dp)
                                  .clickable { onSelectPatient(patient) },
                              colors = CardDefaults.cardColors(containerColor = cardBg),
                              elevation = CardDefaults.cardElevation(2.dp),
                              shape = RoundedCornerShape(10.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth().padding(14.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(patient.name, fontWeight = FontWeight.Bold, fontSize = (15 * scale).sp, color = textColor)
                                      Text("📞 ${patient.phone} | 📍 ${patient.village}", fontSize = (12 * scale).sp, color = Color.Gray)
                                      Text("Last Visit: ${patient.date} • ${patient.disease}", fontSize = (11 * scale).sp, color = Color(0xFFD32F2F))
                                  }
                                  Surface(
                                      color = Color(0xFFE3F2FD),
                                      shape = RoundedCornerShape(20.dp)
                                  ) {
                                      Text(
                                          text = "$visitCount Visits",
                                          modifier = Modifier.padding(horizontal = 10.dp, vertical = 5.dp),
                                          fontSize = (11 * scale).sp,
                                          fontWeight = FontWeight.Bold,
                                          color = Color(0xFF1565C0)
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(
              isDarkMode: Boolean,
              onToggleDarkMode: (Boolean) -> Unit,
              textScale: TextScale,
              onSelectTextScale: (TextScale) -> Unit,
              scale: Float,
              cardBg: Color,
              textColor: Color
          ) {
              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("⚙️ App Settings (સેટિંગ્સ)", fontWeight = FontWeight.Bold, fontSize = (18 * scale).sp, color = textColor)
                  Spacer(modifier = Modifier.height(16.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = cardBg),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth().padding(16.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text("Dark Mode (ડાર્ક મોડ)", fontWeight = FontWeight.Bold, fontSize = (15 * scale).sp, color = textColor)
                              Text(if (isDarkMode) "Dark theme enabled" else "Light theme enabled", fontSize = (12 * scale).sp, color = Color.Gray)
                          }
                          Switch(
                              checked = isDarkMode,
                              onCheckedChange = onToggleDarkMode
                          )
                      }
                  }

                  Spacer(modifier = Modifier.height(14.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = cardBg),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("Text Size (અક્ષરોની સાઈઝ)", fontWeight = FontWeight.Bold, fontSize = (15 * scale).sp, color = textColor)
                          Text("તમારી અનુકૂળતા મુજબ અક્ષરો નાના કે મોટા કરો:", fontSize = (12 * scale).sp, color = Color.Gray)
                          Spacer(modifier = Modifier.height(10.dp))

                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              TextScale.values().forEach { ts ->
                                  FilterChip(
                                      selected = textScale == ts,
                                      onClick = { onSelectTextScale(ts) },
                                      label = { Text(ts.label, fontSize = (12 * scale).sp) }
                                  )
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(14.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = cardBg),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("🏥 Aastha Clinic System", fontWeight = FontWeight.Bold, fontSize = (14 * scale).sp, color = Color(0xFF0D276B))
                          Spacer(modifier = Modifier.height(4.dp))
                          Text("• Smart Medical Auto-Suggest: Active", fontSize = (12 * scale).sp, color = Color(0xFF2E7D32), fontWeight = FontWeight.SemiBold)
                          Text("• Offline Storage: Active (No Internet Required)", fontSize = (12 * scale).sp)
                          Text("• Online Cloud Sync: Automatic", fontSize = (12 * scale).sp)
                          Text("• Dr. Birju K. Sirodaria (11:00 AM - 03:30 PM)", fontSize = (12 * scale).sp)
                          Text("• Dr. Niddhi Javia (05:00 PM - 08:00 PM)", fontSize = (12 * scale).sp)
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          chmod +x gradlew || gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aastha-Clinic-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
