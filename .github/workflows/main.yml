name: Build Aastha Clinic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Project and Files
        run: |
          rm -rf app gradle settings.gradle build.gradle gradlew gradlew.bat
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/aastha/clinic
          mkdir -p gradle/wrapper

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AasthaClinic"
          include ':app'
          EOF

          # 2. build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aastha.clinic'
              compileSdk 34

              defaultConfig {
                  applicationId "com.aastha.clinic"
                  minSdk 24
                  targetSdk 34
                  versionCode 10
                  versionName "10.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Aastha Clinic"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AasthaClinic">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Resources
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#0D276B</color>
              <color name="primary_dark">#081842</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AasthaClinic" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
              </style>
          </resources>
          EOF

          # 6. Logo Vector
          cat << 'EOF' > app/src/main/res/drawable/ic_aastha_brand_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="200dp"
              android:height="200dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M43,38 h14 v26 h-14 z"/>
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M37,44 h26 v14 h-26 z"/>
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M50,14 a5,5 0 1,0 0.1,0 z M41,22 c-3,0 -6,2 -7,5 l4,2 c1,-2 2,-3 3,-3 c2,0 3,1 4,3 l4,-2 c-1,-3 -4,-5 -8,-5 z M59,22 c-4,0 -7,2 -8,5 l4,2 c1,-2 2,-3 4,-3 c1,0 2,1 3,3 l4,-2 c-1,-3 -4,-5 -7,-5 z"/>
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M26,38 C26,54 37,64 50,68 C35,62 30,49 30,38 Z M74,38 C74,54 63,64 50,68 C65,62 70,49 70,38 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_aastha_brand_logo"/>
          </adaptive-icon>
          EOF

          # 7. Web UI Assets (Auto-Fill & Cloud Sync Logic)
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="gu">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>Aastha Clinic</title>
            <style>
              * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
              body { background-color: #F4F6F9; margin: 0; padding: 12px; }
              .header { background: #0D276B; color: white; padding: 16px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(13,39,107,0.2); }
              .header h2 { margin: 0; font-size: 18px; }
              .header p { margin: 2px 0 0; font-size: 12px; color: #BBDEFB; }
              .sync-btn { background: #1976D2; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
              .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
              .search-card { background: #E3F2FD; border: 1px solid #BBDEFB; }
              .label { font-size: 13px; font-weight: bold; color: #0D276B; margin-bottom: 6px; display: block; }
              input, textarea { width: 100%; padding: 10px; border: 1px solid #CFD8DC; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; background: #FAFAFA; }
              input:focus, textarea:focus { border-color: #0D276B; background: #FFFFFF; }
              textarea { resize: vertical; min-height: 50px; }
              .btn-save { width: 100%; background: #0D276B; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
              .history-item { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 13px; }
              .history-date { color: #0284C7; font-weight: bold; margin-bottom: 4px; }
            </style>
          </head>
          <body>

          <div class="header">
            <div>
              <h2>Aastha Clinic</h2>
              <p>દર્દી રજીસ્ટ્રેશન & રેકોર્ડ</p>
            </div>
            <button class="sync-btn" onclick="syncData()">Sync 🔄</button>
          </div>

          <div class="card search-card">
            <span class="label">🔍 જૂના દર્દી શોધો (નામ અથવા મોબાઈલ):</span>
            <input type="text" id="searchQuery" placeholder="દા.ત. Raju Pandit અથવા 9898..." oninput="searchPatient()">
          </div>

          <div class="card">
            <span class="label">દર્દીની વિગત ઉમેરો:</span>
            <input type="text" id="patientName" placeholder="દર્દીનું પૂરું નામ">
            <input type="text" id="patientVillage" placeholder="ગામ / શહેર">
            <input type="tel" id="patientMobile" placeholder="મોબાઈલ નંબર">
            <textarea id="patientDisease" placeholder="શેના માટે દવા લીધી (તકલીફ / રોગ)"></textarea>
            <textarea id="patientMedicine" placeholder="આપેલી દવાઓની વિગત"></textarea>
            <button class="btn-save" id="btnSave" onclick="saveRecord()">ડેટા સેવ કરો (Save Visit)</button>
          </div>

          <div id="historySection" style="display:none;">
            <span class="label">📋 અગાઉની હિસ્ટ્રી:</span>
            <div id="historyList"></div>
          </div>

          <script>
            const CLOUD_URL = "https://jsonblob.com/api/jsonBlob/1341050011854495744";
            let patientsDB = JSON.parse(localStorage.getItem('aastha_local_db') || "[]");

            async function syncData() {
              try {
                const res = await fetch(CLOUD_URL, { cache: 'no-store' });
                if (res.ok) {
                  const data = await res.json();
                  if (Array.isArray(data)) {
                    patientsDB = data;
                    localStorage.setItem('aastha_local_db', JSON.stringify(data));
                  }
                }
              } catch(e) {}
            }
            syncData();

            function searchPatient() {
              const q = document.getElementById('searchQuery').value.trim().toLowerCase();
              const histSec = document.getElementById('historySection');
              const histList = document.getElementById('historyList');

              if (q.length < 2) {
                histSec.style.display = 'none';
                return;
              }

              const matches = patientsDB.filter(p => 
                (p.name && p.name.toLowerCase().includes(q)) || 
                (p.phone && p.phone.includes(q))
              );

              if (matches.length > 0) {
                const last = matches[matches.length - 1];
                document.getElementById('patientName').value = last.name;
                document.getElementById('patientVillage').value = last.village;
                document.getElementById('patientMobile').value = last.phone;

                let html = '';
                matches.slice().reverse().forEach(item => {
                  html += `
                    <div class="history-item">
                      <div class="history-date">📅 ${item.date}</div>
                      <div><strong>🩺 રોગ:</strong> ${item.disease}</div>
                      <div><strong>💊 દવા:</strong> ${item.medicine || 'વિગત નથી'}</div>
                    </div>
                  `;
                });
                histList.innerHTML = html;
                histSec.style.display = 'block';
              } else {
                histSec.style.display = 'none';
              }
            }

            async function saveRecord() {
              const name = document.getElementById('patientName').value.trim();
              const village = document.getElementById('patientVillage').value.trim();
              const phone = document.getElementById('patientMobile').value.trim();
              const disease = document.getElementById('patientDisease').value.trim();
              const medicine = document.getElementById('patientMedicine').value.trim();

              if (!name || !phone) {
                alert("નામ અને મોબાઈલ નંબર જરૂરી છે!");
                return;
              }

              const btn = document.getElementById('btnSave');
              btn.innerText = "સેવ થઈ રહ્યું છે...";
              btn.disabled = true;

              const now = new Date();
              const dateStr = now.getDate().toString().padStart(2,'0') + '-' + 
                              (now.getMonth()+1).toString().padStart(2,'0') + '-' + 
                              now.getFullYear() + ' ' + 
                              now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

              const newRecord = { id: Date.now().toString(), name, phone, village, disease, medicine, date: dateStr };
              patientsDB.push(newRecord);
              localStorage.setItem('aastha_local_db', JSON.stringify(patientsDB));

              try {
                await fetch(CLOUD_URL, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(patientsDB)
                });
              } catch(e) {}

              alert("ડેટા સફળતાપૂર્વક સેવ અને સિંક થઈ ગયો!");
              document.getElementById('patientDisease').value = '';
              document.getElementById('patientMedicine').value = '';
              btn.innerText = "ડેટા સેવ કરો (Save Visit)";
              btn.disabled = false;
            }
          </script>
          </body>
          </html>
          EOF

          # 8. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/aastha/clinic/MainActivity.java
          package com.aastha.clinic;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aastha-Clinic-Pro-App
          path: app/build/outputs/apk/debug/*.apk
