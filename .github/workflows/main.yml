              }

              // Bharat Ko Jano Folders
              fun getBharatKoJanoFolders(): List<FolderItem> {
                  return listOf(
                      FolderItem(
                          title = "રાષ્ટ્રીય પ્રતીકો (National Symbols)",
                          subtitle = "Official Symbols of India",
                          icon = "🇮🇳",
                          details = listOf(
                              "રાષ્ટ્રીય ધ્વજ" to "તિરંગો (કેસરી, સફેદ, લીલો અને ૨૪ આરાવાળું અશોક ચક્ર)",
                              "રાષ્ટ્રીય ચિહ્ન" to "અશોક સ્તંભ (સત્યમેવ જયતે)",
                              "રાષ્ટ્રગીત" to "જન ગણ મન (રવીન્દ્રનાથ ટાગોર)",
                              "રાષ્ટ્રીય ગાન" to "વંદે માતરમ્ (બંકિમચંદ્ર ચટ્ટોપાધ્યાય)",
                              "રાષ્ટ્રીય પક્ષી" to "મોર (Peacock)",
                              "રાષ્ટ્રીય પ્રાણી" to "વાઘ (Royal Bengal Tiger)",
                              "રાષ્ટ્રીય નદી" to "ગંગા (Ganga)"
                          )
                      ),
                      FolderItem(
                          title = "મહાન દેશભક્તો & મહાનુભાવો",
                          subtitle = "Great Personalities of India",
                          icon = "🎖️",
                          details = listOf(
                              "મહાત્મા ગાંધી" to "રાષ્ટ્રપિતા - સત્ય અને અહિંસાના પ્રણેતા",
                              "સરદાર વલ્લભભાઈ પટેલ" to "લોખંડી પુરુષ - ૫૬૨ રજવાડાંઓનું એકીકરણ કર્યું",
                              "ડૉ. બાબાસાહેબ આંબેડકર" to "ભારતીય બંધારણના ઘડવૈયા",
                              "ડૉ. એ. પી. જે. અબ્દુલ કલામ" to "મિસાઇલ મેન અને ભારતના ભૂતપૂર્વ રાષ્ટ્રપતિ"
                          )
