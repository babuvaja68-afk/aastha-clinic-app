                              "ડોક્ટર સાથે વાતચીત" to "I have a headache and fever. (મને માથાનો દુખાવો અને તાવ છે.)",
                              "સમય પૂછવા માટે" to "What time is it now? (અત્યારે કેટલા વાગ્યા છે?)"
