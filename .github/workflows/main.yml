name: Build GSEB VidyaSetu App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Complete Offline Education App with Full Books and Swadhyay Solutions
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/gseb/vidyasetu
          mkdir -p gradle/wrapper

          # 0. Gradle Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "GSEBVidyaSetu"
          include ':app'
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.gseb.vidyasetu'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gseb.vidyasetu"
                  minSdk 24
                  targetSdk 34
                  versionCode 13
                  versionName "13.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="GSEB વિદ્યાસેતુ"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # EDUCATION VECTOR LOGO
          cat << 'EOF' > app/src/main/res/drawable/ic_education_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M54,8 C79.4,8 100,28.6 100,54 C100,79.4 79.4,100 54,100 C28.6,100 8,79.4 8,54 C8,28.6 28.6,8 54,8 Z"/>
              <path
                  android:strokeColor="#FFC107"
                  android:strokeWidth="2"
                  android:pathData="M54,12 C77.2,12 96,30.8 96,54 C96,77.2 77.2,96 54,96 C30.8,96 12,77.2 12,54 C12,30.8 30.8,12 54,12 Z"/>
              <path
                  android:fillColor="#FFA000"
                  android:pathData="M54,42 m-10,0 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0"/>
              <path
                  android:fillColor="#FFD54F"
                  android:pathData="M54,20 L78,30 L54,40 L30,30 Z"/>
              <path
                  android:fillColor="#FFB300"
                  android:pathData="M38,34 L38,44 C38,49 50,54 54,54 C58,54 70,49 70,44 L70,34 L54,41 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M72,32 L76,46 L73,46 L70,33 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,56 C34,53 46,55 53,60 L53,84 C46,79 34,77 24,80 Z"/>
              <path
                  android:fillColor="#ECEFF1"
                  android:pathData="M84,56 C74,53 62,55 55,60 L55,84 C62,79 74,77 84,80 Z"/>
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M53,60 L55,60 L55,84 L53,84 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_education_logo"/>
          </adaptive-icon>
          EOF

          # Main Application Source Code
          cat << 'EOF' > app/src/main/java/com/gseb/vidyasetu/MainActivity.kt
          package com.gseb.vidyasetu

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          enum class AppMedium { GUJARATI, ENGLISH }

          data class QuestionAnswer(
              val question: String,
              val answer: String,
              val type: String = "સ્વાધ્યાય પ્રશ્ન / Solution"
          )

          data class Chapter(
              val chapterNumber: Int,
              val titleGu: String,
              val titleEn: String,
              val fullBookContentGu: String,
              val fullBookContentEn: String,
              val swadhyayAnswersGu: List<QuestionAnswer>,
              val swadhyayAnswersEn: List<QuestionAnswer>
          )

          data class Subject(
              val nameGu: String,
              val nameEn: String,
              val iconEmoji: String,
              val color: Color,
              val chapters: List<Chapter>
          )

          data class Standard(
              val stdNumber: Int,
              val nameGu: String,
              val nameEn: String,
              val sectionGu: String,
              val sectionEn: String,
              val subjects: List<Subject>
          )

          data class FolderItem(
              val titleGu: String,
              val titleEn: String,
              val subtitleGu: String,
              val subtitleEn: String,
              val icon: String,
              val fullArticleGu: String,
              val fullArticleEn: String,
              val detailsGu: List<Pair<String, String>>,
              val detailsEn: List<Pair<String, String>>
          )

          object EducationRepository {
              fun getStandards(): List<Standard> {
                  return (1..12).map { std ->
                      val sectionGu = when (std) {
                          in 1..5 -> "પ્રાથમિક વિભાગ (ધોરણ ૧-૫)"
                          in 6..8 -> "ઉચ્ચ પ્રાથમિક વિભાગ (ધોરણ ૬-૮)"
                          in 9..10 -> "માધ્યમિક વિભાગ (ધોરણ ૯-૧૦)"
                          else -> "ઉચ્ચતર માધ્યમિક વિભાગ (ધોરણ ૧૧-૧૨)"
                      }
                      val sectionEn = when (std) {
                          in 1..5 -> "Primary Section (Std 1-5)"
                          in 6..8 -> "Upper Primary Section (Std 6-8)"
                          in 9..10 -> "Secondary Section (Std 9-10)"
                          else -> "Higher Secondary Section (Std 11-12)"
                      }

                      val subjects = when (std) {
                          10 -> listOf(
                              Subject(
                                  nameGu = "ગુજરાતી (પ્રથમ ભાષા - સાહિત્ય)",
                                  nameEn = "Gujarati (First Language)",
                                  iconEmoji = "📖",
                                  color = Color(0xFF8E24AA),
                                  chapters = listOf(
                                      Chapter(
                                          chapterNumber = 1,
                                          titleGu = "કાવ્ય ૧: વૈષ્ણવજન (પદ - નરસિંહ મહેતા)",
                                          titleEn = "Poem 1: Vaishnav Jan To",
                                          fullBookContentGu = """
                                              📜 સંપૂર્ણ કાવ્ય પંક્તિઓ અને વિગત:
                                              
                                              વૈષ્ણવજન તો તેને રે કહીએ, જે પીડ પરાઈ જાણે રે,
                                              પરદુઃખે ઉપકાર કરે તોયે, મન અભિમાન ન આણે રે.
                                              
                                              સકળ લોકમાં સહુને વંદે, નિંદા ન કરે કેની રે,
                                              વાચ કાછ મન નિર્મળ રાખે, ધન ધન જનની તેની રે.
                                              
                                              સમદૃષ્ટિ ને તૃષ્ણા ત્યાગી, પરસ્ત્રી જેને માત રે,
                                              જિહ્વા થકી અસત્ય ન બોલે, પરધન નવ ઝાલે હાથ રે.
                                              
                                              મોહ માયા વ્યાપે નહિ જેને, દૃઢ વૈરાગ્ય જેના મનમાં રે,
                                              રામનામ શૂં તાળી રે લાગી, સકળ તીરથ તેના તનમાં રે.
                                              
                                              વણલોભી ને કપટરહિત છે, કામ ક્રોધ નિવાર્યા રે,
                                              ભણે નરસૈંયો તેનું દર્શન કરતાં, કુળ એકોતેર તાર્યા રે.
                                              
                                              📖 કાવ્યનો સરળ ભાવાર્થ:
                                              નરસિંહ મહેતા આ પદમાં સાચા સજ્જન (વૈષ્ણવજન) ના ઉત્તમ લક્ષણો સમજાવે છે. સાચો માણસ તે છે જે બીજાના દુઃખ અને પીડાને પોતાની સમજે છે. કોઈના પર ઉપકાર કરે તો પણ પોતાના મનમાં લેશમાત્ર અહંકાર લાવતો નથી. તે સમગ્ર સંસારમાં સૌનો આદર કરે છે, કોઈની પણ નિંદા કરતો નથી અને પોતાની વાણી, ચારિત્ર્ય અને મનને સદા પવિત્ર રાખે છે.
                                          """.trimIndent(),
                                          fullBookContentEn = """
                                              📜 Complete Poem and Meaning:
                                              'Vaishnav Jan To Tene Kahiye, Je Peed Parayi Jane Re...'
                                              Authored by the legendary 15th-century poet Narsinh Mehta, this devotional hymn was deeply cherished by Mahatma Gandhi.
                                              
                                              📖 Meaning:
                                              A true noble soul (Vaishnav) is one who deeply feels and relieves the pain of others without harboring pride or ego. Such a person respects every living being, never speaks ill of anyone, maintains pure speech, mind and conduct, treats every woman as a mother, never utters falsehood, and never covets wealth that belongs to others.
                                          """.trimIndent(),
                                          swadhyayAnswersGu = listOf(
                                              QuestionAnswer("સાચા વૈષ્ણવજનના મુખ્ય લક્ષણો કયા કયા છે?", "સંપૂર્ણ જવાબ:\n૧. તે હંમેશા પારકાના દુઃખ-દર્દને સમજે છે અને મદદ કરે છે.\n૨. ઉપકાર કર્યા પછી પણ મનમાં સહેજ પણ અભિમાન લાવતો નથી.\n૩. તે આખા વિશ્વમાં બધાને વંદન કરે છે અને કોઈની પણ નિંદા કરતો નથી.\n૪. તે પરસ્ત્રીને માતા સમાન ગણે છે અને ક્યારેય અસત્ય બોલતો નથી.\n૫. તે પરધન (બીજાના ધન) ને ક્યારેય હાથ અડાડતો નથી અને મોહ-માયાથી પર રહે છે."),
                                              QuestionAnswer("'ધન ધન જનની તેની રે' - કવિ આવું કોના માટે કહે છે?", "સંપૂર્ણ જવાબ:\nજે વ્યક્તિ પોતાની વાણી, ચારિત્ર્ય અને મનને સંપૂર્ણ પવિત્ર રાખે છે અને નિર્મળ જીવન જીવે છે, તેની માતાને કવિ ધન્ય ગણે છે."),
                                              QuestionAnswer("નરસિંહ મહેતા કોના દર્શન કરવાથી કુળ એકોતેર તાર્યાનું કહે છે?", "સંપૂર્ણ જવાબ:\nજે વ્યક્તિ લોભ અને કપટ રહિત હોય, જેણે કામ અને ક્રોધ પર વિજય મેળવ્યો હોય તેવા સાચા વૈષ્ણવજનના દર્શન માત્રથી ૭૧ પેઢીઓ તરી જાય છે.")
                                          ),
                                          swadhyayAnswersEn = listOf(
                                              QuestionAnswer("What are the key qualities of a Vaishnav Jan?", "Complete Answer:\n1. Empathizes deeply with others' suffering and offers selfless help.\n2. Never holds pride or ego after helping someone.\n3. Respects all beings and refrains from backbiting or criticizing.\n4. Treats all women with maternal respect and never lies.\n5. Keeps mind and speech pure, remaining detached from greed."),
                                              QuestionAnswer("Why does the poet praise the mother of a noble person?", "Complete Answer:\nThe mother who gives birth to a person of pure speech, unblemished character, and noble conduct deserves the highest divine praise.")
                                          )
                                      ),
                                      Chapter(
                                          chapterNumber = 2,
                                          titleGu = "પાઠ ૨: રેસનો ઘોડો (નવલિકા - વર્ષા અડાલજા)",
                                          titleEn = "Chapter 2: Race No Ghodo",
                                          fullBookContentGu = """
                                              📘 સંપૂર્ણ વાર્તા (Full Story):
                                              વિનુકાકા પોતાના દીકરા સૌરભને નાનપણથી જ અભ્યાસમાં હંમેશા પ્રથમ લાવવા માટે દબાણ કરે છે. તેઓ માનતા હતા કે શિક્ષણ એટલે ફક્ત ટકા અને ડિગ્રી મેળવવાની સ્પર્ધા. તેઓ સૌરભને સતત ક્લાસ, કમ્પ્યુટર અને ભણતરમાં જોતરી રાખે છે, જાણે કે કોઈ 'રેસનો ઘોડો' દોડતો હોય!
                                              
                                              તેમની બાજુમાં રહેતો અંકિત (નીનાબહેન અને સંજયનો દીકરો) પણ સૌરભ સાથે જ ભણતો હતો. પરંતુ અંકિતના માતા-પિતા તેને મુક્ત બાળપણ, રમતો અને સંસ્કારો આપવા માંગતા હતા. જ્યારે અંકિત બીમાર પડ્યો ત્યારે તેની માતાએ તેને ટ્યુશનમાંથી ઉઠાડી લીધો અને પ્રેમથી ઉછેર્યો.
                                              
                                              પરિણામ એ આવ્યું કે સૌરભ ભણી-ગણીને મોટો ડોક્ટર બની અમેરિકા જતો રહ્યો, પરંતુ તેની પાસે પોતાના વૃદ્ધ માતા-પિતા માટે સમય કે પ્રેમ નહોતો. જ્યારે અંકિત સામાન્ય નોકરી કરતો હોવા છતાં મા-બાપ સાથે રહ્યો, પરિવારની સેવા કરી અને સાચો સુખી માણસ બન્યો.
                                          """.trimIndent(),
                                          fullBookContentEn = """
                                              📘 Full Story:
                                              Vinu Kaka constantly pressurizes his son Saurabh to top every exam, treating childhood like a competitive horse race. In contrast, Ankit's parents value empathy, happiness, and moral character over mere marks.
                                              Years later, Saurabh becomes a successful doctor in the USA but lacks time and empathy for his aging parents. Ankit, with average grades, stays with his family in India, showering love and taking care of his parents.
