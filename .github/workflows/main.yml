name: Build GSEB VidyaSetu App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Complete Education App with Spoken English and Folders
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/gseb/vidyasetu
          mkdir -p gradle/wrapper

          # 0. Gradle Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "GSEBVidyaSetu"
          include ':app'
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.gseb.vidyasetu'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gseb.vidyasetu"
                  minSdk 24
                  targetSdk 34
                  versionCode 5
                  versionName "5.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="GSEB વિદ્યાસેતુ"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # EDUCATION VECTOR LOGO
          cat << 'EOF' > app/src/main/res/drawable/ic_education_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M54,8 C79.4,8 100,28.6 100,54 C100,79.4 79.4,100 54,100 C28.6,100 8,79.4 8,54 C8,28.6 28.6,8 54,8 Z"/>
              <path
                  android:strokeColor="#FFC107"
                  android:strokeWidth="2"
                  android:pathData="M54,12 C77.2,12 96,30.8 96,54 C96,77.2 77.2,96 54,96 C30.8,96 12,77.2 12,54 C12,30.8 30.8,12 54,12 Z"/>
              <path
                  android:fillColor="#FFA000"
                  android:pathData="M54,42 m-10,0 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0"/>
              <path
                  android:fillColor="#FFD54F"
                  android:pathData="M54,20 L78,30 L54,40 L30,30 Z"/>
              <path
                  android:fillColor="#FFB300"
                  android:pathData="M38,34 L38,44 C38,49 50,54 54,54 C58,54 70,49 70,44 L70,34 L54,41 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M72,32 L76,46 L73,46 L70,33 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,56 C34,53 46,55 53,60 L53,84 C46,79 34,77 24,80 Z"/>
              <path
                  android:fillColor="#ECEFF1"
                  android:pathData="M84,56 C74,53 62,55 55,60 L55,84 C62,79 74,77 84,80 Z"/>
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M53,60 L55,60 L55,84 L53,84 Z"/>
              <path
                  android:fillColor="#90A4AE"
                  android:pathData="M30,62 h16 v2 h-16 z M30,68 h16 v2 h-16 z M30,74 h12 v2 h-12 z"/>
              <path
                  android:fillColor="#90A4AE"
                  android:pathData="M62,62 h16 v2 h-16 z M62,68 h16 v2 h-16 z M66,74 h12 v2 h-12 z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_education_logo"/>
          </adaptive-icon>
          EOF

          # Main Application Source Code
          cat << 'EOF' > app/src/main/java/com/gseb/vidyasetu/MainActivity.kt
          package com.gseb.vidyasetu

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          data class QuestionAnswer(
              val question: String,
              val answer: String,
              val type: String = "સ્વાધ્યાય પ્રશ્ન"
          )

          data class Chapter(
              val chapterNumber: Int,
              val title: String,
              val textbookUrl: String,
              val swadhyayAnswers: List<QuestionAnswer>
          )

          data class Subject(
              val name: String,
              val iconEmoji: String,
              val color: Color,
              val chapters: List<Chapter>
          )

          data class Standard(
              val stdNumber: Int,
              val name: String,
              val section: String,
              val subjects: List<Subject>
          )

          data class FolderItem(
              val title: String,
              val subtitle: String,
              val icon: String,
              val details: List<Pair<String, String>>
          )

          object EducationRepository {
              fun getStandards(): List<Standard> {
                  return (1..12).map { std ->
                      val section = when (std) {
                          in 1..5 -> "પ્રાથમિક વિભાગ (ધોરણ ૧-૫)"
                          in 6..8 -> "ઉચ્ચ પ્રાથમિક વિભાગ (ધોરણ ૬-૮)"
                          in 9..10 -> "માધ્યમિક વિભાગ (ધોરણ ૯-૧૦)"
                          else -> "ઉચ્ચતર માધ્યમિક વિભાગ (ધોરણ ૧૧-૧૨)"
                      }

                      val subjects = when (std) {
                          10 -> listOf(
                              Subject("ગણિત (Mathematics)", "📐", Color(0xFF1E88E5), listOf(
                                  Chapter(1, "વાસ્તવિક સંખ્યાઓ", "https://gujarat-education.gov.in/Textbook", listOf(
                                      QuestionAnswer("યુક્લિડની ભાગપ્રવિધિથી ગુ.સા.અ.(135, 225) શોધો.", "જવાબ: 225 = 135 × 1 + 90\n135 = 90 × 1 + 45\n90 = 45 × 2 + 0\nશેષ શૂન્ય થતાં ગુ.સા.અ. = 45.")
                                  ))
                              )),
                              Subject("વિજ્ઞાન (Science)", "🔬", Color(0xFF43A047), listOf(
                                  Chapter(1, "રાસાયણિક પ્રક્રિયાઓ અને સમીકરણો", "https://gujarat-education.gov.in/Textbook", listOf(
                                      QuestionAnswer("વિસ્થાપન પ્રક્રિયા એટલે શું? ઉદાહરણ આપો.", "જવાબ: Fe + CuSO₄ -> FeSO₄ + Cu. વધુ સક્રિય તત્વ ઓછા સક્રિય તત્વનું સ્થાન લે છે.")
                                  ))
                              )),
                              Subject("સામાજિક વિજ્ઞાન", "🌍", Color(0xFFFB8C00), listOf(
                                  Chapter(1, "ભારતનો ભવ્ય વારસો", "https://gujarat-education.gov.in/Textbook", listOf(
                                      QuestionAnswer("પ્રાકૃતિક વારસામાં શેનો સમાવેશ થાય?", "જવાબ: નદીઓ, પર્વતો, જંગલો, સાગરો, વનસ્પતિ અને પ્રાણીઓ.")
                                  ))
                              )),
                              Subject("ગુજરાતી", "📖", Color(0xFF8E24AA), listOf(
                                  Chapter(1, "વૈષ્ણવજન (પદ)", "https://gujarat-education.gov.in/Textbook", listOf(
                                      QuestionAnswer("વૈષ્ણવજન કોને કહેવાય?", "જવાબ: જે પારકાનું દુઃખ સમજે અને મન-વાણી-કર્મ નિર્મળ રાખે.")
                                  ))
                              ))
                          )
                          else -> listOf(
                              Subject("ગણિત", "📐", Color(0xFF1E88E5), listOf(
                                  Chapter(1, "પ્રકરણ ૧: ગણતરી અને પાયાના નિયમો", "https://gujarat-education.gov.in/Textbook", listOf(
                                      QuestionAnswer("સંખ્યાઓની સ્થાનકિંમત સમજાવો.", "જવાબ: એકમ, દશક, સો અને હજાર મુજબ કિંમત નક્કી થાય.")
                                  ))
                              )),
                              Subject("ગુજરાતી", "📚", Color(0xFF43A047), listOf(
                                  Chapter(1, "પ્રકરણ ૧: શાળા તત્પરતા", "https://gujarat-education.gov.in/Textbook", listOf(
                                      QuestionAnswer("વાર્તાનો મુખ્ય બોધ જણાવો.", "જવાબ: હંમેશા સત્ય અને પરિશ્રમનો માર્ગ અપનાવવો.")
                                  ))
                              )),
                              Subject("પર્યાવરણ / વિજ્ઞાન", "🌱", Color(0xFFFB8C00), listOf(
                                  Chapter(1, "પ્રકરણ ૧: આપણી આસપાસની પ્રકૃતિ", "https://gujarat-education.gov.in/Textbook", listOf(
                                      QuestionAnswer("વૃક્ષોના ફાયદા જણાવો.", "જવાબ: વૃક્ષો ઓક્સિજન આપે છે, વરસાદ લાવે છે અને છાંયડો આપે છે.")
                                  ))
                              ))
                          )
                      }
                      Standard(stdNumber = std, name = "ધોરણ $std (Standard $std)", section = section, subjects = subjects)
                  }
              }

              // Spoken English Folders
              fun getSpokenEnglishFolders(): List<FolderItem> {
                  return listOf(
                      FolderItem(
                          title = "રોજિંદા બોલાતા વાક્યો (Daily Use Sentences)",
                          subtitle = "Daily Routine English to Gujarati",
                          icon = "🗣️",
                          details = listOf(
                              "How are you?" to "તમે કેમ છો?",
                              "I am fine, thank you." to "હું મજામાં છું, આભાર.",
                              "What are you doing?" to "તમે શું કરી રહ્યા છો?",
                              "Where are you going?" to "તમે ક્યાં જઈ રહ્યા છો?",
                              "Please help me." to "મહેરબાની કરીને મને મદદ કરો.",
