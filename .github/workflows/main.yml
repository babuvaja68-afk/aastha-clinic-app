name: Build GSEB VidyaSetu App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Full Course Bilingual Education App with Complete Stories and Q&A
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/gseb/vidyasetu
          mkdir -p gradle/wrapper

          # 0. Gradle Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "GSEBVidyaSetu"
          include ':app'
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.gseb.vidyasetu'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gseb.vidyasetu"
                  minSdk 24
                  targetSdk 34
                  versionCode 9
                  versionName "9.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="GSEB વિદ્યાસેતુ"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # EDUCATION VECTOR LOGO
          cat << 'EOF' > app/src/main/res/drawable/ic_education_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M54,8 C79.4,8 100,28.6 100,54 C100,79.4 79.4,100 54,100 C28.6,100 8,79.4 8,54 C8,28.6 28.6,8 54,8 Z"/>
              <path
                  android:strokeColor="#FFC107"
                  android:strokeWidth="2"
                  android:pathData="M54,12 C77.2,12 96,30.8 96,54 C96,77.2 77.2,96 54,96 C30.8,96 12,77.2 12,54 C12,30.8 30.8,12 54,12 Z"/>
              <path
                  android:fillColor="#FFA000"
                  android:pathData="M54,42 m-10,0 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0"/>
              <path
                  android:fillColor="#FFD54F"
                  android:pathData="M54,20 L78,30 L54,40 L30,30 Z"/>
              <path
                  android:fillColor="#FFB300"
                  android:pathData="M38,34 L38,44 C38,49 50,54 54,54 C58,54 70,49 70,44 L70,34 L54,41 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M72,32 L76,46 L73,46 L70,33 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,56 C34,53 46,55 53,60 L53,84 C46,79 34,77 24,80 Z"/>
              <path
                  android:fillColor="#ECEFF1"
                  android:pathData="M84,56 C74,53 62,55 55,60 L55,84 C62,79 74,77 84,80 Z"/>
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M53,60 L55,60 L55,84 L53,84 Z"/>
              <path
                  android:fillColor="#90A4AE"
                  android:pathData="M30,62 h16 v2 h-16 z M30,68 h16 v2 h-16 z M30,74 h12 v2 h-12 z"/>
              <path
                  android:fillColor="#90A4AE"
                  android:pathData="M62,62 h16 v2 h-16 z M62,68 h16 v2 h-16 z M66,74 h12 v2 h-12 z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_education_logo"/>
          </adaptive-icon>
          EOF

          # Main Application Source Code
          cat << 'EOF' > app/src/main/java/com/gseb/vidyasetu/MainActivity.kt
          package com.gseb.vidyasetu

          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          enum class AppMedium { GUJARATI, ENGLISH }

          data class QuestionAnswer(
              val question: String,
              val answer: String,
              val type: String = "Exercise / સ્વાધ્યાય"
          )

          data class Chapter(
              val chapterNumber: Int,
              val titleGu: String,
              val titleEn: String,
              val storyAndSummaryGu: String,
              val storyAndSummaryEn: String,
              val swadhyayAnswersGu: List<QuestionAnswer>,
              val swadhyayAnswersEn: List<QuestionAnswer>
          )

          data class Subject(
              val nameGu: String,
              val nameEn: String,
              val iconEmoji: String,
              val color: Color,
              val chapters: List<Chapter>
          )

          data class Standard(
              val stdNumber: Int,
              val nameGu: String,
              val nameEn: String,
              val sectionGu: String,
              val sectionEn: String,
              val subjects: List<Subject>
          )

          data class FolderItem(
              val titleGu: String,
              val titleEn: String,
              val subtitleGu: String,
              val subtitleEn: String,
              val icon: String,
              val detailsGu: List<Pair<String, String>>,
              val detailsEn: List<Pair<String, String>>
          )

          object EducationRepository {
              fun getStandards(): List<Standard> {
                  return (1..12).map { std ->
                      val sectionGu = when (std) {
                          in 1..5 -> "પ્રાથમિક વિભાગ (ધોરણ ૧-૫)"
                          in 6..8 -> "ઉચ્ચ પ્રાથમિક વિભાગ (ધોરણ ૬-૮)"
                          in 9..10 -> "માધ્યમિક વિભાગ (ધોરણ ૯-૧૦)"
                          else -> "ઉચ્ચતર માધ્યમિક વિભાગ (ધોરણ ૧૧-૧૨)"
                      }
                      val sectionEn = when (std) {
                          in 1..5 -> "Primary Section (Std 1-5)"
                          in 6..8 -> "Upper Primary Section (Std 6-8)"
                          in 9..10 -> "Secondary Section (Std 9-10)"
                          else -> "Higher Secondary Section (Std 11-12)"
                      }

                      val subjects = when (std) {
                          10 -> listOf(
                              Subject(
                                  nameGu = "ગણિત (Mathematics)",
                                  nameEn = "Mathematics",
                                  iconEmoji = "📐",
                                  color = Color(0xFF1E88E5),
                                  chapters = listOf(
                                      Chapter(
                                          chapterNumber = 1,
                                          titleGu = "પ્રકરણ ૧: વાસ્તવિક સંખ્યાઓ",
                                          titleEn = "Chapter 1: Real Numbers",
                                          storyAndSummaryGu = """
                                              📘 સંપૂર્ણ પ્રકરણ સારાંશ અને થિયરી:
                                              વાસ્તવિક સંખ્યાઓ એ સંમેય અને અસંમેય સંખ્યાઓનો સમૂહ છે. આ પ્રકરણમાં યુક્લિડની ભાગપ્રવિધિ અને અંકગણિતનું મૂળભૂત પ્રમેય મુખ્ય આધારસ્તંભ છે.
                                              
                                              ૧. યુક્લિડનું ભાગાકારનું પૂર્વપ્રમેય:
                                              આપેલ ધન પૂર્ણાંકો a અને b માટે અનન્ય અનૃણ પૂર્ણાંકો q અને r એવા મળે કે જેથી:
                                              a = bq + r, જ્યાં 0 ≤ r < b
                                              (ભાજ્ય = ભાજક × ભાગફળ + શેષ)
                                              
                                              ૨. અંકગણિતનું મૂળભૂત પ્રમેય:
                                              કોઈપણ વિભાજ્ય સંખ્યાને તેના અવિભાજ્ય અવયવોના ગુણાકાર તરીકે અનન્ય રીતે દર્શાવી શકાય છે.
                                              
                                              ૩. સંબંધ સૂત્ર:
                                              ગુ.સા.અ.(a, b) × લ.સા.અ.(a, b) = a × b
                                          """.trimIndent(),
                                          storyAndSummaryEn = """
                                              📘 Complete Chapter Summary & Theory:
                                              Real numbers comprise both rational and irrational numbers. The fundamental theorem of arithmetic and Euclid's division lemma are the core pillars of this chapter.
                                              
                                              1. Euclid's Division Lemma:
                                              Given positive integers a and b, there exist unique whole numbers q and r satisfying:
                                              a = bq + r, where 0 ≤ r < b
                                              (Dividend = Divisor × Quotient + Remainder)
                                              
                                              2. Fundamental Theorem of Arithmetic:
                                              Every composite number can be uniquely expressed (factored) as a product of prime numbers.
                                              
                                              3. Master Formula:
                                              HCF(a, b) × LCM(a, b) = a × b
                                          """.trimIndent(),
                                          swadhyayAnswersGu = listOf(
                                              QuestionAnswer("યુક્લિડની ભાગપ્રવિધિનો ઉપયોગ કરીને ગુ.સા.અ. શોધો: ૧૩૫ અને ૨૨૫", "સંપૂર્ણ સ્ટેપ-બાય-સ્ટેપ ગણતરી:\nઅહીં ૨૨૫ > ૧૩૫ છે.\nપગલું ૧: ૨૨૫ = ૧૩૫ × ૧ + ૯૦\nપગલું ૨: ૧૩૫ = ૯૦ × ૧ + ૪૫\nપગલું ૩: ૯૦ = ૪૫ × ૨ + ૦\nઅહીં છેલ્લી શેષ શૂન્ય છે અને તે તબક્કે ભાજક ૪૫ છે.\nમાટે ગુ.સા.અ.(૧૩૫, ૨૨૫) = ૪૫ થાય."),
                                              QuestionAnswer("સાબિત કરો કે √૫ અસંમેય સંખ્યા છે.", "સંપૂર્ણ સાબિતી:\nધારો કે √૫ સંમેય સંખ્યા છે.\nતેથી √૫ = a/b લખી શકાય (જ્યાં a અને b પરસ્પર અવિભાજ્ય પૂર્ણાંકો છે, b ≠ 0).\nબંને બાજુ વર્ગ કરતાં:\n૫ = a²/b²  =>  ૫b² = a²  --- (સમીકરણ ૧)\nઆથી a² એ ૫ વડે વિભાજ્ય છે, માટે પ્રમેય મુજબ a પણ ૫ વડે વિભાજ્ય થાય.\nહવે a = ૫c મુકતાં:\n૫b² = (૫c)² = ૨૫c²  =>  b² = ૫c²\nઆથી b² એ ૫ વડે વિભાજ્ય છે, માટે b પણ ૫ વડે વિભાજ્ય થાય.\nઆમ, a અને b બંનેનો સામાન્ય અવયવ ૫ મળે છે, જે આપણી મૂળ ધારણાથી વિરોધાભાસ દર્શાવે છે.\nમાટે સાબિત થાય છે કે √૫ અસંમેય સંખ્યા છે.")
                                          ),
                                          swadhyayAnswersEn = listOf(
                                              QuestionAnswer("Use Euclid's division algorithm to find HCF of 135 and 225.", "Step-by-Step Solution:\nSince 225 > 135, apply division lemma:\nStep 1: 225 = 135 × 1 + 90\nStep 2: 135 = 90 × 1 + 45\nStep 3: 90 = 45 × 2 + 0\nThe remainder is now 0, and the divisor at this step is 45.\nTherefore, HCF(135, 225) = 45."),
                                              QuestionAnswer("Prove that √5 is an irrational number.", "Proof by Contradiction:\nLet us assume that √5 is a rational number.\nThen √5 = a/b, where a and b are coprime integers (b ≠ 0).\nSquaring both sides:\n5 = a²/b²  =>  5b² = a²  --- (Equation 1)\nThis implies a² is divisible by 5, hence 'a' is also divisible by 5.\nLet a = 5c for some integer c.\nSubstituting a = 5c in Eq 1:\n5b² = 25c²  =>  b² = 5c²\nThis implies b² is divisible by 5, hence 'b' is also divisible by 5.\nTherefore, a and b have at least 5 as a common factor, which contradicts the fact that a and b are coprime.\nHence, √5 is an irrational number.")
                                          )
                                      ),
                                      Chapter(
                                          chapterNumber = 2,
                                          titleGu = "પ્રકરણ ૨: બહુપદીઓ",
                                          titleEn = "Chapter 2: Polynomials",
                                          storyAndSummaryGu = """
                                              📘 સંપૂર્ણ પ્રકરણ સારાંશ:
                                              બહુપદીના પ્રકારો: સુરેખ (ઘાત ૧), દ્વિઘાત (ઘાત ૨), ત્રિઘાત (ઘાત ૩).
                                              
                                              ૧. દ્વિઘાત બહુપદીનું પ્રમાણિત સ્વરૂપ:
                                              p(x) = ax² + bx + c (જ્યાં a ≠ 0)
                                              
                                              ૨. શૂન્યો અને સહગુણકો વચ્ચેનો સંબંધ:
                                              • શૂન્યોનો સરવાળો (α + β) = -b/a = -(x નો સહગુણક) / (x² નો સહગુણક)
                                              • શૂન્યોનો ગુણાકાર (α · β) = c/a = અચળ પદ / (x² નો સહગુણક)
                                          """.trimIndent(),
                                          storyAndSummaryEn = """
                                              📘 Complete Chapter Summary:
                                              Types of polynomials: Linear (Degree 1), Quadratic (Degree 2), Cubic (Degree 3).
                                              
                                              1. Standard Form of Quadratic Polynomial:
                                              p(x) = ax² + bx + c (where a ≠ 0)
                                              
                                              2. Relationship between Zeroes and Coefficients:
                                              • Sum of zeroes (α + β) = -b/a = -(Coefficient of x) / (Coefficient of x²)
                                              • Product of zeroes (α · β) = c/a = Constant term / (Coefficient of x²)
                                          """.trimIndent(),
                                          swadhyayAnswersGu = listOf(
                                              QuestionAnswer("દ્વિઘાત બહુપદી x² - ૨x - ૮ નાં શૂન્યો શોધો અને સહગુણકો વચ્ચેનો સંબંધ ચકાસો.", "જવાબ:\nx² - ૨x - ૮ = ૦\nx² - ૪x + ૨x - ૮ = ૦\nx(x - ૪) + ૨(x - ૪) = ૦\n(x - ૪)(x + ૨) = ૦\nમાટે શૂન્યો α = ૪ અને β = -૨ મળે.\n\nસંબંધની ચકાસણી:\n• સરવાળો: α + β = ૪ + (-૨) = ૨ = -(-૨)/૧ = -b/a (સત્ય છે)\n• ગુણાકાર: α · β = ૪ × (-૨) = -૮ = -૮/૧ = c/a (સત્ય છે)")
                                          ),
                                          swadhyayAnswersEn = listOf(
                                              QuestionAnswer("Find the zeroes of quadratic polynomial x² - 2x - 8 and verify the relationship.", "Solution:\nx² - 2x - 8 = 0\nx² - 4x + 2x - 8 = 0\nx(x - 4) + 2(x - 4) = 0\n(x - 4)(x + 2) = 0\nZeroes are α = 4 and β = -2.\n\nVerification:\n• Sum of zeroes: α + β = 4 + (-2) = 2 = -(-2)/1 = -b/a (Verified)\n• Product of zeroes: α · β = 4 × (-2) = -8 = -8/1 = c/a (Verified)")
                                          )
                                      )
                                  )
                              ),
                              Subject(
                                  nameGu = "વિજ્ઞાન (Science)",
                                  nameEn = "Science",
                                  iconEmoji = "🔬",
                                  color = Color(0xFF43A047),
                                  chapters = listOf(
                                      Chapter(
                                          chapterNumber = 1,
                                          titleGu = "પ્રકરણ ૧: રાસાયણિક પ્રક્રિયાઓ અને સમીકરણો",
                                          titleEn = "Chapter 1: Chemical Reactions and Equations",
                                          storyAndSummaryGu = """
                                              📘 સંપૂર્ણ પ્રકરણ સારાંશ:
                                              જ્યારે રાસાયણિક ફેરફાર થાય ત્યારે રાસાયણિક પ્રક્રિયા થઈ તેમ કહેવાય.
                                              
