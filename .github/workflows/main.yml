          )

          enum class AppLang { GU, EN, HI }

          object IndicToEnglish {
              private val charMap = mapOf(
                  'અ' to "a", 'આ' to "aa", 'ઇ' to "i", 'ઈ' to "ee", 'ઉ' to "u", 'ઊ' to "oo",
                  'ઋ' to "ru", 'એ' to "e", 'ઐ' to "ai", 'ઓ' to "o", 'ઔ' to "au",
                  'ક' to "k", 'ખ' to "kh", 'ગ' to "g", 'ઘ' to "gh", 'ઙ' to "ng",
                  'ચ' to "ch", 'છ' to "chh", 'જ' to "j", 'ઝ' to "zh",
                  'ટ' to "t", 'ઠ' to "th", 'ડ' to "d", 'ઢ' to "dh", 'ણ' to "n",
                  'ત' to "t", 'થ' to "th", 'દ' to "d", 'ધ' to "dh", 'ન' to "n",
                  'પ' to "p", 'ફ' to "f", 'બ' to "b", 'ભ' to "bh", 'મ' to "m",
                  'ય' to "y", 'ર' to "r", 'લ' to "l", 'ળ' to "l", 'વ' to "v",
                  'શ' to "sh", 'ષ' to "sh", 'સ' to "s", 'હ' to "h",
                  'ા' to "a", 'િ' to "i", 'ી' to "ee", 'ુ' to "u", 'ૂ' to "oo",
                  'ૃ' to "ru", 'ે' to "e", 'ૈ' to "ai", 'ો' to "o", 'ૌ' to "au",
                  'ં' to "n", 'ઃ' to "h", '્' to "",
                  'अ' to "a", 'आ' to "aa", 'इ' to "i", 'ई' to "ee", 'उ' to "u", 'ऊ' to "oo",
                  'क' to "k", 'ख' to "kh", 'ग' to "g", 'घ' to "gh",
                  'च' to "ch", 'छ' to "chh", 'ज' to "j", 'झ' to "jh",
                  'त' to "t", 'थ' to "th", 'द' to "d", 'ध' to "dh", 'न' to "n",
                  'प' to "p", 'फ' to "f", 'ब' to "b", 'भ' to "bh", 'म' to "m",
                  'य' to "y", 'र' to "r", 'ल' to "l", 'व' to "v",
                  'श' to "sh", 'ष' to "sh", 'स' to "s", 'ह' to "h",
                  'ा' to "a", 'ि' to "i", 'ी' to "ee", 'ु' to "u", 'ू' to "oo",
                  'े' to "e", 'ै' to "ai", 'ो' to "o", 'ौ' to "au", 'ं' to "n", '्' to ""
              )

              fun convert(input: String): String {
                  if (input.isBlank()) return ""
                  val sb = StringBuilder()
                  for (i in input.indices) {
                      val ch = input[i]
                      val mapped = charMap[ch]
                      if (mapped != null) {
                          val isConsonant = (ch in 'ક'..'હ') || (ch in 'क'..'ह')
                          val nextChar = if (i + 1 < input.length) input[i + 1] else null
                          val isNextMatra = nextChar != null && ((nextChar in 'ા'..'ૌ') || (nextChar in 'ा'..'ौ') || nextChar == '્' || nextChar == '्')
                          sb.append(mapped)
                          if (isConsonant && !isNextMatra && nextChar != null && nextChar != ' ' && nextChar != '.' && nextChar != ',') {
                              sb.append("a")
                          }
                      } else {
                          sb.append(ch)
                      }
                  }
                  return sb.toString().split(" ").joinToString(" ") { word ->
                      word.replaceFirstChar { if (it.isLowerCase()) it.titlecase() else it.toString() }
                  }
              }
          }

          fun getCurrentDate(): String {
              val sdf = SimpleDateFormat("dd-MM-yyyy", Locale.getDefault())
              return sdf.format(Date())
