                              • પ્રથમ વિશ્વયુદ્ધ (૧૯૧૪-૧૯૧૮) અને દ્વિતીય વિશ્વયુદ્ધ (૧૯૩૯-૧૯૪૫).
                              • સંયુક્ત રાષ્ટ્રસંઘ (UN): ૨૪ ઓક્ટોબર, ૧૯૪૫ ના રોજ વિશ્વશાંતિ માટે સ્થાપના (મુખ્ય મથક: ન્યુ યોર્ક, USA).
                              
                              ૨. વિશ્વનું ભૂગોળ (World Geography):
                              • ૭ ખંડો: ૧. એશિયા (વિશ્વનો સૌથી મોટો ખંડ), ૨. આફ્રિકા, ૩. ઉત્તર અમેરિકા, ૪. દક્ષિણ અમેરિકા, ૫. એન્ટાર્કટિકા (બરફથી ઢંકાયેલો), ૬. યુરોપ, ૭. ઓસ્ટ્રેલિયા (સૌથી નાનો ખંડ).
                              • ૫ મહાસાગરો: ૧. પેસિફિક (પ્રશાંત - સૌથી મોટો અને ઊંડો), ૨. એટલાન્ટિક, ૩. હિંદ મહાસાગર, ૪. આર્કટિક, ૫. દક્ષિણ મહાસાગર.
                              • વિશ્વની સૌથી લાંબી નદી: નાઈલ નદી (આફ્રિકા - ૬,૬૫૦ કિમી).
                              • વિશ્વનો સૌથી ઊંચો પર્વત: માઉન્ટ એવરેસ્ટ (૮,૮૪૮.૮૬ મીટર - હિમાલય).
                              
                              ૩. આધુનિક વિજ્ઞાન અને અવકાશ (Modern Science & Physics):
                              • બ્રહ્માંડની ઉત્પત્તિ: બિગ બેંગ થિયરી (Big Bang) અનુસાર ૧૩.૮ અબજ વર્ષ પહેલાં મહાવિસ્ફોટ થયો.
                              • પ્રકાશની ઝડપ: ૩,૦૦,૦૦૦ કિમી/સેકન્ડ (સૂર્યપ્રકાશ પૃથ્વી પર પહોંચતા ૮ મિનિટ ૨૦ સેકન્ડ લાગે છે).
                              • ગુરુત્વાકર્ષણનો નિયમ: સર આઇઝેક ન્યૂટન દ્વારા સફરજન પડવાની ઘટના પરથી શોધાયો.
                              • સાપેક્ષતાનો સિદ્ધાંત: આલ્બર્ટ આઇન્સ્ટાઇન (E = mc²).
                          """.trimIndent(),
                          fullArticleEn = """
                              🌍 World History, Geography & Modern Physics:
                              
                              1. World History:
                              • Ancient Civilizations: Indus Valley (Harappa/Mohenjo-daro), Mesopotamian, Egyptian (Nile Pyramids), Classical Greek and Roman Empire.
                              • Industrial Revolution (1760): Technological leap powered by James Watt's Steam Engine and mechanization.
                              • Global World Wars: WWI (1914-1918) and WWII (1939-1945).
                              • United Nations (UN): Established on October 24, 1945, to promote international peace and security.
                              
