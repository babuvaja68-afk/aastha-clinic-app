          fun sendWhatsAppAppointmentOnly(context: Context, patient: Patient) {
              val cleanPhone = patient.phone.replace("+", "").replace(" ", "").replace("-", "")
              val finalPhone = if (cleanPhone.length == 10) "91$cleanPhone" else cleanPhone

              val message = """
                  🏥 *AASTHA CLINIC & DIAGNOSTIC* 🏥
                  ---------------------------------
                  નમસ્તે, *${patient.name}*
                  આપની એપોઇન્ટમેન્ટ કન્ફર્મ થઈ ગઈ છે.
                  
                  👨‍⚕️ *ડોક્ટર:* ${patient.doctorName}
                  📅 *તારીખ:* ${patient.date}
                  ⏰ *સમય સ્લોટ:* ${patient.timeSlot}
                  📍 *સ્થળ:* આસ્થા ક્લિનિક
                  ---------------------------------
                  _મહેરબાની કરીને આપેલા સમય સ્લોટ કરતા ૫ મિનિટ વહેલા ક્લિનિક પર પધારવું._
              """.trimIndent()

              try {
                  val url = "https://api.whatsapp.com/send?phone=$finalPhone&text=" + URLEncoder.encode(message, "UTF-8")
                  val intent = Intent(Intent.ACTION_VIEW)
                  intent.data = Uri.parse(url)
                  context.startActivity(intent)
              } catch (e: Exception) {
                  Toast.makeText(context, "WhatsApp open nathi thai rahyu", Toast.LENGTH_SHORT).show()
              }
          }

