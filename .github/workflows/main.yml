name: Build Aastha Clinic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Complete Android Project Structure
        run: |
          # 1. Folders
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          # 2. Fix AndroidX & JVM Memory in gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 3. Move files to right paths
          mv backup_rules.xml colors.xml data_extraction_rules.xml strings.xml themes.xml app/src/main/res/values/ 2>/dev/null || true
          mv ic_aastha_*.xml greeting.png app/src/main/res/drawable/ 2>/dev/null || true
          mv ic_launcher*.xml ic_launcher*.webp app/src/main/res/mipmap-anydpi-v26/ 2>/dev/null || true
          mv *.kt *.java app/src/main/java/ 2>/dev/null || true

          # 4. Dummy env files
          touch .env .env.example
          touch app/.env app/.env.example

          # 5. Strings fallback
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Aastha Clinic</string>
          </resources>
          EOF
          fi

          # 6. AndroidManifest fallback
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          # 7. app/build.gradle.kts setup
          if [ ! -f "app/build.gradle.kts" ]; then
            cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.aastha.clinic"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.aastha.clinic"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF
          else
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
          fi

          # 8. Root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "aastha-clinic"
          include(":app")
          EOF

          # 9. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          # 10. Setup Gradle Wrapper
          gradle wrapper --gradle-version 8.10.2

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aastha-Clinic-App
          path: "**/*.apk"
          
