name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Gradle Root Setup
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            echo 'include(":app")' > settings.gradle.kts
          fi
          if [ ! -f "build.gradle.kts" ]; then
            echo 'plugins { alias(libs.plugins.android.application) apply false; alias(libs.plugins.kotlin.compose) apply false }' > build.gradle.kts
          fi
          gradle wrapper

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aastha-Clinic-App
          path: app/build/outputs/apk/debug/*.apk
