          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun AasthaClinicApp() {
              var currentScreen by remember { mutableStateOf("home") }
              var currentLang by remember { mutableStateOf(AppLang.GU) }
              var activeSlotDetail by remember { mutableStateOf<Pair<String, String>?>(null) }
              val todayDate = remember { getCurrentDate() }

              val patientList = remember {
                  mutableStateListOf(
                      Patient(name = "Ramesh Patel (રમેશ પટેલ)", village = "Veraval (વેરાવળ)", age = "45", disease = "Fever & Cold", medicine = "Paracetamol 500mg", amount = "350", paymentMode = "Cash", doctorName = "DR. BIRJU K. SIRODARIA", timeSlot = "11:00 AM - 11:15 AM", date = todayDate, isChecked = false),
                      Patient(name = "Geetaben Shah (ગીતાબેન શાહ)", village = "Somnath (સોમનાથ)", age = "38", disease = "Acidity & BP", medicine = "Pantocid 40", amount = "500", paymentMode = "Online (UPI)", doctorName = "DR. NIDDHI JAVIA", timeSlot = "05:00 PM - 05:15 PM", date = todayDate, isChecked = true),
                      Patient(name = "Kishorbhai Joshi (કિશોરભાઈ)", village = "Kodinar (કોડીનાર)", age = "52", disease = "Joint Pain", medicine = "Aceclofenac", amount = "400", paymentMode = "Cash", doctorName = "DR. BIRJU K. SIRODARIA", timeSlot = "11:00 AM - 11:15 AM", date = "18-08-2026", isChecked = true)
                  )
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Text(
                                  text = when (currentScreen) {
                                      "home" -> "AASTHA CLINIC"
                                      "add" -> tr("add_title", currentLang)
                                      else -> tr("records_title", currentLang)
                                  },
                                  fontWeight = FontWeight.Black,
                                  letterSpacing = 1.sp,
                                  fontSize = 19.sp
                              )
                          },
                          actions = {
                              Row(modifier = Modifier.padding(end = 8.dp)) {
                                  listOf(
                                      AppLang.GU to "ગુજ",
                                      AppLang.HI to "हिं",
                                      AppLang.EN to "EN"
                                  ).forEach { (lang, label) ->
                                      FilledTonalButton(
                                          onClick = { currentLang = lang },
                                          colors = ButtonDefaults.filledTonalButtonColors(
                                              containerColor = if (currentLang == lang) Color.White else Color(0xFF1E3A8A),
                                              contentColor = if (currentLang == lang) Color(0xFF0D276B) else Color.White
                                          ),
                                          contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                          modifier = Modifier.padding(horizontal = 2.dp).height(32.dp)
                                      ) {
                                          Text(label, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(
                              containerColor = Color(0xFF0D276B),
                              titleContentColor = Color.White
                          )
                      )
                  }
              ) { paddingValues ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(paddingValues)
                          .background(Color(0xFFF1F5F9))
                  ) {
                      when (currentScreen) {
                          "home" -> HomeScreen(
                              lang = currentLang,
                              patientList = patientList,
                              onAddClick = { currentScreen = "add" },
                              onRecordsClick = { currentScreen = "records" },
                              onSlotClick = { slot, doc -> activeSlotDetail = Pair(slot, doc) }
                          )
                          "add" -> AddPatientScreen(
                              lang = currentLang,
                              patientList = patientList,
                              onSave = { newPatient ->
                                  patientList.add(0, newPatient)
                                  currentScreen = "records"
                              },
                              onBack = { currentScreen = "home" },
                              onSlotInfoClick = { slot, doc -> activeSlotDetail = Pair(slot, doc) }
                          )
                          "records" -> PatientRecordsScreen(
                              lang = currentLang,
                              patients = patientList,
                              todayDate = todayDate,
                              onBack = { currentScreen = "home" },
                              onToggleCheck = { patient ->
                                  val index = patientList.indexOfFirst { it.id == patient.id }
                                  if (index != -1) {
                                      patientList[index] = patientList[index].copy(isChecked = !patientList[index].isChecked)
                                  }
                              },
                              onDelete = { patient ->
                                  patientList.removeIf { it.id == patient.id }
                              }
                          )
                      }

                      // Popup to View Slot Patients & Delete if cancelled
                      activeSlotDetail?.let { (slot, doc) ->
                          val slotPatients = patientList.filter { it.timeSlot == slot && it.doctorName.contains(doc.take(5)) }
                          AlertDialog(
                              onDismissRequest = { activeSlotDetail = null },
                              title = {
                                  Column {
                                      Text(text = "⏰ $slot", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = Color(0xFF0D276B))
                                      Text(text = "👨‍⚕️ $doc", fontSize = 13.sp, color = Color.Gray)
                                  }
                              },
                              text = {
                                  Column(modifier = Modifier.fillMaxWidth()) {
                                      Text(text = "આ સ્લોટના દર્દીઓ:", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                      Spacer(modifier = Modifier.height(8.dp))
                                      if (slotPatients.isEmpty()) {
                                          Text(text = "આ સ્લોટમાં હજુ કોઈ દર્દી નથી (સ્લોટ ખાલી છે).", fontSize = 13.sp, color = Color.DarkGray)
                                      } else {
                                          slotPatients.forEachIndexed { index, p ->
                                              Card(
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .padding(vertical = 4.dp),
                                                  colors = CardDefaults.cardColors(
                                                      containerColor = if (p.isChecked) Color(0xFFFFEBEE) else Color(0xFFE8F5E9)
                                                  )
                                              ) {
                                                  Column(modifier = Modifier.padding(10.dp)) {
                                                      Row(
                                                          modifier = Modifier.fillMaxWidth(),
                                                          horizontalArrangement = Arrangement.SpaceBetween,
                                                          verticalAlignment = Alignment.CenterVertically
                                                      ) {
                                                          Text(text = "${index + 1}. ${p.name}", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF0D276B))
                                                          IconButton(
                                                              onClick = { patientList.removeIf { it.id == p.id } },
                                                              modifier = Modifier.size(28.dp)
                                                          ) {
                                                              Text("🗑️", fontSize = 14.sp)
                                                          }
                                                      }
                                                      Text(text = "ગામ: ${p.village} | ઉંમર: ${p.age} વર્ષ | તારીખ: ${p.date}", fontSize = 11.sp, color = Color.DarkGray)
                                                      Text(text = "રોગ: ${p.disease} | ફી: ₹${p.amount}", fontSize = 12.sp, color = Color(0xFFD32F2F))
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { activeSlotDetail = null },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B))
                                  ) {
                                      Text(tr("close", currentLang))
                                  }
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen(
              lang: AppLang,
              patientList: List<Patient>,
              onAddClick: () -> Unit,
              onRecordsClick: () -> Unit,
              onSlotClick: (String, String) -> Unit
          ) {
              val todayDate = getCurrentDate()
              val todayPatients = patientList.filter { it.date == todayDate }
              val totalPatients = todayPatients.size
              val pendingCount = todayPatients.count { !it.isChecked }
              val completedCount = todayPatients.count { it.isChecked }
              val totalCollection = todayPatients.sumOf { it.amount.toIntOrNull() ?: 0 }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp)
                      .verticalScroll(rememberScrollState()),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  // Large Beautiful Brand Logo Header Card
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(20.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White),
                      elevation = CardDefaults.cardElevation(defaultElevation = 5.dp)
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(20.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
