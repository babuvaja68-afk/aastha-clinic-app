name: Build GSEB VidyaSetu App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Ultimate Education App with Computer Learning and Live Auto Update
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/gseb/vidyasetu
          mkdir -p gradle/wrapper

          # 0. Gradle Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "GSEBVidyaSetu"
          include ':app'
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.gseb.vidyasetu'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gseb.vidyasetu"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "7.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="GSEB વિદ્યાસેતુ"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # EDUCATION VECTOR LOGO
          cat << 'EOF' > app/src/main/res/drawable/ic_education_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M54,8 C79.4,8 100,28.6 100,54 C100,79.4 79.4,100 54,100 C28.6,100 8,79.4 8,54 C8,28.6 28.6,8 54,8 Z"/>
              <path
                  android:strokeColor="#FFC107"
                  android:strokeWidth="2"
                  android:pathData="M54,12 C77.2,12 96,30.8 96,54 C96,77.2 77.2,96 54,96 C30.8,96 12,77.2 12,54 C12,30.8 30.8,12 54,12 Z"/>
              <path
                  android:fillColor="#FFA000"
                  android:pathData="M54,42 m-10,0 a10,10 0 1,0 20,0 a10,10 0 1,0 -20,0"/>
              <path
                  android:fillColor="#FFD54F"
                  android:pathData="M54,20 L78,30 L54,40 L30,30 Z"/>
              <path
                  android:fillColor="#FFB300"
                  android:pathData="M38,34 L38,44 C38,49 50,54 54,54 C58,54 70,49 70,44 L70,34 L54,41 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M72,32 L76,46 L73,46 L70,33 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,56 C34,53 46,55 53,60 L53,84 C46,79 34,77 24,80 Z"/>
              <path
                  android:fillColor="#ECEFF1"
                  android:pathData="M84,56 C74,53 62,55 55,60 L55,84 C62,79 74,77 84,80 Z"/>
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M53,60 L55,60 L55,84 L53,84 Z"/>
              <path
                  android:fillColor="#90A4AE"
                  android:pathData="M30,62 h16 v2 h-16 z M30,68 h16 v2 h-16 z M30,74 h12 v2 h-12 z"/>
              <path
                  android:fillColor="#90A4AE"
                  android:pathData="M62,62 h16 v2 h-16 z M62,68 h16 v2 h-16 z M66,74 h12 v2 h-12 z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_education_logo"/>
          </adaptive-icon>
          EOF

          # Main Application Source Code
          cat << 'EOF' > app/src/main/java/com/gseb/vidyasetu/MainActivity.kt
          package com.gseb.vidyasetu

          import android.content.Context
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.net.HttpURLConnection
          import java.net.URL

          data class QuestionAnswer(
              val question: String,
              val answer: String,
              val type: String = "સ્વાધ્યાય પ્રશ્ન"
          )

          data class Chapter(
              val chapterNumber: Int,
              val title: String,
              val textbookSummary: String,
              val swadhyayAnswers: List<QuestionAnswer>
          )

          data class Subject(
              val name: String,
              val iconEmoji: String,
              val color: Color,
              val chapters: List<Chapter>
          )

          data class Standard(
              val stdNumber: Int,
              val name: String,
              val section: String,
              val subjects: List<Subject>
          )

          data class FolderItem(
              val title: String,
              val subtitle: String,
              val icon: String,
              val details: List<Pair<String, String>>
          )

          object EducationRepository {
              fun getStandards(): List<Standard> {
                  return (1..12).map { std ->
                      val section = when (std) {
                          in 1..5 -> "પ્રાથમિક વિભાગ (ધોરણ ૧-૫)"
                          in 6..8 -> "ઉચ્ચ પ્રાથમિક વિભાગ (ધોરણ ૬-૮)"
                          in 9..10 -> "માધ્યમિક વિભાગ (ધોરણ ૯-૧૦)"
                          else -> "ઉચ્ચતર માધ્યમિક વિભાગ (ધોરણ ૧૧-૧૨)"
                      }

                      val subjects = when (std) {
                          10 -> listOf(
                              Subject("ગણિત (Mathematics)", "📐", Color(0xFF1E88E5), listOf(
                                  Chapter(
                                      1,
                                      "વાસ્તવિક સંખ્યાઓ (Real Numbers)",
                                      "📘 પાઠ્યપુસ્તક સારાંશ:\nયુક્લિડની ભાગપ્રવિધિ, ગુ.સા.અ. (HCF), લ.સા.અ. (LCM) અને સંમેય-અસંમેય સંખ્યાઓનું નિરૂપણ.\n\n• મુખ્ય સૂત્ર: ગુ.સા.અ. × લ.સા.અ. = a × b\n• યુક્લિડ પ્રમેય: a = bq + r",
                                      listOf(
                                          QuestionAnswer("યુક્લિડની ભાગપ્રવિધિથી ગુ.સા.અ.(135, 225) શોધો.", "જવાબ:\n225 = 135 × 1 + 90\n135 = 90 × 1 + 45\n90 = 45 × 2 + 0\nઅહીં શેષ 0 મળતા ગુ.સા.અ.(135, 225) = 45 થાય."),
                                          QuestionAnswer("સાબિત કરો કે √5 અસંમેય સંખ્યા છે.", "જવાબ:\nધારો કે √5 = a/b (સંમેય છે). 5b² = a² થતાં a અને b નો સામાન્ય અવયવ 5 મળે છે, જે ધારણાથી વિરુદ્ધ હોવાથી √5 અસંમેય છે.")
                                      )
                                  )
                              )),
                              Subject("વિજ્ઞાન (Science)", "🔬", Color(0xFF43A047), listOf(
                                  Chapter(
                                      1,
                                      "રાસાયણિક પ્રક્રિયાઓ અને સમીકરણો",
                                      "📘 પાઠ્યપુસ્તક સારાંશ:\nરાસાયણિક સમીકરણ સંતુલન, વિસ્થાપન, ઓક્સિડેશન અને રિડક્શન પ્રક્રિયાઓ.",
                                      listOf(
                                          QuestionAnswer("વિસ્થાપન પ્રક્રિયા એટલે શું? ઉદાહરણ આપો.", "જવાબ:\nFe (લોખંડ) + CuSO₄ (કોપર સલ્ફેટ) -> FeSO₄ (આયર્ન સલ્ફેટ) + Cu (તાંબુ). વધુ સક્રિય ધાતુ ઓછી સક્રિય ધાતુનું વિસ્થાપન કરે છે.")
                                      )
                                  )
                              ))
                          )
                          else -> listOf(
                              Subject("ગણિત (Maths)", "📐", Color(0xFF1E88E5), listOf(
                                  Chapter(
                                      1,
                                      "પ્રકરણ ૧: પાયાની ગણતરી અને પુનરાવર્તન",
                                      "📘 પાઠ્યપુસ્તક સારાંશ:\nસંખ્યા જ્ઞાન, સ્થાનકિંમત, સરવાળા, બાદબાકી, ગુણાકાર અને ભાગાકાર.",
                                      listOf(
                                          QuestionAnswer("સંખ્યાઓની સ્થાનકિંમત ઉદાહરણ આપી સમજાવો: ૪,૫૮૨", "જવાબ:\n૪ ની સ્થાનકિંમત = ૪,૦૦૦ | ૫ ની = ૫૦૦ | ૮ ની = ૮૦ | ૨ ની = ૨")
                                      )
                                  )
                              ))
                          )
                      }
                      Standard(stdNumber = std, name = "ધોરણ $std (Standard $std)", section = section, subjects = subjects)
                  }
              }

              // COMPLETE COMPUTER LEARNING COURSE (બેઝિકથી એડવાન્સ કમ્પ્યુટર જ્ઞાન)
              fun getComputerLearningFolders(): List<FolderItem> {
                  return listOf(
                      FolderItem(
                          title = "૧. કમ્પ્યુટર બેઝિક્સ પરિચય (Computer Fundamentals)",
                          subtitle = "Hardware, Software & Parts of Computer",
                          icon = "💻",
                          details = listOf(
                              "કમ્પ્યુટર શું છે?" to "કમ્પ્યુટર એ ઇલેક્ટ્રોનિક મશીન છે જે ડેટા ઇનપુટ લઈને પ્રોસેસ કરે છે અને પરિણામ (આઉટપુટ) આપે છે.",
                              "ઇનપુટ ડિવાઇસ (Input Devices)" to "કીબોર્ડ (ટાઈપિંગ માટે), માઉસ (પોઇન્ટિંગ માટે), સ્કેનર, માઇક્રોફોન અને વેબકેમ.",
                              "આઉટપુટ ડિવાઇસ (Output Devices)" to "મોનિટર (સ્ક્રીન), પ્રિન્ટર (કાગળ પર પ્રિન્ટ માટે), સ્પીકર (અવાજ માટે).",
                              "CPU (Central Processing Unit)" to "કમ્પ્યુટરનું મગજ (Brain) કહેવાય છે. તેના ત્રણ ભાગ છે: ALU, CU અને Memory.",
                              "મેમરીના પ્રકાર (RAM & ROM)" to "RAM (ટેમ્પરરી મેમરી - સ્પીડ માટે) અને ROM / Hard Disk / SSD (કાયમી ડેટા સ્ટોરેજ માટે).",
                              "ઓપરેટિંગ સિસ્ટમ (OS)" to "Windows (સૌથી વધુ વપરાય છે), macOS (Apple) અને Linux (સુરક્ષિત ઓપન સોર્સ)."
                          )
                      ),
                      FolderItem(
                          title = "૨. કીબોર્ડ શોર્ટકટ કીઝ (A to Z Keyboard Shortcuts)",
                          subtitle = "Speed up your computer work",
                          icon = "⌨️",
                          details = listOf(
                              "Ctrl + C" to "Copy (કોપી કરવા માટે)",
                              "Ctrl + V" to "Paste (પેસ્ટ / ચોંટાડવા માટે)",
                              "Ctrl + X" to "Cut (કટ કરવા માટે)",
                              "Ctrl + Z" to "Undo (છેલ્લી ક્રિયા પાછી લાવવા માટે)",
                              "Ctrl + Y" to "Redo (પાછું કરેલું આગળ લાવવા)",
                              "Ctrl + A" to "Select All (બધો લખાણ એકસાથે સિલેક્ટ કરવા)",
                              "Ctrl + S" to "Save (ફાઇલ સેવ / સાચવવા માટે)",
                              "Ctrl + P" to "Print (પ્રિન્ટ કાઢવા માટે)",
                              "Alt + F4" to "ચાલુ પ્રોગ્રામ બંધ કરવા અથવા કમ્પ્યુટર શટડાઉન કરવા",
                              "Windows Key + D" to "સીધા ડેસ્કટોપ સ્ક્રીન પર જવા માટે"
                          )
                      ),
                      FolderItem(
                          title = "૩. માઇક્રોસોફ્ટ ઓફિસ (MS Word, Excel, PPT)",
                          subtitle = "Office Documentation & Presentation",
                          icon = "📑",
                          details = listOf(
                              "MS Word (વર્ડ પ્રોસેસિંગ)" to "લેટર, એપ્લિકેશન, રિપોર્ટ, બુક ટાઈપિંગ અને ફોન્ટ સ્ટાઇલ સેટ કરવા માટે વપરાય છે.",
                              "MS Excel (સ્પ્રેડશીટ)" to "કોષ્ટક (Rows & Columns), હિસાબ, માર્કશીટ, ગાણિતિક સૂત્રો (SUM, AVERAGE, IF) અને ગ્રાફ માટે વપરાય છે.",
                              "MS PowerPoint (પ્રેઝન્ટેશન)" to "સ્લાઇડ્સ, એનિમેશન અને સ્કૂલ/ઓફિસ પ્રેઝન્ટેશન બનાવવા માટે વપરાય છે.",
                              "MS Paint (પેઇન્ટ)" to "ચિત્રો દોરવા અને માઉસ કંટ્રોલ શીખવા માટે શ્રેષ્ઠ ટૂલ."
                          )
                      ),
                      FolderItem(
                          title = "૪. ઇન્ટરનેટ, ઈમેઇલ & સાયબર સુરક્ષા (Cyber Security)",
                          subtitle = "Safe Browsing, Gmail & Online Safety",
                          icon = "🌐",
                          details = listOf(
                              "વેબ બ્રાઉઝર (Browser)" to "Google Chrome, Microsoft Edge, Mozilla Firefox દ્વારા ઇન્ટરનેટ સર્ચ થાય છે.",
                              "ઈમેઇલ (Gmail) નો ઉપયોગ" to "Compose પર ક્લિક કરીને પત્ર/ફાઇલ મોકલી શકાય છે. To માં સામેવાળાનું ઈમેઈલ આઈડી લખવું.",
                              "સાયબર સુરક્ષા નિયમો" to "કોઈને પણ બેંક OTP કે પાસવર્ડ આપવો નહીં. અજાણી લિંક પર ક્લિક ન કરવું.",
                              "મજબૂત પાસવર્ડ (Strong Password)" to "નામ, આંકડા અને સ્પેશિયલ કેરેક્ટર (@, #, $) મિક્સ કરીને પાસવર્ડ બનાવવો."
                          )
                      ),
