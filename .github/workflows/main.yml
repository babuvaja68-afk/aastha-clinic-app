              fun search(query: String): List<MedicalCondition> {
                  if (query.isBlank()) return emptyList()
                  val clean = query.trim().lowercase()
                  return conditions.filter { condition ->
                      condition.name.lowercase().contains(clean) ||
                      condition.keywords.any { it.contains(clean) || clean.contains(it) }
                  }
              }
