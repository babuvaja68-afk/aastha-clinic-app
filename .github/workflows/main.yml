          @Composable
          fun LudoBoardScreen(
              gameState: GameState,
              isOnline: Boolean,
              diceRotation: Float,
              pulseScale: Float,
              funnyEmojis: List<String>,
              funnyComments: List<String>,
              onSendEmoji: (String) -> Unit,
              onSendComment: (String) -> Unit,
              onSimulateKill: (PlayerColor) -> Unit,
              onRollDice: () -> Unit,
              onShareRoom: (() -> Unit)? = null
          ) {
              Column(
                  modifier = Modifier.fillMaxSize().padding(10.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.SpaceBetween
              ) {
                  Card(
                      modifier = Modifier.fillMaxWidth().shadow(6.dp, RoundedCornerShape(14.dp)),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1E293B)),
                      shape = RoundedCornerShape(14.dp),
                      border = BorderStroke(1.5.dp, gameState.turn.primary)
                  ) {
                      Row(
                          modifier = Modifier.padding(10.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Surface(
                                  shape = CircleShape,
                                  color = gameState.turn.primary,
                                  modifier = Modifier.size(22.dp).scale(pulseScale)
                              ) {}
                              Spacer(modifier = Modifier.width(8.dp))
                              Column {
                                  Text("ચાલ: ${gameState.turn.label}", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = gameState.turn.primary)
                                  Text(gameState.message, fontSize = 11.sp, color = Color.LightGray)
                              }
                          }
                          if (isOnline && onShareRoom != null) {
                              Button(
                                  onClick = onShareRoom,
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF25D366)),
                                  contentPadding = PaddingValues(horizontal = 8.dp, vertical = 4.dp)
                              ) {
                                  Text("Share 💬", fontSize = 11.sp)
                              }
                          }
                      }
                  }

                  Box(
                      modifier = Modifier
                          .size(310.dp)
                          .shadow(16.dp, RoundedCornerShape(12.dp))
                          .border(4.dp, Brush.linearGradient(listOf(Color(0xFF8D6E63), Color(0xFF4E342E))), RoundedCornerShape(12.dp))
                          .background(Color(0xFFFFF8E1), RoundedCornerShape(12.dp))
                  ) {
                      LudoBoard3DCanvas(activeTurn = gameState.turn, pulseScale = pulseScale, onPawnClick = onSimulateKill)

                      AnimatedVisibility(
                          visible = gameState.lastKilledPlayer.isNotBlank(),
                          enter = scaleIn() + fadeIn(),
                          exit = scaleOut() + fadeOut(),
                          modifier = Modifier.align(Alignment.Center)
                      ) {
                          Surface(
                              shape = RoundedCornerShape(18.dp),
                              color = Color(0xF20F172A),
                              border = BorderStroke(2.dp, Color(0xFFE53935)),
                              shadowElevation = 16.dp,
                              modifier = Modifier.padding(14.dp)
                          ) {
                              Column(
                                  modifier = Modifier.padding(16.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text("🎺 😭 💀", fontSize = 34.sp)
                                  Spacer(modifier = Modifier.height(6.dp))
                                  Text("ગોટી કપાઈ ગઈ!", fontWeight = FontWeight.Black, fontSize = 18.sp, color = Color(0xFFFFD54F))
                                  Text("${gameState.lastKilledPlayer} પ્લેયરની ગોટી ઘરે ગઈ!", fontSize = 12.sp, color = Color.White)
                              }
                          }
                      }

                      AnimatedVisibility(
                          visible = gameState.activeEmoji.isNotBlank() && gameState.lastKilledPlayer.isBlank(),
                          enter = scaleIn() + fadeIn(),
                          exit = scaleOut() + fadeOut(),
                          modifier = Modifier.align(Alignment.Center)
                      ) {
                          Surface(
                              shape = CircleShape,
                              color = Color(0xCC0F172A),
                              border = BorderStroke(2.dp, Color(0xFFFFD54F)),
                              modifier = Modifier.size(74.dp)
                          ) {
                              Box(contentAlignment = Alignment.Center) {
                                  Text(gameState.activeEmoji, fontSize = 42.sp)
                              }
                          }
                      }

                      AnimatedVisibility(
                          visible = gameState.activeComment.isNotBlank() && gameState.lastKilledPlayer.isBlank(),
                          enter = slideInVertically() + fadeIn(),
                          exit = slideOutVertically() + fadeOut(),
                          modifier = Modifier.align(Alignment.TopCenter).padding(top = 10.dp)
                      ) {
                          Surface(
                              shape = RoundedCornerShape(16.dp),
                              color = Color(0xEE1E293B),
                              border = BorderStroke(1.5.dp, Color(0xFF25D366)),
                              shadowElevation = 8.dp
                          ) {
                              Text(
                                  text = "💬 ${gameState.activeComment}",
                                  color = Color.White,
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 13.sp,
                                  modifier = Modifier.padding(horizontal = 14.dp, vertical = 6.dp)
                              )
                          }
                      }
                  }

                  Column(modifier = Modifier.fillMaxWidth()) {
                      LazyRow(
                          modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          items(funnyEmojis) { emoji ->
                              Surface(
                                  shape = CircleShape,
                                  color = Color(0xFF1E293B),
                                  border = BorderStroke(1.dp, Color(0xFF334155)),
                                  modifier = Modifier.size(38.dp).clickable { onSendEmoji(emoji) }
                              ) {
                                  Box(contentAlignment = Alignment.Center) {
                                      Text(emoji, fontSize = 20.sp)
                                  }
                              }
                          }
                      }

                      LazyRow(
                          modifier = Modifier.fillMaxWidth().padding(bottom = 6.dp),
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          items(funnyComments) { comment ->
                              Surface(
                                  shape = RoundedCornerShape(12.dp),
                                  color = Color(0xFF1E293B),
                                  border = BorderStroke(1.dp, Color(0xFF475569)),
                                  modifier = Modifier.clickable { onSendComment(comment) }
                              ) {
                                  Text(
                                      text = comment,
                                      color = Color(0xFFE2E8F0),
                                      fontSize = 11.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      modifier = Modifier.padding(horizontal = 10.dp, vertical = 4.dp)
                                  )
                              }
                          }
                      }
                  }

                  Card(
                      modifier = Modifier.fillMaxWidth().shadow(8.dp, RoundedCornerShape(16.dp)),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1E293B)),
                      shape = RoundedCornerShape(16.dp),
                      border = BorderStroke(2.dp, Brush.linearGradient(listOf(Color(0xFFFFD54F), Color(0xFFFF8F00))))
                  ) {
                      Row(
                          modifier = Modifier.padding(10.dp).fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceAround,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Surface(
                              shape = RoundedCornerShape(14.dp),
                              color = Color.White,
                              shadowElevation = 12.dp,
                              border = BorderStroke(3.dp, gameState.turn.primary),
                              modifier = Modifier
                                  .size(62.dp)
                                  .rotate(diceRotation)
                                  .clickable { onRollDice() }
                          ) {
                              Box(
                                  modifier = Modifier
                                      .background(Brush.radialGradient(listOf(Color.White, Color(0xFFE2E8F0))))
                                      .fillMaxSize(),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(
                                      text = when (gameState.diceValue) {
                                          1 -> "⚀"
                                          2 -> "⚁"
                                          3 -> "⚂"
                                          4 -> "⚃"
                                          5 -> "⚄"
                                          else -> "⚅"
                                      },
                                      fontSize = 42.sp,
                                      color = if (gameState.diceValue == 6) Color(0xFFE53935) else Color(0xFF0F172A)
                                  )
                              }
                          }

                          Button(
                              onClick = onRollDice,
                              modifier = Modifier.height(46.dp).shadow(8.dp, RoundedCornerShape(12.dp)),
                              colors = ButtonDefaults.buttonColors(containerColor = gameState.turn.primary),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Text("ડાઈસ ફેંકો 🎲", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color.White)
                          }
                      }
                  }
              }
          }

          @Composable
          fun LudoBoard3DCanvas(activeTurn: PlayerColor, pulseScale: Float, onPawnClick: (PlayerColor) -> Unit) {
              Column(modifier = Modifier.fillMaxSize()) {
                  Row(modifier = Modifier.weight(6f)) {
                      Box(modifier = Modifier.weight(6f).fillMaxHeight().background(Brush.radialGradient(listOf(PlayerColor.RED.light, PlayerColor.RED.primary)))) {
                          BaseWith3DPawns(PlayerColor.RED, activeTurn == PlayerColor.RED, pulseScale, onPawnClick)
                      }
                      Column(modifier = Modifier.weight(3f).fillMaxHeight()) {
                          for (i in 0 until 6) {
                              Row(modifier = Modifier.weight(1f).fillMaxWidth()) {
                                  Box(modifier = Modifier.weight(1f).fillMaxHeight().border(0.5.dp, Color(0xFFBCAAA4))) {
                                      if (i == 1) Text("★", color = Color(0xFF43A047), modifier = Modifier.align(Alignment.Center), fontSize = 11.sp)
                                  }
                                  Box(modifier = Modifier.weight(1f).fillMaxHeight().background(if (i > 0) PlayerColor.GREEN.primary else Color.White).border(0.5.dp, Color(0xFFBCAAA4)))
                                  Box(modifier = Modifier.weight(1f).fillMaxHeight().border(0.5.dp, Color(0xFFBCAAA4)))
                              }
                          }
                      }
                      Box(modifier = Modifier.weight(6f).fillMaxHeight().background(Brush.radialGradient(listOf(PlayerColor.GREEN.light, PlayerColor.GREEN.primary)))) {
                          BaseWith3DPawns(PlayerColor.GREEN, activeTurn == PlayerColor.GREEN, pulseScale, onPawnClick)
                      }
                  }

                  Row(modifier = Modifier.weight(3f)) {
                      Column(modifier = Modifier.weight(6f).fillMaxHeight()) {
                          for (i in 0 until 3) {
                              Row(modifier = Modifier.weight(1f).fillMaxWidth()) {
                                  for (j in 0 until 6) {
                                      Box(modifier = Modifier.weight(1f).fillMaxHeight().background(if (i == 1 && j > 0) PlayerColor.RED.primary else Color.White).border(0.5.dp, Color(0xFFBCAAA4))) {
                                          if (i == 2 && j == 1) Text("★", color = Color(0xFFE53935), modifier = Modifier.align(Alignment.Center), fontSize = 11.sp)
                                      }
                                  }
                              }
                          }
                      }
                      Box(
                          modifier = Modifier.weight(3f).fillMaxHeight().background(Brush.radialGradient(listOf(Color(0xFFFFD54F), Color(0xFF0F172A)))),
                          contentAlignment = Alignment.Center
                      ) {
                          Text("🏆", fontSize = 22.sp)
                      }
                      Column(modifier = Modifier.weight(6f).fillMaxHeight()) {
                          for (i in 0 until 3) {
                              Row(modifier = Modifier.weight(1f).fillMaxWidth()) {
                                  for (j in 0 until 6) {
                                      Box(modifier = Modifier.weight(1f).fillMaxHeight().background(if (i == 1 && j < 5) PlayerColor.YELLOW.primary else Color.White).border(0.5.dp, Color(0xFFBCAAA4))) {
                                          if (i == 0 && j == 4) Text("★", color = Color(0xFFF57F17), modifier = Modifier.align(Alignment.Center), fontSize = 11.sp)
                                      }
                                  }
                              }
                          }
                      }
                  }

                  Row(modifier = Modifier.weight(6f)) {
                      Box(modifier = Modifier.weight(6f).fillMaxHeight().background(Brush.radialGradient(listOf(PlayerColor.BLUE.light, PlayerColor.BLUE.primary)))) {
                          BaseWith3DPawns(PlayerColor.BLUE, activeTurn == PlayerColor.BLUE, pulseScale, onPawnClick)
                      }
                      Column(modifier = Modifier.weight(3f).fillMaxHeight()) {
                          for (i in 0 until 6) {
                              Row(modifier = Modifier.weight(1f).fillMaxWidth()) {
                                  Box(modifier = Modifier.weight(1f).fillMaxHeight().border(0.5.dp, Color(0xFFBCAAA4))) {
                                      if (i == 4) Text("★", color = Color(0xFF1E88E5), modifier = Modifier.align(Alignment.Center), fontSize = 11.sp)
                                  }
                                  Box(modifier = Modifier.weight(1f).fillMaxHeight().background(if (i < 5) PlayerColor.BLUE.primary else Color.White).border(0.5.dp, Color(0xFFBCAAA4)))
                                  Box(modifier = Modifier.weight(1f).fillMaxHeight().border(0.5.dp, Color(0xFFBCAAA4)))
                              }
                          }
                      }
                      Box(modifier = Modifier.weight(6f).fillMaxHeight().background(Brush.radialGradient(listOf(PlayerColor.YELLOW.light, PlayerColor.YELLOW.primary)))) {
                          BaseWith3DPawns(PlayerColor.YELLOW, activeTurn == PlayerColor.YELLOW, pulseScale, onPawnClick)
                      }
                  }
              }
          }

          @Composable
          fun BaseWith3DPawns(color: PlayerColor, isActive: Boolean, pulseScale: Float, onPawnClick: (PlayerColor) -> Unit) {
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(10.dp)
                      .background(Color.White, RoundedCornerShape(10.dp))
                      .border(2.dp, color.dark, RoundedCornerShape(10.dp)),
                  contentAlignment = Alignment.Center
              ) {
                  Row(
                      modifier = Modifier.fillMaxSize().padding(2.dp),
                      horizontalArrangement = Arrangement.SpaceEvenly,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(verticalArrangement = Arrangement.SpaceEvenly) {
                          Pawn3DToken(color, isActive, pulseScale) { onPawnClick(color) }
                          Spacer(modifier = Modifier.height(8.dp))
                          Pawn3DToken(color, isActive, pulseScale) { onPawnClick(color) }
                      }
                      Column(verticalArrangement = Arrangement.SpaceEvenly) {
                          Pawn3DToken(color, isActive, pulseScale) { onPawnClick(color) }
                          Spacer(modifier = Modifier.height(8.dp))
                          Pawn3DToken(color, isActive, pulseScale) { onPawnClick(color) }
                      }
                  }
              }
          }

          @Composable
          fun Pawn3DToken(color: PlayerColor, isActive: Boolean, pulseScale: Float, onClick: () -> Unit) {
              Surface(
                  shape = CircleShape,
                  color = color.primary,
                  shadowElevation = 6.dp,
                  border = BorderStroke(2.dp, if (isActive) Color(0xFFFFD54F) else Color.White),
                  modifier = Modifier
                      .size(20.dp)
                      .scale(if (isActive) pulseScale else 1f)
                      .clickable { onClick() }
              ) {
                  Box(
                      modifier = Modifier.background(Brush.radialGradient(listOf(Color.White, color.primary))),
                      contentAlignment = Alignment.Center
                  ) {
                      Text("👑", fontSize = 9.sp)
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Star-Club-Final-Edition-APK
          path: app/build/outputs/apk/debug/app-debug.apk
