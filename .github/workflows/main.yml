          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      GSEBVidyaSetuApp()
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun GSEBVidyaSetuApp() {
              val context = LocalContext.current

              var isDarkMode by remember { mutableStateOf(false) }
              var currentMedium by remember { mutableStateOf(AppMedium.GUJARATI) }
              val isGu = currentMedium == AppMedium.GUJARATI

              // Dynamic Color Palette for Dark & Light Mode
              val bgColor = if (isDarkMode) Color(0xFF121212) else Color(0xFFF4F7FB)
              val cardBg = if (isDarkMode) Color(0xFF1E1E1E) else Color.White
              val textColor = if (isDarkMode) Color.White else Color(0xFF1E293B)
              val primaryColor = if (isDarkMode) Color(0xFF1976D2) else Color(0xFF0D276B)
              val secondaryText = if (isDarkMode) Color(0xFFB0BEC5) else Color(0xFF64748B)

              val standards = remember { EducationRepository.getStandards() }
              val computerFolders = remember { EducationRepository.getComputerFolders() }
              val spokenEnglishFolders = remember { EducationRepository.getSpokenEnglishFolders() }
              val knowledgeFolders = remember { EducationRepository.getKnowledgeFolders() }

              var selectedTab by remember { mutableStateOf(0) }
              var selectedStandard by remember { mutableStateOf<Standard?>(null) }
              var selectedSubject by remember { mutableStateOf<Subject?>(null) }
              var selectedChapter by remember { mutableStateOf<Chapter?>(null) }
              var activeFolder by remember { mutableStateOf<FolderItem?>(null) }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Image(
                                      painter = painterResource(id = R.drawable.ic_education_logo),
                                      contentDescription = "Logo",
                                      modifier = Modifier.size(36.dp)
                                  )
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Column {
                                      Text(
                                          text = when (selectedTab) {
                                              0 -> if (selectedChapter != null) (if (isGu) selectedChapter!!.titleGu else selectedChapter!!.titleEn)
                                                   else if (selectedSubject != null) (if (isGu) selectedSubject!!.nameGu else selectedSubject!!.nameEn)
                                                   else if (selectedStandard != null) (if (isGu) selectedStandard!!.nameGu else selectedStandard!!.nameEn)
                                                   else (if (isGu) "GSEB વિદ્યાસેતુ" else "GSEB VidyaSetu")
                                              1 -> if (activeFolder != null) (if (isGu) activeFolder!!.titleGu else activeFolder!!.titleEn) else (if (isGu) "💻 કમ્પ્યુટર કોર્સ" else "💻 Computer Course")
                                              2 -> if (activeFolder != null) (if (isGu) activeFolder!!.titleGu else activeFolder!!.titleEn) else (if (isGu) "🗣️ સ્પોકન ઇંગ્લિશ" else "🗣️ Spoken English")
                                              else -> if (activeFolder != null) (if (isGu) activeFolder!!.titleGu else activeFolder!!.titleEn) else (if (isGu) "🇮🇳 ભારત & વિશ્વ જ્ઞાન" else "🇮🇳 India & World GK")
                                          },
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 16.sp,
                                          color = Color.White,
                                          maxLines = 1
                                      )
                                      Text(
                                          text = if (isGu) "ધોરણ ૧-૧૨ • કમ્પ્યુટર • ભારત & વિશ્વ" else "Std 1-12 • Computer • India & World",
                                          fontSize = 11.sp,
                                          color = Color(0xFFE1F5FE)
                                      )
                                  }
                              }
                          },
                          actions = {
                              // Dark Mode Toggle Button
                              IconButton(onClick = { isDarkMode = !isDarkMode }) {
                                  Icon(
                                      imageVector = if (isDarkMode) Icons.Default.LightMode else Icons.Default.DarkMode,
                                      contentDescription = "Theme Toggle",
                                      tint = Color(0xFFFFC107)
                                  )
                              }

                              // Language Medium Switcher Button
                              Button(
                                  onClick = {
                                      currentMedium = if (isGu) AppMedium.ENGLISH else AppMedium.GUJARATI
                                  },
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFC107)),
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp)
                              ) {
                                  Text(
                                      text = if (isGu) "English" else "ગુજરાતી",
                                      color = Color(0xFF0D276B),
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 12.sp
                                  )
                              }
                          },
                          navigationIcon = {
                              val canGoBack = (selectedTab == 0 && selectedStandard != null) || (selectedTab != 0 && activeFolder != null)
                              if (canGoBack) {
                                  IconButton(onClick = {
                                      if (selectedTab == 0) {
                                          if (selectedChapter != null) selectedChapter = null
                                          else if (selectedSubject != null) selectedSubject = null
                                          else selectedStandard = null
                                      } else {
                                          activeFolder = null
                                      }
                                  }) {
                                      Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White)
                                  }
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = primaryColor)
                      )
                  },
                  bottomBar = {
                      NavigationBar(containerColor = cardBg) {
                          NavigationBarItem(
                              selected = selectedTab == 0,
                              onClick = { selectedTab = 0; activeFolder = null },
                              icon = { Icon(Icons.Default.MenuBook, contentDescription = null) },
                              label = { Text(if (isGu) "ધોરણ ૧-૧૨" else "Std 1-12", fontSize = 11.sp, color = textColor) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 1,
                              onClick = { selectedTab = 1; activeFolder = null },
                              icon = { Icon(Icons.Default.Computer, contentDescription = null) },
                              label = { Text(if (isGu) "કમ્પ્યુટર" else "Computer", fontSize = 11.sp, color = textColor) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 2,
                              onClick = { selectedTab = 2; activeFolder = null },
                              icon = { Icon(Icons.Default.RecordVoiceOver, contentDescription = null) },
                              label = { Text(if (isGu) "ઇંગ્લિશ" else "English", fontSize = 11.sp, color = textColor) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 3,
                              onClick = { selectedTab = 3; activeFolder = null },
                              icon = { Icon(Icons.Default.Public, contentDescription = null) },
                              label = { Text(if (isGu) "વિશ્વ & GK" else "World GK", fontSize = 11.sp, color = textColor) }
                          )
                      }
                  }
              ) { padding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .background(bgColor)
                  ) {
                      when (selectedTab) {
                          0 -> {
                              when {
                                  selectedChapter != null -> ChapterDetailScreen(selectedChapter!!, isGu, cardBg, textColor, secondaryText, context)
                                  selectedSubject != null -> SubjectChaptersScreen(selectedSubject!!, isGu, cardBg, textColor, secondaryText, onChapterSelect = { selectedChapter = it })
                                  selectedStandard != null -> StandardSubjectsScreen(selectedStandard!!, isGu, cardBg, textColor, secondaryText, onSubjectSelect = { selectedSubject = it })
                                  else -> StandardsListScreen(standards, isGu, cardBg, textColor, secondaryText, primaryColor, onStandardSelect = { selectedStandard = it })
                              }
                          }
                          1 -> FolderViewScreen(
                              folderList = computerFolders,
                              activeFolder = activeFolder,
                              isGu = isGu,
                              cardBg = cardBg,
                              textColor = textColor,
                              secondaryText = secondaryText,
                              primaryColor = primaryColor,
                              onSelectFolder = { activeFolder = it },
                              headerTitle = if (isGu) "💻 કમ્પ્યુટર શીખો (Complete Course)" else "💻 Learn Computer Course",
                              headerSubtitle = if (isGu) "બેઝિક્સ, શોર્ટકટ્સ, MS Office, ઈન્ટરનેટ અને AI" else "Basics, Shortcuts, MS Office, Internet & AI"
                          )
                          2 -> FolderViewScreen(
                              folderList = spokenEnglishFolders,
                              activeFolder = activeFolder,
                              isGu = isGu,
                              cardBg = cardBg,
                              textColor = textColor,
                              secondaryText = secondaryText,
                              primaryColor = primaryColor,
                              onSelectFolder = { activeFolder = it },
                              headerTitle = if (isGu) "🗣️ સ્પોકન ઇંગ્લિશ (Spoken English)" else "🗣️ Spoken English Mastery",
                              headerSubtitle = if (isGu) "રોજિંદા વાક્યો, શબ્દભંડોળ અને વ્યાકરણ" else "Daily Sentences, Vocabulary & Grammar"
                          )
                          3 -> FolderViewScreen(
                              folderList = knowledgeFolders,
                              activeFolder = activeFolder,
                              isGu = isGu,
                              cardBg = cardBg,
                              textColor = textColor,
                              secondaryText = secondaryText,
                              primaryColor = primaryColor,
                              onSelectFolder = { activeFolder = it },
                              headerTitle = if (isGu) "🇮🇳 ભારત & વિશ્વ જ્ઞાન (World & India GK)" else "🇮🇳 India & World General Knowledge",
                              headerSubtitle = if (isGu) "ઇતિહાસ, ભૂગોળ, અજાયબીઓ અને વિજ્ઞાન" else "History, Geography, Space & Monuments"
                          )
                      }
                  }
              }
          }

          @Composable
          fun FolderViewScreen(
              folderList: List<FolderItem>,
              activeFolder: FolderItem?,
              isGu: Boolean,
              cardBg: Color,
              textColor: Color,
              secondaryText: Color,
              primaryColor: Color,
              onSelectFolder: (FolderItem) -> Unit,
              headerTitle: String,
              headerSubtitle: String
          ) {
              if (activeFolder == null) {
                  LazyColumn(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                      item {
                          Text(headerTitle, fontWeight = FontWeight.Bold, fontSize = 18.sp, color = textColor)
                          Text(headerSubtitle, fontSize = 12.sp, color = secondaryText)
                          Spacer(modifier = Modifier.height(12.dp))
                      }

                      items(folderList) { folder ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 5.dp)
                                  .clickable { onSelectFolder(folder) },
                              colors = CardDefaults.cardColors(containerColor = cardBg),
                              elevation = CardDefaults.cardElevation(2.dp),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Row(
                                  modifier = Modifier.padding(16.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Surface(
                                          shape = RoundedCornerShape(10.dp),
                                          color = Color(0xFFE8EAF6),
                                          modifier = Modifier.size(46.dp)
                                      ) {
                                          Box(contentAlignment = Alignment.Center) {
                                              Text(folder.icon, fontSize = 22.sp)
                                          }
                                      }
                                      Spacer(modifier = Modifier.width(14.dp))
                                      Column {
                                          Text(if (isGu) folder.titleGu else folder.titleEn, fontWeight = FontWeight.Bold, fontSize = 15.sp, color = textColor)
                                          Text(if (isGu) folder.subtitleGu else folder.subtitleEn, fontSize = 12.sp, color = secondaryText)
                                      }
                                  }
                                  Icon(Icons.Default.ChevronRight, contentDescription = null, tint = primaryColor)
                              }
                          }
                      }
                  }
              } else {
                  var readingTab by remember { mutableStateOf(0) }
                  val fullArticle = if (isGu) activeFolder.fullArticleGu else activeFolder.fullArticleEn
                  val details = if (isGu) activeFolder.detailsGu else activeFolder.detailsEn

                  Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                      Card(
                          modifier = Modifier.fillMaxWidth().padding(bottom = 10.dp),
                          colors = CardDefaults.cardColors(containerColor = primaryColor),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Row(modifier = Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                              Text(activeFolder.icon, fontSize = 28.sp)
                              Spacer(modifier = Modifier.width(10.dp))
                              Column {
                                  Text(if (isGu) activeFolder.titleGu else activeFolder.titleEn, fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
                                  Text(if (isGu) activeFolder.subtitleGu else activeFolder.subtitleEn, fontSize = 11.sp, color = Color(0xFFBBDEFB))
                              }
                          }
                      }

                      TabRow(selectedTabIndex = readingTab, containerColor = cardBg) {
                          Tab(
                              selected = readingTab == 0,
                              onClick = { readingTab = 0 },
                              text = { Text(if (isGu) "📖 સંપૂર્ણ લેખ & વિગત" else "📖 Full In-Depth Article", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = textColor) }
                          )
                          Tab(
                              selected = readingTab == 1,
                              onClick = { readingTab = 1 },
                              text = { Text(if (isGu) "📌 મુખ્ય મુદ્દાઓ (Key Points)" else "📌 Key Summary Points", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = textColor) }
                          )
                      }

                      Spacer(modifier = Modifier.height(10.dp))

                      if (readingTab == 0) {
                          Card(
                              modifier = Modifier.fillMaxSize(),
                              colors = CardDefaults.cardColors(containerColor = cardBg),
                              shape = RoundedCornerShape(12.dp),
                              elevation = CardDefaults.cardElevation(2.dp)
                          ) {
                              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                                  item {
                                      Text(
                                          text = fullArticle,
                                          fontSize = 14.sp,
                                          color = textColor,
                                          lineHeight = 23.sp
                                      )
                                  }
                              }
                          }
                      } else {
                          LazyColumn(modifier = Modifier.fillMaxSize()) {
                              items(details) { (itemKey, itemVal) ->
                                  Card(
                                      modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                                      colors = CardDefaults.cardColors(containerColor = cardBg),
                                      elevation = CardDefaults.cardElevation(1.dp),
                                      shape = RoundedCornerShape(10.dp)
                                  ) {
                                      Column(modifier = Modifier.padding(12.dp)) {
                                          Text("📌 $itemKey", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF1565C0))
                                          Spacer(modifier = Modifier.height(4.dp))
                                          Text(itemVal, fontSize = 13.sp, color = textColor, lineHeight = 20.sp)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun StandardsListScreen(
              standards: List<Standard>,
              isGu: Boolean,
              cardBg: Color,
              textColor: Color,
              secondaryText: Color,
              primaryColor: Color,
              onStandardSelect: (Standard) -> Unit
          ) {
              LazyColumn(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  item {
                      Card(
                          modifier = Modifier.fillMaxWidth().padding(bottom = 14.dp),
                          colors = CardDefaults.cardColors(containerColor = primaryColor),
                          shape = RoundedCornerShape(14.dp)
                      ) {
                          Row(
                              modifier = Modifier.padding(16.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Image(
                                  painter = painterResource(id = R.drawable.ic_education_logo),
                                  contentDescription = "Education Logo",
                                  modifier = Modifier.size(54.dp)
                              )
                              Spacer(modifier = Modifier.width(14.dp))
                              Column {
                                  Text(if (isGu) "તમારું ધોરણ પસંદ કરો" else "Select Your Standard", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color.White)
                                  Text(if (isGu) "ધોરણ ૧ થી ૧૨ ના ડિજિટલ પુસ્તકો અને જવાબો" else "Standard 1 to 12 Digital Books & Workbooks", fontSize = 12.sp, color = Color(0xFFBBDEFB))
                              }
                          }
                      }
                  }

                  items(standards) { std ->
                      Card(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(vertical = 5.dp)
                              .clickable { onStandardSelect(std) },
                          colors = CardDefaults.cardColors(containerColor = cardBg),
                          elevation = CardDefaults.cardElevation(2.dp),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Row(
                              modifier = Modifier.padding(16.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Surface(
                                      shape = RoundedCornerShape(10.dp),
                                      color = Color(0xFFE8EAF6),
                                      modifier = Modifier.size(46.dp)
                                  ) {
                                      Box(contentAlignment = Alignment.Center) {
                                          Text("${std.stdNumber}", fontWeight = FontWeight.Black, fontSize = 20.sp, color = Color(0xFF0D276B))
                                      }
                                  }
                                  Spacer(modifier = Modifier.width(14.dp))
                                  Column {
                                      Text(if (isGu) std.nameGu else std.nameEn, fontWeight = FontWeight.Bold, fontSize = 16.sp, color = textColor)
                                      Text(if (isGu) std.sectionGu else std.sectionEn, fontSize = 12.sp, color = secondaryText)
                                  }
                              }
                              Icon(Icons.Default.ChevronRight, contentDescription = null, tint = primaryColor)
                          }
                      }
                  }
              }
          }

          @Composable
          fun StandardSubjectsScreen(
              standard: Standard,
              isGu: Boolean,
              cardBg: Color,
              textColor: Color,
              secondaryText: Color,
              onSubjectSelect: (Subject) -> Unit
          ) {
              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Text(if (isGu) "વિષય પસંદ કરો (Select Subject)" else "Select Subject", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = textColor)
                  Text(if (isGu) standard.nameGu else standard.nameEn, fontSize = 13.sp, color = secondaryText)
                  Spacer(modifier = Modifier.height(12.dp))

                  LazyVerticalGrid(
                      columns = GridCells.Fixed(2),
                      horizontalArrangement = Arrangement.spacedBy(10.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      items(standard.subjects) { subject ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(130.dp)
                                  .clickable { onSubjectSelect(subject) },
                              colors = CardDefaults.cardColors(containerColor = cardBg),
                              elevation = CardDefaults.cardElevation(3.dp),
                              shape = RoundedCornerShape(14.dp)
                          ) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .padding(12.dp),
                                  verticalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Text(subject.iconEmoji, fontSize = 28.sp)
                                  Column {
                                      Text(if (isGu) subject.nameGu else subject.nameEn, fontWeight = FontWeight.Bold, fontSize = 14.sp, color = textColor)
                                      Text("${subject.chapters.size} ${if (isGu) "પ્રકરણો" else "Chapters"}", fontSize = 11.sp, color = secondaryText)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SubjectChaptersScreen(
              subject: Subject,
              isGu: Boolean,
              cardBg: Color,
              textColor: Color,
              secondaryText: Color,
              onChapterSelect: (Chapter) -> Unit
          ) {
              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Text(if (isGu) "પ્રકરણોની યાદી (Chapters List)" else "Chapters List", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = textColor)
                  Text(if (isGu) subject.nameGu else subject.nameEn, fontSize = 13.sp, color = secondaryText)
                  Spacer(modifier = Modifier.height(12.dp))

                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                      items(subject.chapters) { chapter ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 5.dp)
                                  .clickable { onChapterSelect(chapter) },
                              colors = CardDefaults.cardColors(containerColor = cardBg),
                              elevation = CardDefaults.cardElevation(2.dp),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Row(
                                  modifier = Modifier.padding(16.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(if (isGu) chapter.titleGu else chapter.titleEn, fontWeight = FontWeight.Bold, fontSize = 15.sp, color = textColor)
                                      Text(if (isGu) "📖 ડિજિટલ પુસ્તક + ✍️ સ્વાધ્યાયપોથી" else "📖 Digital Book + ✍️ Workbook Solutions", fontSize = 12.sp, color = Color(0xFF0D276B))
                                  }
                                  Icon(Icons.Default.ArrowForwardIos, contentDescription = null, tint = Color.Gray, modifier = Modifier.size(16.dp))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChapterDetailScreen(
              chapter: Chapter,
              isGu: Boolean,
              cardBg: Color,
              textColor: Color,
              secondaryText: Color,
              context: Context
          ) {
              var selectedViewTab by remember { mutableStateOf(0) }
              val bookUrl = if (isGu) chapter.textbookUrlGu else chapter.textbookUrlEn
              val swadhyayUrl = if (isGu) chapter.swadhyayPothiUrlGu else chapter.swadhyayPothiUrlEn

              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(
                          onClick = {
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(bookUrl))
                                  context.startActivity(intent)
                              } catch (e: Exception) {
                                  Toast.makeText(context, "PDF Browser ma open thai rahi che...", Toast.LENGTH_SHORT).show()
                              }
                          },
                          modifier = Modifier.weight(1f),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B)),
                          shape = RoundedCornerShape(10.dp)
                      ) {
                          Text(if (isGu) "📥 પુસ્તક PDF" else "📥 Textbook PDF", fontSize = 12.sp)
                      }

                      Button(
                          onClick = {
                              try {
                                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(swadhyayUrl))
                                  context.startActivity(intent)
                              } catch (e: Exception) {
                                  Toast.makeText(context, "Swadhyay Pothi open thai rahi che...", Toast.LENGTH_SHORT).show()
                              }
                          },
                          modifier = Modifier.weight(1f),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E7D32)),
                          shape = RoundedCornerShape(10.dp)
                      ) {
                          Text(if (isGu) "📝 સ્વાધ્યાયપોથી" else "📝 Workbook PDF", fontSize = 12.sp)
                      }
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  TabRow(selectedTabIndex = selectedViewTab, containerColor = cardBg) {
                      Tab(
                          selected = selectedViewTab == 0,
                          onClick = { selectedViewTab = 0 },
                          text = { Text(if (isGu) "📖 સંપૂર્ણ વાર્તા & સારાંશ" else "📖 Full Story & Theory", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = textColor) }
                      )
                      Tab(
                          selected = selectedViewTab == 1,
                          onClick = { selectedViewTab = 1 },
                          text = { Text(if (isGu) "✍️ સ્વાધ્યાયપોથી જવાબો" else "✍️ Workbook Q&A", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = textColor) }
                      )
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  if (selectedViewTab == 0) {
                      Card(
                          modifier = Modifier.fillMaxSize(),
                          colors = CardDefaults.cardColors(containerColor = cardBg),
                          shape = RoundedCornerShape(12.dp),
                          elevation = CardDefaults.cardElevation(2.dp)
                      ) {
                          LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                              item {
                                  Text(if (isGu) chapter.titleGu else chapter.titleEn, fontWeight = FontWeight.Bold, fontSize = 17.sp, color = Color(0xFF0D276B))
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text(
                                      text = if (isGu) chapter.storyAndSummaryGu else chapter.storyAndSummaryEn,
                                      fontSize = 14.sp,
                                      color = textColor,
                                      lineHeight = 22.sp
                                  )
                              }
                          }
                      }
                  } else {
                      val qaList = if (isGu) chapter.swadhyayAnswersGu else chapter.swadhyayAnswersEn
                      LazyColumn(modifier = Modifier.fillMaxSize()) {
                          items(qaList) { qa ->
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 6.dp),
                                  colors = CardDefaults.cardColors(containerColor = cardBg),
                                  elevation = CardDefaults.cardElevation(2.dp),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Column(modifier = Modifier.padding(14.dp)) {
                                      Surface(
                                          color = Color(0xFFFFF3E0),
                                          shape = RoundedCornerShape(6.dp)
                                      ) {
                                          Text(
                                              text = qa.type,
                                              modifier = Modifier.padding(horizontal = 8.dp, vertical = 2.dp),
                                              fontSize = 11.sp,
                                              fontWeight = FontWeight.Bold,
                                              color = Color(0xFFE65100)
                                          )
                                      }
                                      Spacer(modifier = Modifier.height(6.dp))
                                      Text("${if (isGu) "પ્રશ્ન" else "Question"}: ${qa.question}", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = textColor)
                                      Spacer(modifier = Modifier.height(6.dp))
                                      Text(qa.answer, fontSize = 13.sp, color = textColor, lineHeight = 20.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          chmod +x gradlew || gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSEB-VidyaSetu-Edu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
