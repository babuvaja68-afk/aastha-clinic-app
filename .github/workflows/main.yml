          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      GSEBVidyaSetuApp()
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun GSEBVidyaSetuApp() {
              val context = LocalContext.current
              val standards = remember { EducationRepository.getStandards() }
              val spokenEnglishFolders = remember { EducationRepository.getSpokenEnglishFolders() }
              val bharatFolders = remember { EducationRepository.getBharatKoJanoFolders() }
              val worldFolders = remember { EducationRepository.getWorldAndScienceFolders() }

              var selectedTab by remember { mutableStateOf(0) }
              var selectedStandard by remember { mutableStateOf<Standard?>(null) }
              var selectedSubject by remember { mutableStateOf<Subject?>(null) }
              var selectedChapter by remember { mutableStateOf<Chapter?>(null) }
              var activeFolder by remember { mutableStateOf<FolderItem?>(null) }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Image(
                                      painter = painterResource(id = R.drawable.ic_education_logo),
                                      contentDescription = "Logo",
                                      modifier = Modifier.size(36.dp)
                                  )
                                  Spacer(modifier = Modifier.width(10.dp))
                                  Column {
                                      Text(
                                          text = when (selectedTab) {
                                              0 -> if (selectedChapter != null) selectedChapter!!.title else if (selectedSubject != null) selectedSubject!!.name else if (selectedStandard != null) selectedStandard!!.name else "GSEB વિદ્યાસેતુ (ધોરણ ૧-૧૨)"
                                              1 -> if (activeFolder != null) activeFolder!!.title else "🗣️ સ્પોકન ઇંગ્લિશ (Spoken English)"
                                              2 -> if (activeFolder != null) activeFolder!!.title else "🇮🇳 ભારત કો જાનો (Know India)"
                                              else -> if (activeFolder != null) activeFolder!!.title else "🌍 વિશ્વ ઇતિહાસ, ભૂગોળ & વિજ્ઞાન"
                                          },
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 17.sp,
                                          color = Color.White
                                      )
                                      Text(
                                          text = "પાઠ્યપુસ્તકો • સ્પોકન ઇંગ્લિશ • ભારત • વિશ્વ વિજ્ઞાન",
                                          fontSize = 11.sp,
                                          color = Color(0xFFE1F5FE)
                                      )
                                  }
                              }
                          },
                          navigationIcon = {
                              val canGoBack = (selectedTab == 0 && selectedStandard != null) || (selectedTab != 0 && activeFolder != null)
                              if (canGoBack) {
                                  IconButton(onClick = {
                                      if (selectedTab == 0) {
                                          if (selectedChapter != null) selectedChapter = null
                                          else if (selectedSubject != null) selectedSubject = null
                                          else selectedStandard = null
                                      } else {
                                          activeFolder = null
                                      }
                                  }) {
                                      Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White)
                                  }
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF0D276B))
                      )
                  },
                  bottomBar = {
                      NavigationBar(containerColor = Color.White) {
                          NavigationBarItem(
                              selected = selectedTab == 0,
                              onClick = { selectedTab = 0; activeFolder = null },
                              icon = { Icon(Icons.Default.MenuBook, contentDescription = null) },
                              label = { Text("ધોરણ ૧-૧૨", fontSize = 11.sp) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 1,
                              onClick = { selectedTab = 1; activeFolder = null },
                              icon = { Icon(Icons.Default.RecordVoiceOver, contentDescription = null) },
                              label = { Text("સ્પોકન ઇંગ્લિશ", fontSize = 11.sp) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 2,
                              onClick = { selectedTab = 2; activeFolder = null },
                              icon = { Icon(Icons.Default.Flag, contentDescription = null) },
                              label = { Text("ભારત કો જાનો", fontSize = 11.sp) }
                          )
                          NavigationBarItem(
                              selected = selectedTab == 3,
                              onClick = { selectedTab = 3; activeFolder = null },
                              icon = { Icon(Icons.Default.Public, contentDescription = null) },
                              label = { Text("વિશ્વ & વિજ્ઞાન", fontSize = 11.sp) }
                          )
                      }
                  }
              ) { padding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .background(Color(0xFFF4F7FB))
                  ) {
                      when (selectedTab) {
                          0 -> {
                              when {
                                  selectedChapter != null -> ChapterDetailScreen(selectedChapter!!, context)
                                  selectedSubject != null -> SubjectChaptersScreen(selectedSubject!!, onChapterSelect = { selectedChapter = it })
                                  selectedStandard != null -> StandardSubjectsScreen(selectedStandard!!, onSubjectSelect = { selectedSubject = it })
                                  else -> StandardsListScreen(standards, onStandardSelect = { selectedStandard = it })
                              }
                          }
                          1 -> FolderViewScreen(
                              folderList = spokenEnglishFolders,
                              activeFolder = activeFolder,
                              onSelectFolder = { activeFolder = it },
                              headerTitle = "🗣️ સ્પોકન ઇંગ્લિશ ફોલ્ડર્સ (Spoken English)",
                              headerSubtitle = "અંગ્રેજી બોલતા શીખો: વાક્યો, શબ્દો અને ગ્રામર"
                          )
                          2 -> FolderViewScreen(
                              folderList = bharatFolders,
                              activeFolder = activeFolder,
                              onSelectFolder = { activeFolder = it },
                              headerTitle = "🇮🇳 ભારત કો જાનો ફોલ્ડર્સ (Bharat Ko Jano)",
                              headerSubtitle = "ભારતનો ભવ્ય ઇતિહાસ, સંસ્કૃતિ અને રાષ્ટ્રીય પ્રતીકો"
                          )
                          3 -> FolderViewScreen(
                              folderList = worldFolders,
                              activeFolder = activeFolder,
                              onSelectFolder = { activeFolder = it },
                              headerTitle = "🌍 વિશ્વ ઇતિહાસ, ભૂગોળ & વિજ્ઞાન ફોલ્ડર્સ",
                              headerSubtitle = "વિશ્વની અજાયબીઓ, અવકાશ વિજ્ઞાન અને ભૂગોળ"
                          )
                      }
                  }
              }
          }

          @Composable
          fun FolderViewScreen(
              folderList: List<FolderItem>,
              activeFolder: FolderItem?,
              onSelectFolder: (FolderItem) -> Unit,
              headerTitle: String,
              headerSubtitle: String
          ) {
              if (activeFolder == null) {
                  LazyColumn(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                      item {
                          Text(headerTitle, fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color(0xFF0D276B))
                          Text(headerSubtitle, fontSize = 12.sp, color = Color.Gray)
                          Spacer(modifier = Modifier.height(12.dp))
                      }

                      items(folderList) { folder ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 5.dp)
                                  .clickable { onSelectFolder(folder) },
                              colors = CardDefaults.cardColors(containerColor = Color.White),
                              elevation = CardDefaults.cardElevation(2.dp),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Row(
                                  modifier = Modifier.padding(16.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Surface(
                                          shape = RoundedCornerShape(10.dp),
                                          color = Color(0xFFE8EAF6),
                                          modifier = Modifier.size(46.dp)
                                      ) {
                                          Box(contentAlignment = Alignment.Center) {
                                              Text(folder.icon, fontSize = 22.sp)
                                          }
                                      }
                                      Spacer(modifier = Modifier.width(14.dp))
                                      Column {
                                          Text(folder.title, fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color(0xFF1E293B))
                                          Text(folder.subtitle, fontSize = 12.sp, color = Color.Gray)
                                      }
                                  }
                                  Icon(Icons.Default.Folder, contentDescription = null, tint = Color(0xFF0D276B))
                              }
                          }
                      }
                  }
              } else {
                  LazyColumn(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                      item {
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF0D276B)),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Row(modifier = Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Text(activeFolder.icon, fontSize = 26.sp)
                                  Spacer(modifier = Modifier.width(10.dp))
                                  Column {
                                      Text(activeFolder.title, fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color.White)
                                      Text(activeFolder.subtitle, fontSize = 11.sp, color = Color(0xFFBBDEFB))
                                  }
                              }
                          }
                      }

                      items(activeFolder.details) { (itemKey, itemVal) ->
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                              colors = CardDefaults.cardColors(containerColor = Color.White),
                              elevation = CardDefaults.cardElevation(1.dp),
                              shape = RoundedCornerShape(10.dp)
                          ) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Text(itemKey, fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF1565C0))
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Text(itemVal, fontSize = 13.sp, color = Color(0xFF334155), lineHeight = 19.sp)
                              }
                          }
                      }
                  }
              }
          }

