name: Build Aastha Clinic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/aastha/clinic
          mkdir -p gradle/wrapper

          # 1. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AasthaClinic"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aastha.clinic'
              compileSdk 34

              defaultConfig {
                  applicationId "com.aastha.clinic"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Aastha Clinic"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Clinic Brand Logo
          cat << 'EOF' > app/src/main/res/drawable/ic_aastha_brand_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="200dp"
              android:height="200dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M43,38 h14 v26 h-14 z"/>
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M37,44 h26 v14 h-26 z"/>
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M50,14 a5,5 0 1,0 0.1,0 z M41,22 c-3,0 -6,2 -7,5 l4,2 c1,-2 2,-3 3,-3 c2,0 3,1 4,3 l4,-2 c-1,-3 -4,-5 -8,-5 z M59,22 c-4,0 -7,2 -8,5 l4,2 c1,-2 2,-3 4,-3 c1,0 2,1 3,3 l4,-2 c-1,-3 -4,-5 -7,-5 z"/>
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M26,38 C26,54 37,64 50,68 C35,62 30,49 30,38 Z M74,38 C74,54 63,64 50,68 C65,62 70,49 70,38 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_aastha_brand_logo"/>
          </adaptive-icon>
          EOF

          # 6. Main Application Code
          cat << 'EOF' > app/src/main/java/com/aastha/clinic/MainActivity.kt
          package com.aastha.clinic

          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.*

          data class Patient(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val phone: String,
              val village: String,
              val disease: String,
              val medicine: String,
              val date: String
          )

          object CloudSyncManager {
              private const val CLOUD_URL = "https://jsonblob.com/api/jsonBlob/1341050011854495744"

              suspend fun pushToCloud(patients: List<Patient>) {
                  withContext(Dispatchers.IO) {
                      try {
                          val url = URL(CLOUD_URL)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "PUT"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.doOutput = true

                          val jsonArray = JSONArray()
                          patients.forEach { p ->
                              val obj = JSONObject()
                              obj.put("id", p.id)
                              obj.put("name", p.name)
                              obj.put("phone", p.phone)
                              obj.put("village", p.village)
                              obj.put("disease", p.disease)
                              obj.put("medicine", p.medicine)
                              obj.put("date", p.date)
                              jsonArray.put(obj)
                          }

                          val wr = OutputStreamWriter(conn.outputStream)
                          wr.write(jsonArray.toString())
                          wr.flush()
                          conn.responseCode
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              suspend fun fetchFromCloud(): List<Patient>? {
                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL(CLOUD_URL)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "GET"
                          conn.setRequestProperty("Accept", "application/json")

                          if (conn.responseCode == 200) {
                              val reader = BufferedReader(InputStreamReader(conn.inputStream))
                              val response = reader.readText()
                              val jsonArray = JSONArray(response)
                              val list = mutableListOf<Patient>()
                              for (i in 0 until jsonArray.length()) {
                                  val obj = jsonArray.getJSONObject(i)
                                  list.add(
                                      Patient(
                                          id = obj.optString("id"),
                                          name = obj.optString("name"),
                                          phone = obj.optString("phone"),
                                          village = obj.optString("village"),
                                          disease = obj.optString("disease"),
                                          medicine = obj.optString("medicine"),
                                          date = obj.optString("date")
                                      )
                                  )
                              }
                              list
                          } else {
                              null
                          }
                      } catch (e: Exception) {
                          null
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      AasthaClinicApp()
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun AasthaClinicApp() {
              val context = LocalContext.current
              val coroutineScope = rememberCoroutineScope()
              val patientList = remember { mutableStateListOf<Patient>() }

              var searchQuery by remember { mutableStateOf("") }
              var patientName by remember { mutableStateOf("") }
              var villageName by remember { mutableStateOf("") }
              var mobileNumber by remember { mutableStateOf("") }
              var diseaseText by remember { mutableStateOf("") }
              var medicineText by remember { mutableStateOf("") }
              var historyList by remember { mutableStateOf<List<Patient>>(emptyList()) }
              var isSaving by remember { mutableStateOf(false) }

              LaunchedEffect(Unit) {
                  coroutineScope.launch {
                      val cloudData = CloudSyncManager.fetchFromCloud()
                      if (!cloudData.isNullOrEmpty()) {
                          patientList.clear()
                          patientList.addAll(cloudData)
                      }
                  }
              }

              fun onSearchChange(text: String) {
                  searchQuery = text
                  if (text.trim().length >= 2) {
                      val matches = patientList.filter {
                          it.name.contains(text, ignoreCase = true) || it.phone.contains(text)
                      }
                      historyList = matches
                      if (matches.isNotEmpty()) {
                          val last = matches.last()
                          patientName = last.name
                          villageName = last.village
                          mobileNumber = last.phone
                      }
                  } else {
                      historyList = emptyList()
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = { Text("Aastha Clinic - દર્દી રેકોર્ડ", fontWeight = FontWeight.Bold, color = Color.White) },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF0D276B))
                      )
                  }
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .background(Color(0xFFF4F6F9))
                          .verticalScroll(rememberScrollState())
                          .padding(16.dp)
                  ) {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFE3F2FD)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Text("🔍 જૂના દર્દી શોધો (નામ અથવા મોબાઈલ):", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = Color(0xFF0D276B))
                              Spacer(modifier = Modifier.height(6.dp))
                              OutlinedTextField(
                                  value = searchQuery,
                                  onValueChange = { onSearchChange(it) },
                                  placeholder = { Text("દા.ત. Raju Pandit અથવા 9898...") },
                                  modifier = Modifier.fillMaxWidth(),
                                  singleLine = true,
                                  colors = OutlinedTextFieldDefaults.colors(focusedContainerColor = Color.White, unfocusedContainerColor = Color.White)
                              )
                          }
                      }

                      Spacer(modifier = Modifier.height(16.dp))

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(12.dp),
                          elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("દર્દીની નવી એન્ટ્રી", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF0D276B))
                              Spacer(modifier = Modifier.height(12.dp))

                              OutlinedTextField(value = patientName, onValueChange = { patientName = it }, label = { Text("દર્દીનું પૂરું નામ") }, modifier = Modifier.fillMaxWidth())
                              Spacer(modifier = Modifier.height(8.dp))

                              OutlinedTextField(value = villageName, onValueChange = { villageName = it }, label = { Text("ગામ / શહેર") }, modifier = Modifier.fillMaxWidth())
                              Spacer(modifier = Modifier.height(8.dp))

                              OutlinedTextField(value = mobileNumber, onValueChange = { mobileNumber = it }, label = { Text("મોબાઈલ નંબર") }, modifier = Modifier.fillMaxWidth())
                              Spacer(modifier = Modifier.height(8.dp))

                              OutlinedTextField(value = diseaseText, onValueChange = { diseaseText = it }, label = { Text("શેના માટે દવા લીધી (તકલીફ / રોગ)") }, modifier = Modifier.fillMaxWidth())
                              Spacer(modifier = Modifier.height(8.dp))

                              OutlinedTextField(value = medicineText, onValueChange = { medicineText = it }, label = { Text("આપેલી દવાઓની વિગત") }, modifier = Modifier.fillMaxWidth())
                              Spacer(modifier = Modifier.height(16.dp))

                              Button(
                                  onClick = {
                                      if (patientName.isBlank() || mobileNumber.isBlank()) {
                                          Toast.makeText(context, "નામ અને મોબાઈલ નંબર જરૂરી છે", Toast.LENGTH_SHORT).show()
                                          return@Button
                                      }
                                      isSaving = true
                                      val sdf = SimpleDateFormat("dd-MM-yyyy hh:mm a", Locale.getDefault())
                                      val newRecord = Patient(
                                          name = patientName.trim(),
                                          phone = mobileNumber.trim(),
                                          village = villageName.trim(),
                                          disease = diseaseText.trim(),
                                          medicine = medicineText.trim(),
                                          date = sdf.format(Date())
                                      )
                                      patientList.add(newRecord)
                                      coroutineScope.launch {
                                          CloudSyncManager.pushToCloud(patientList)
                                          isSaving = false
                                          Toast.makeText(context, "ડેટા સેવ અને સિંક થઈ ગયો!", Toast.LENGTH_SHORT).show()
                                          diseaseText = ""
                                          medicineText = ""
                                      }
                                  },
                                  modifier = Modifier.fillMaxWidth().height(48.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B)),
                                  enabled = !isSaving
                              ) {
                                  Text(if (isSaving) "સેવ થઈ રહ્યું છે..." else "ડેટા સેવ કરો (Save Visit)", fontWeight = FontWeight.Bold)
                              }
                          }
                      }

                      if (historyList.isNotEmpty()) {
                          Spacer(modifier = Modifier.height(18.dp))
                          Text("📋 અગાઉની હિસ્ટ્રી (${historyList.size}):", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF0D276B))
                          Spacer(modifier = Modifier.height(8.dp))

                          historyList.reversed().forEach { item ->
                              Card(
                                  modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                                  colors = CardDefaults.cardColors(containerColor = Color(0xFFF8FAFC)),
                                  shape = RoundedCornerShape(8.dp)
                              ) {
                                  Column(modifier = Modifier.padding(12.dp)) {
                                      Text("📅 તારીખ: ${item.date}", fontSize = 12.sp, color = Color(0xFF0284C7), fontWeight = FontWeight.Bold)
                                      Spacer(modifier = Modifier.height(4.dp))
                                      Text("🩺 રોગ/તકલીફ: ${item.disease}", fontSize = 13.sp, fontWeight = FontWeight.Medium, color = Color(0xFF1E293B))
                                      Text("💊 દવા: ${item.medicine}", fontSize = 13.sp, color = Color(0xFF475569))
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aastha-Clinic-Pro-Executive-App
          path: app/build/outputs/apk/**/*.apk
