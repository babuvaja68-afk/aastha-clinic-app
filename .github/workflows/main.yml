name: Build Aastha Clinic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Android Clean Java Project
        run: |
          rm -rf app gradle settings.gradle build.gradle gradlew gradlew.bat
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/aastha/clinic

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AasthaClinic"
          include ':app'
          EOF

          # 2. build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aastha.clinic'
              compileSdk 34

              defaultConfig {
                  applicationId "com.aastha.clinic"
                  minSdk 24
                  targetSdk 34
                  versionCode 6
                  versionName "6.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Aastha Clinic"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AasthaClinic">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Resources & Styles
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="primary">#0D276B</color>
              <color name="primary_dark">#081842</color>
              <color name="accent">#D32F2F</color>
              <color name="bg_gray">#F4F6F9</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AasthaClinic" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryDark">@color/primary_dark</item>
                  <item name="colorAccent">@color/accent</item>
                  <item name="android:windowBackground">@color/bg_gray</item>
              </style>
          </resources>
          EOF

          # 6. Clinic Brand Logo Vector
          cat << 'EOF' > app/src/main/res/drawable/ic_aastha_brand_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="200dp"
              android:height="200dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M43,38 h14 v26 h-14 z"/>
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M37,44 h26 v14 h-26 z"/>
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M50,14 a5,5 0 1,0 0.1,0 z M41,22 c-3,0 -6,2 -7,5 l4,2 c1,-2 2,-3 3,-3 c2,0 3,1 4,3 l4,-2 c-1,-3 -4,-5 -8,-5 z M59,22 c-4,0 -7,2 -8,5 l4,2 c1,-2 2,-3 4,-3 c1,0 2,1 3,3 l4,-2 c-1,-3 -4,-5 -7,-5 z"/>
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M26,38 C26,54 37,64 50,68 C35,62 30,49 30,38 Z M74,38 C74,54 63,64 50,68 C65,62 70,49 70,38 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_aastha_brand_logo"/>
          </adaptive-icon>
          EOF

          # 7. Layout XML
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F4F6F9">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:padding="8dp">
                      <ImageView
                          android:layout_width="45dp"
                          android:layout_height="45dp"
                          android:src="@drawable/ic_aastha_brand_logo"/>
                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:layout_marginStart="12dp">
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Aastha Clinic"
                              android:textSize="20sp"
                              android:textStyle="bold"
                              android:textColor="#0D276B"/>
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="દર્દી રજીસ્ટ્રેશન &amp; રેકોર્ડ"
                              android:textSize="12sp"
                              android:textColor="#546E7A"/>
                      </LinearLayout>
                      <Button
                          android:id="@+id/btnSync"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Sync"
                          android:textSize="12sp"
                          android:backgroundTint="#0D276B"/>
                  </LinearLayout>

                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardCornerRadius="10dp"
                      app:cardElevation="2dp"
                      app:cardBackgroundColor="#E3F2FD"
                      android:layout_marginTop="12dp">
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="12dp">
                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="🔍 જૂના દર્દી શોધો (નામ અથવા નંબર):"
                              android:textStyle="bold"
                              android:textColor="#0D276B"/>
                          <EditText
                              android:id="@+id/etSearch"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="દા.ત. Raju Pandit અથવા 9898..."
                              android:background="@android:drawable/editbox_background_normal"
                              android:padding="10dp"
                              android:layout_marginTop="6dp"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardCornerRadius="10dp"
                      app:cardElevation="3dp"
                      app:cardBackgroundColor="#FFFFFF"
                      android:layout_marginTop="16dp">
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="16dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="દર્દીની વિગત ઉમેરો"
                              android:textStyle="bold"
                              android:textSize="16sp"
                              android:textColor="#0D276B"/>

                          <EditText
                              android:id="@+id/etName"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="દર્દીનું પૂરું નામ"
                              android:layout_marginTop="10dp"/>

                          <EditText
                              android:id="@+id/etVillage"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="ગામ / શહેર"
                              android:layout_marginTop="8dp"/>

                          <EditText
                              android:id="@+id/etMobile"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="મોબાઈલ નંબર"
                              android:inputType="phone"
                              android:layout_marginTop="8dp"/>

                          <EditText
                              android:id="@+id/etDisease"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="શેના માટે દવા લીધી (તકલીફ / રોગ)"
                              android:layout_marginTop="8dp"/>

                          <EditText
                              android:id="@+id/etMedicine"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:hint="આપેલી દવાઓની વિગત"
                              android:layout_marginTop="8dp"/>

                          <Button
                              android:id="@+id/btnSave"
                              android:layout_width="match_parent"
                              android:layout_height="50dp"
                              android:text="ડેટા સેવ કરો (Save Visit)"
                              android:backgroundTint="#0D276B"
                              android:textColor="#FFFFFF"
                              android:textStyle="bold"
                              android:layout_marginTop="16dp"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <TextView
                      android:id="@+id/tvHistoryHeader"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📋 અગાઉની હિસ્ટ્રી:"
                      android:textStyle="bold"
                      android:textColor="#0D276B"
                      android:layout_marginTop="20dp"
                      android:visibility="gone"/>

                  <LinearLayout
                      android:id="@+id/historyContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:layout_marginTop="8dp"/>

              </LinearLayout>
          </ScrollView>
          EOF

          # 8. Java Main Activity Logic (Rock-Solid & Pure Java)
          cat << 'EOF' > app/src/main/java/com/aastha/clinic/MainActivity.java
          package com.aastha.clinic;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.cardview.widget.CardView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStreamWriter;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends AppCompatActivity {

              public static class PatientRecord {
                  public String name;
                  public String phone;
                  public String village;
                  public String disease;
                  public String medicine;
                  public String date;

                  public PatientRecord(String name, String phone, String village, String disease, String medicine, String date) {
                      this.name = name;
                      this.phone = phone;
                      this.village = village;
                      this.disease = disease;
                      this.medicine = medicine;
                      this.date = date;
                  }
              }

              private final String cloudUrl = "https://jsonblob.com/api/jsonBlob/1341050011854495744";
              private final List<PatientRecord> patientList = new ArrayList<>();
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              private EditText etSearch, etName, etVillage, etMobile, etDisease, etMedicine;
              private Button btnSave, btnSync;
              private TextView tvHistoryHeader;
              private LinearLayout historyContainer;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  etSearch = findViewById(R.id.etSearch);
                  etName = findViewById(R.id.etName);
                  etVillage = findViewById(R.id.etVillage);
                  etMobile = findViewById(R.id.etMobile);
                  etDisease = findViewById(R.id.etDisease);
                  etMedicine = findViewById(R.id.etMedicine);
                  btnSave = findViewById(R.id.btnSave);
                  btnSync = findViewById(R.id.btnSync);
                  tvHistoryHeader = findViewById(R.id.tvHistoryHeader);
                  historyContainer = findViewById(R.id.historyContainer);

                  fetchCloudData();

                  btnSync.setOnClickListener(v -> {
                      fetchCloudData();
                      Toast.makeText(MainActivity.this, "સિંક થઈ રહ્યું છે...", Toast.LENGTH_SHORT).show();
                  });

                  etSearch.addTextChangedListener(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          filterAndAutofill(s.toString().trim());
                      }
                      @Override
                      public void afterTextChanged(Editable s) {}
                  });

                  btnSave.setOnClickListener(v -> savePatientData());
              }

              private void fetchCloudData() {
                  executor.execute(() -> {
                      try {
                          URL url = new URL(cloudUrl);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          if (conn.getResponseCode() == 200) {
                              BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                              StringBuilder response = new StringBuilder();
                              String line;
                              while ((line = reader.readLine()) != null) {
                                  response.append(line);
                              }
                              reader.close();

                              JSONArray jsonArray = new JSONArray(response.toString());
                              final List<PatientRecord> fetchedList = new ArrayList<>();
                              for (int i = 0; i < jsonArray.length(); i++) {
                                  JSONObject obj = jsonArray.getJSONObject(i);
                                  fetchedList.add(new PatientRecord(
                                          obj.optString("name"),
                                          obj.optString("phone"),
                                          obj.optString("village"),
                                          obj.optString("disease"),
                                          obj.optString("medicine"),
                                          obj.optString("date")
                                  ));
                              }

                              mainHandler.post(() -> {
                                  patientList.clear();
                                  patientList.addAll(fetchedList);
                              });
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  });
              }

              private void filterAndAutofill(String query) {
                  historyContainer.removeAllViews();
                  if (query.length() < 2) {
                      tvHistoryHeader.setVisibility(View.GONE);
                      return;
                  }

                  List<PatientRecord> matches = new ArrayList<>();
                  for (PatientRecord p : patientList) {
                      if (p.name.toLowerCase().contains(query.toLowerCase()) || p.phone.contains(query)) {
                          matches.add(p);
                      }
                  }

                  if (!matches.isEmpty()) {
                      PatientRecord latest = matches.get(matches.size() - 1);
                      etName.setText(latest.name);
                      etVillage.setText(latest.village);
                      etMobile.setText(latest.phone);

                      tvHistoryHeader.setVisibility(View.VISIBLE);
                      for (int i = matches.size() - 1; i >= 0; i--) {
                          PatientRecord item = matches.get(i);
                          CardView card = new CardView(this);
                          card.setRadius(16f);
                          card.setCardBackgroundColor(0xFFF8FAFC);
                          card.setContentPadding(24, 24, 24, 24);

                          LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );
                          params.setMargins(0, 0, 0, 16);
                          card.setLayoutParams(params);

                          TextView text = new TextView(this);
                          text.setText("📅 " + item.date + "\n🩺 રોગ: " + item.disease + "\n💊 દવા: " + item.medicine);
                          text.setTextColor(0xFF1E293B);
                          text.setTextSize(14f);

                          card.addView(text);
                          historyContainer.addView(card);
                      }
                  } else {
                      tvHistoryHeader.setVisibility(View.GONE);
                  }
              }

              private void savePatientData() {
                  String name = etName.getText().toString().trim();
                  String village = etVillage.getText().toString().trim();
                  String mobile = etMobile.getText().toString().trim();
                  String disease = etDisease.getText().toString().trim();
                  String medicine = etMedicine.getText().toString().trim();

                  if (name.isEmpty() || mobile.isEmpty()) {
                      Toast.makeText(this, "નામ અને મોબાઈલ નંબર જરૂરી છે", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  btnSave.setEnabled(false);
                  SimpleDateFormat sdf = new SimpleDateFormat("dd-MM-yyyy hh:mm a", Locale.getDefault());
                  PatientRecord record = new PatientRecord(name, mobile, village, disease, medicine, sdf.format(new Date()));
                  patientList.add(record);

                  executor.execute(() -> {
                      try {
                          URL url = new URL(cloudUrl);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("PUT");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setDoOutput(true);

                          JSONArray array = new JSONArray();
                          for (PatientRecord p : patientList) {
                              JSONObject obj = new JSONObject();
                              obj.put("name", p.name);
                              obj.put("phone", p.phone);
                              obj.put("village", p.village);
                              obj.put("disease", p.disease);
                              obj.put("medicine", p.medicine);
                              obj.put("date", p.date);
                              array.put(obj);
                          }

                          OutputStreamWriter wr = new OutputStreamWriter(conn.getOutputStream());
                          wr.write(array.toString());
                          wr.flush();
                          wr.close();
                          conn.getResponseCode();

                          mainHandler.post(() -> {
                              Toast.makeText(MainActivity.this, "ડેટા સેવ થઈ ગયો!", Toast.LENGTH_SHORT).show();
                              etDisease.setText("");
                              etMedicine.setText("");
                              btnSave.setEnabled(true);
                          });
                      } catch (Exception e) {
                          mainHandler.post(() -> {
                              Toast.makeText(MainActivity.this, "સેવ કરવામાં ભૂલ આવી", Toast.LENGTH_SHORT).show();
                              btnSave.setEnabled(true);
                          });
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
          EOF

      - name: Build Android APK with Gradle
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aastha-Clinic-App
          path: app/build/outputs/apk/debug/*.apk
