                      MetricCard(title = "${tr("total_patients", lang)} (આજે)", value = "$totalPatients", color = Color(0xFF0288D1), modifier = Modifier.weight(1f).padding(end = 4.dp))
                      MetricCard(title = tr("pending_patients", lang), value = "$pendingCount", color = Color(0xFF16A34A), modifier = Modifier.weight(1f).padding(start = 4.dp))
