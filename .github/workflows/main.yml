name: Build Ludo Star Club APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Project Files
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/ludo/starclub
          mkdir -p gradle/wrapper

          # 1. Gradle Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "LudoStarClub"
          include ':app'
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ludo.starclub'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ludo.starclub"
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName "7.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Ludo Star Club"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Icons
          cat << 'EOF' > app/src/main/res/drawable/ic_ludo_pro_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B132B" android:pathData="M54,6 C78,6 98,18 98,44 C98,74 54,102 54,102 C54,102 10,74 10,44 C10,18 30,6 54,6 Z"/>
              <path android:strokeColor="#FFC107" android:strokeWidth="2.5" android:pathData="M54,8 C76,8 95,20 95,44 C95,72 54,98 54,98 C54,98 13,72 13,44 C13,20 32,8 54,8 Z"/>
              <path android:fillColor="#E53935" android:pathData="M54,20 C38,20 24,32 24,50 L54,50 Z"/>
              <path android:fillColor="#43A047" android:pathData="M54,20 C70,20 84,32 84,50 L54,50 Z"/>
              <path android:fillColor="#1E88E5" android:pathData="M24,50 C24,68 38,80 54,80 L54,50 Z"/>
              <path android:fillColor="#FDD835" android:pathData="M84,50 C84,68 70,80 54,80 L54,50 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M38,36 h32 v32 h-32 z"/>
              <path android:fillColor="#E53935" android:pathData="M54,52 m-3,0 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0"/>
              <path android:fillColor="#FFD54F" android:pathData="M40,18 L46,26 L54,16 L62,26 L68,18 L66,28 L42,28 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B132B" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_ludo_pro_logo"/>
          </adaptive-icon>
          EOF

          # 7. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/ludo/starclub/MainActivity.kt
          package com.ludo.starclub

          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.rotate
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import kotlin.math.sin
          import kotlin.random.Random

          enum class PlayerColor(val label: String, val primary: Color, val dark: Color, val light: Color) {
              RED("લાલ (Red)", Color(0xFFE53935), Color(0xFFB71C1C), Color(0xFFFFCDD2)),
              GREEN("લીલો (Green)", Color(0xFF43A047), Color(0xFF1B5E20), Color(0xFFC8E6C9)),
              YELLOW("પીળો (Yellow)", Color(0xFFFDD835), Color(0xFFF57F17), Color(0xFFFFF9C4)),
              BLUE("વાદળી (Blue)", Color(0xFF1E88E5), Color(0xFF0D47A1), Color(0xFFBBDEFB))
          }

          data class GameState(
              val roomCode: String = "",
              val turn: PlayerColor = PlayerColor.RED,
              val diceValue: Int = 1,
              val isRolled: Boolean = false,
              val message: String = "ડાઈસ રોલ કરો!",
              val activeEmoji: String = "",
              val activeComment: String = "",
              val lastKilledPlayer: String = ""
          )

          object FunnySoundEngine {
              fun playGotiKilledSound() {
                  Thread {
                      try {
                          val sampleRate = 44100
                          val notes = doubleArrayOf(466.16, 440.0, 415.30, 311.13)
                          val durations = doubleArrayOf(0.28, 0.28, 0.28, 0.75)
                          var totalTime = 0.0
                          for (d in durations) { totalTime += d }
                          val totalSamples = (sampleRate * totalTime).toInt()
                          val buffer = ShortArray(totalSamples)
                          var offset = 0
                          for (i in notes.indices) {
                              val freq = notes[i]
                              val numSamples = (sampleRate * durations[i]).toInt()
                              for (j in 0 until numSamples) {
                                  val angle = 2.0 * Math.PI * j / (sampleRate / freq)
                                  val sampleVal = (sin(angle) * (1.0 - (j.toDouble() / numSamples) * 0.4) * Short.MAX_VALUE * 0.7).toInt().toShort()
                                  buffer[offset + j] = sampleVal
                              }
                              offset += numSamples
                          }
                          val track = AudioTrack.Builder()
                              .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_GAME).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                              .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sampleRate).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                              .setBufferSizeInBytes(buffer.size * 2)
                              .setTransferMode(AudioTrack.MODE_STATIC)
                              .build()
                          track.write(buffer, 0, buffer.size)
                          track.play()
                      } catch (e: Exception) {}
                  }.start()
              }

              fun playDiceRollSound() {
                  Thread {
                      try {
                          val sampleRate = 22050
                          val numSamples = (sampleRate * 0.12).toInt()
                          val buffer = ShortArray(numSamples)
                          for (i in 0 until numSamples) {
                              buffer[i] = (Random.nextDouble(-0.5, 0.5) * Short.MAX_VALUE * 0.4).toInt().toShort()
                          }
                          val track = AudioTrack.Builder()
                              .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_GAME).build())
                              .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sampleRate).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                              .setBufferSizeInBytes(buffer.size * 2)
                              .setTransferMode(AudioTrack.MODE_STATIC)
                              .build()
                          track.write(buffer, 0, buffer.size)
                          track.play()
                      } catch (e: Exception) {}
                  }.start()
              }
          }

          object LudoOnlineEngine {
              private const val BASE_URL = "https://jsonblob.com/api/jsonBlob"

              suspend fun createRoom(roomCode: String, initialGame: GameState): String? {
                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL(BASE_URL)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.doOutput = true

                          val json = JSONObject()
                          json.put("roomCode", roomCode)
                          json.put("turn", initialGame.turn.name)
                          json.put("diceValue", initialGame.diceValue)
                          json.put("message", initialGame.message)
                          json.put("activeEmoji", initialGame.activeEmoji)
                          json.put("activeComment", initialGame.activeComment)
                          json.put("lastKilledPlayer", initialGame.lastKilledPlayer)

                          val wr = OutputStreamWriter(conn.outputStream)
                          wr.write(json.toString())
                          wr.flush()
                          conn.getHeaderField("Location")
                      } catch (e: Exception) { null }
                  }
              }

              suspend fun syncGame(blobUrl: String, game: GameState): Boolean {
                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL(blobUrl)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "PUT"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.doOutput = true

                          val json = JSONObject()
                          json.put("roomCode", game.roomCode)
                          json.put("turn", game.turn.name)
                          json.put("diceValue", game.diceValue)
                          json.put("message", game.message)
                          json.put("activeEmoji", game.activeEmoji)
                          json.put("activeComment", game.activeComment)
                          json.put("lastKilledPlayer", game.lastKilledPlayer)

                          val wr = OutputStreamWriter(conn.outputStream)
                          wr.write(json.toString())
                          wr.flush()
                          conn.responseCode == 200
                      } catch (e: Exception) { false }
                  }
              }

              suspend fun fetchGame(blobUrl: String): GameState? {
                  return withContext(Dispatchers.IO) {
                      try {
                          val url = URL(blobUrl)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "GET"
                          conn.setRequestProperty("Accept", "application/json")

                          if (conn.responseCode == 200) {
                              val reader = BufferedReader(InputStreamReader(conn.inputStream))
                              val json = JSONObject(reader.readText())
                              GameState(
                                  roomCode = json.optString("roomCode"),
                                  turn = PlayerColor.valueOf(json.optString("turn", "RED")),
                                  diceValue = json.optInt("diceValue", 1),
                                  message = json.optString("message", ""),
                                  activeEmoji = json.optString("activeEmoji", ""),
                                  activeComment = json.optString("activeComment", ""),
                                  lastKilledPlayer = json.optString("lastKilledPlayer", "")
                              )
                          } else null
                      } catch (e: Exception) { null }
                  }
              }
          }

          fun shareOnWhatsApp(context: Context, roomCode: String) {
              val msg = "🎲 *LUDO STAR CLUB* 🎲\nમારી સાથે લુડો રમો! રૂમ કોડ: *$roomCode*"
              try {
                  val intent = Intent(Intent.ACTION_VIEW)
                  intent.data = Uri.parse("https://api.whatsapp.com/send?text=" + URLEncoder.encode(msg, "UTF-8"))
                  context.startActivity(intent)
              } catch (e: Exception) {
                  Toast.makeText(context, "WhatsApp open નથી થયું", Toast.LENGTH_SHORT).show()
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      LudoApp()
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun LudoApp() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()

              var screenMode by remember { mutableStateOf(0) }
              var roomCodeInput by remember { mutableStateOf("") }
              var activeBlobUrl by remember { mutableStateOf("") }
              var generatedRoomCode by remember { mutableStateOf("") }

              var gameState by remember { mutableStateOf(GameState()) }
              var isRolling by remember { mutableStateOf(false) }

              val funnyEmojis = listOf("😂", "🤪", "😭", "🔪", "💀", "💩", "🤡", "🔥", "😎", "🤦‍♂️")
              val funnyComments = listOf(
                  "ગોટી ગઈ ભાઈ! ખતમ! 💀",
                  "હાહાહા.. ગઈ તારી ગોટી! 😂",
                  "ભાઈ થોડી દયા રાખ! 😭",
                  "જલ્દી ચાલ, ઊંઘ આવે છે! 😴",
                  "૬ (Six) લાવો કોઈ! 🎲",
                  "આ વખતે તો બદલો લઈશ જ! 🔪"
              )

              val diceRotation by animateFloatAsState(
                  targetValue = if (isRolling) 720f else 0f,
                  animationSpec = tween(durationMillis = 350, easing = LinearOutSlowInEasing),
                  label = "3dDiceRotation"
              )

              val pulseScale by rememberInfiniteTransition(label = "pulse").animateFloat(
                  initialValue = 1f,
                  targetValue = 1.15f,
                  animationSpec = infiniteRepeatable(animation = tween(600), repeatMode = RepeatMode.Reverse),
                  label = "scale"
              )

              LaunchedEffect(activeBlobUrl) {
                  if (activeBlobUrl.isNotBlank() && screenMode == 3) {
                      while (true) {
                          val remote = LudoOnlineEngine.fetchGame(activeBlobUrl)
                          if (remote != null) {
                              if (remote.lastKilledPlayer.isNotBlank() && remote.lastKilledPlayer != gameState.lastKilledPlayer) {
                                  FunnySoundEngine.playGotiKilledSound()
                              }
                              gameState = gameState.copy(
                                  turn = remote.turn,
                                  diceValue = remote.diceValue,
                                  message = remote.message,
                                  activeEmoji = remote.activeEmoji,
                                  activeComment = remote.activeComment,
                                  lastKilledPlayer = remote.lastKilledPlayer
                              )
                          }
                          delay(2000)
                      }
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Image(
                                      painter = painterResource(id = R.drawable.ic_ludo_pro_logo),
                                      contentDescription = "Logo",
                                      modifier = Modifier.size(38.dp)
                                  )
                                  Spacer(modifier = Modifier.width(10.dp))
                                  Column {
                                      Text("LUDO STAR CLUB", fontWeight = FontWeight.Black, fontSize = 18.sp, color = Color(0xFFFFD54F))
                                      Text("Multiplayer & WhatsApp Online", fontSize = 11.sp, color = Color(0xFFE2E8F0))
                                  }
                              }
                          },
                          navigationIcon = {
                              if (screenMode != 0) {
                                  IconButton(onClick = { screenMode = 0 }) {
                                      Icon(Icons.Default.ArrowBack, contentDescription = "Home", tint = Color.White)
                                  }
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF0F172A))
                      )
                  }
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                          .background(Brush.verticalGradient(listOf(Color(0xFF0F172A), Color(0xFF020617))))
                  ) {
                      when (screenMode) {
                          0 -> LudoHomeScreen(
                              onPlayOffline = { gameState = GameState(); screenMode = 1 },
                              onPlayOnline = { screenMode = 2 }
                          )
                          1 -> LudoBoardScreen(
                              gameState = gameState,
                              isOnline = false,
                              diceRotation = diceRotation,
                              pulseScale = pulseScale,
                              funnyEmojis = funnyEmojis,
                              funnyComments = funnyComments,
                              onSendEmoji = { emoji ->
                                  gameState = gameState.copy(activeEmoji = emoji, activeComment = "")
                                  scope.launch {
                                      delay(3000)
                                      if (gameState.activeEmoji == emoji) gameState = gameState.copy(activeEmoji = "")
                                  }
                              },
                              onSendComment = { comment ->
                                  gameState = gameState.copy(activeComment = comment, activeEmoji = "")
                                  scope.launch {
                                      delay(3500)
                                      if (gameState.activeComment == comment) gameState = gameState.copy(activeComment = "")
                                  }
                              },
                              onSimulateKill = { victimColor ->
                                  FunnySoundEngine.playGotiKilledSound()
                                  val alertMsg = "ખતમ! ${victimColor.label} ની ગોટી કપાઈ ગઈ! 😭"
                                  gameState = gameState.copy(lastKilledPlayer = victimColor.name, message = alertMsg)
                                  scope.launch {
                                      delay(4000)
                                      if (gameState.lastKilledPlayer == victimColor.name) gameState = gameState.copy(lastKilledPlayer = "")
                                  }
                              },
                              onRollDice = {
                                  scope.launch {
                                      FunnySoundEngine.playDiceRollSound()
                                      isRolling = true
                                      delay(350)
                                      val rolled = Random.nextInt(1, 7)
                                      isRolling = false
                                      val willKill = (rolled == 6 && Random.nextBoolean())
                                      val nextTurn = when (gameState.turn) {
                                          PlayerColor.RED -> if (rolled == 6) PlayerColor.RED else PlayerColor.GREEN
                                          PlayerColor.GREEN -> if (rolled == 6) PlayerColor.GREEN else PlayerColor.YELLOW
                                          PlayerColor.YELLOW -> if (rolled == 6) PlayerColor.YELLOW else PlayerColor.BLUE
                                          PlayerColor.BLUE -> if (rolled == 6) PlayerColor.BLUE else PlayerColor.RED
                                      }

                                      if (willKill) {
                                          FunnySoundEngine.playGotiKilledSound()
                                          val victim = when (gameState.turn) {
                                              PlayerColor.RED -> PlayerColor.GREEN
                                              PlayerColor.GREEN -> PlayerColor.YELLOW
                                              PlayerColor.YELLOW -> PlayerColor.BLUE
                                              PlayerColor.BLUE -> PlayerColor.RED
                                          }
                                          gameState = gameState.copy(
                                              diceValue = rolled,
                                              turn = nextTurn,
                                              lastKilledPlayer = victim.name,
                                              message = "ખતમ! ${gameState.turn.label} એ ${victim.label} ની ગોટી કાપી! 🔪😂"
                                          )
                                          scope.launch {
                                              delay(4000)
                                              if (gameState.lastKilledPlayer == victim.name) gameState = gameState.copy(lastKilledPlayer = "")
                                          }
                                      } else {
                                          gameState = gameState.copy(
                                              diceValue = rolled,
                                              turn = nextTurn,
                                              message = "${gameState.turn.label} -> $rolled!"
                                          )
                                      }
                                  }
                              }
                          )
                          2 -> LudoOnlineSetupScreen(
                              roomCodeInput = roomCodeInput,
                              onRoomCodeChange = { roomCodeInput = it },
                              onCreateRoom = {
                                  scope.launch {
                                      val code = (100000..999999).random().toString()
                                      generatedRoomCode = code
                                      val initial = GameState(roomCode = code, message = "રૂમ તૈયાર છે! WhatsApp પર મિત્રને બોલાવો.")
                                      val blob = LudoOnlineEngine.createRoom(code, initial)
                                      if (blob != null) {
                                          activeBlobUrl = blob
                                          gameState = initial
                                          shareOnWhatsApp(context, code)
                                          screenMode = 3
                                      }
                                  }
                              },
                              onJoinRoom = {
                                  if (roomCodeInput.isNotBlank()) {
                                      activeBlobUrl = "https://jsonblob.com/api/jsonBlob/1341050011854495744"
                                      gameState = GameState(roomCode = roomCodeInput, message = "રૂમમાં જોડાયા!")
                                      screenMode = 3
                                  }
                              }
                          )
                          3 -> LudoBoardScreen(
                              gameState = gameState,
                              isOnline = true,
                              diceRotation = diceRotation,
                              pulseScale = pulseScale,
                              funnyEmojis = funnyEmojis,
                              funnyComments = funnyComments,
                              onSendEmoji = { emoji ->
                                  val updated = gameState.copy(activeEmoji = emoji, activeComment = "")
                                  gameState = updated
                                  scope.launch {
                                      if (activeBlobUrl.isNotBlank()) LudoOnlineEngine.syncGame(activeBlobUrl, updated)
                                      delay(3000)
                                      if (gameState.activeEmoji == emoji) {
                                          gameState = gameState.copy(activeEmoji = "")
                                          if (activeBlobUrl.isNotBlank()) LudoOnlineEngine.syncGame(activeBlobUrl, gameState)
                                      }
                                  }
                              },
                              onSendComment = { comment ->
                                  val updated = gameState.copy(activeComment = comment, activeEmoji = "")
                                  gameState = updated
                                  scope.launch {
                                      if (activeBlobUrl.isNotBlank()) LudoOnlineEngine.syncGame(activeBlobUrl, updated)
                                      delay(3500)
                                      if (gameState.activeComment == comment) {
                                          gameState = gameState.copy(activeComment = "")
                                          if (activeBlobUrl.isNotBlank()) LudoOnlineEngine.syncGame(activeBlobUrl, gameState)
                                      }
                                  }
                              },
                              onSimulateKill = { victimColor ->
                                  FunnySoundEngine.playGotiKilledSound()
                                  val alertMsg = "ખતમ! ${victimColor.label} ની ગોટી કપાઈ ગઈ! 😭"
                                  val updated = gameState.copy(lastKilledPlayer = victimColor.name, message = alertMsg)
                                  gameState = updated
                                  scope.launch {
                                      if (activeBlobUrl.isNotBlank()) LudoOnlineEngine.syncGame(activeBlobUrl, updated)
                                      delay(4000)
                                      if (gameState.lastKilledPlayer == victimColor.name) {
                                          gameState = gameState.copy(lastKilledPlayer = "")
                                          if (activeBlobUrl.isNotBlank()) LudoOnlineEngine.syncGame(activeBlobUrl, gameState)
                                      }
                                  }
                              },
                              onRollDice = {
                                  scope.launch {
                                      FunnySoundEngine.playDiceRollSound()
                                      isRolling = true
                                      delay(350)
                                      val rolled = Random.nextInt(1, 7)
                                      isRolling = false
                                      val willKill = (rolled == 6 && Random.nextBoolean())
                                      val nextTurn = if (gameState.turn == PlayerColor.RED) {
                                          if (rolled == 6) PlayerColor.RED else PlayerColor.GREEN
                                      } else {
                                          if (rolled == 6) PlayerColor.GREEN else PlayerColor.RED
                                      }

                                      val updated = if (willKill) {
                                          FunnySoundEngine.playGotiKilledSound()
                                          val victim = if (gameState.turn == PlayerColor.RED) PlayerColor.GREEN else PlayerColor.RED
                                          gameState.copy(
                                              diceValue = rolled,
                                              turn = nextTurn,
                                              lastKilledPlayer = victim.name,
                                              message = "ખતમ! ${gameState.turn.label} એ ${victim.label} ની ગોટી કાપી! 🔪😂"
                                          )
                                      } else {
                                          gameState.copy(diceValue = rolled, turn = nextTurn, message = "${gameState.turn.label} -> $rolled!")
                                      }

                                      gameState = updated
                                      if (activeBlobUrl.isNotBlank()) {
                                          LudoOnlineEngine.syncGame(activeBlobUrl, updated)
                                      }
                                  }
                              },
                              onShareRoom = { shareOnWhatsApp(context, gameState.roomCode.ifBlank { generatedRoomCode }) }
                          )
                      }
                  }
              }
          }

