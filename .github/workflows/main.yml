                                  ) {
                                      Box(contentAlignment = Alignment.Center) {
                                          Text("${std.stdNumber}", fontWeight = FontWeight.Black, fontSize = 20.sp, color = Color(0xFF0D276B))
                                      }
                                  }
                                  Spacer(modifier = Modifier.width(14.dp))
                                  Column {
                                      Text(std.name, fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF1E293B))
                                      Text(std.section, fontSize = 12.sp, color = Color.Gray)
                                  }
                              }
                              Icon(Icons.Default.ChevronRight, contentDescription = null, tint = Color(0xFF0D276B))
                          }
                      }
                  }
              }
          }

          @Composable
          fun StandardSubjectsScreen(standard: Standard, onSubjectSelect: (Subject) -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Text("વિષય પસંદ કરો (Select Subject)", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = Color(0xFF1E293B))
                  Text(standard.name, fontSize = 13.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(12.dp))

                  LazyVerticalGrid(
                      columns = GridCells.Fixed(2),
                      horizontalArrangement = Arrangement.spacedBy(10.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      items(standard.subjects) { subject ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .height(130.dp)
                                  .clickable { onSubjectSelect(subject) },
                              colors = CardDefaults.cardColors(containerColor = Color.White),
                              elevation = CardDefaults.cardElevation(3.dp),
                              shape = RoundedCornerShape(14.dp)
                          ) {
                              Column(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .padding(12.dp),
                                  verticalArrangement = Arrangement.SpaceBetween
                              ) {
                                  Text(subject.iconEmoji, fontSize = 28.sp)
                                  Column {
                                      Text(subject.name, fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF1E293B))
                                      Text("${subject.chapters.size} પ્રકરણો ઉપલબ્ધ", fontSize = 11.sp, color = Color.Gray)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SubjectChaptersScreen(subject: Subject, onChapterSelect: (Chapter) -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Text("પ્રકરણોની યાદી (Chapters List)", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = Color(0xFF1E293B))
                  Text(subject.name, fontSize = 13.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(12.dp))

                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                      items(subject.chapters) { chapter ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 5.dp)
                                  .clickable { onChapterSelect(chapter) },
                              colors = CardDefaults.cardColors(containerColor = Color.White),
                              elevation = CardDefaults.cardElevation(2.dp),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Row(
                                  modifier = Modifier.padding(16.dp),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text("પ્રકરણ ${chapter.chapterNumber}: ${chapter.title}", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color(0xFF1E293B))
                                      Text("📖 પાઠ્યપુસ્તક સારાંશ + ✍️ સ્વાધ્યાય જવાબો", fontSize = 12.sp, color = Color(0xFF0D276B))
                                  }
                                  Icon(Icons.Default.ArrowForwardIos, contentDescription = null, tint = Color.Gray, modifier = Modifier.size(16.dp))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun ChapterDetailScreen(chapter: Chapter) {
              var selectedViewTab by remember { mutableStateOf(0) }

              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  TabRow(selectedTabIndex = selectedViewTab, containerColor = Color.White) {
                      Tab(
                          selected = selectedViewTab == 0,
                          onClick = { selectedViewTab = 0 },
                          text = { Text("📖 પાઠ્યપુસ્તક વાંચન", fontWeight = FontWeight.Bold, fontSize = 13.sp) }
                      )
                      Tab(
                          selected = selectedViewTab == 1,
                          onClick = { selectedViewTab = 1 },
                          text = { Text("✍️ સ્વાધ્યાય જવાબો", fontWeight = FontWeight.Bold, fontSize = 13.sp) }
                      )
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  if (selectedViewTab == 0) {
                      Card(
                          modifier = Modifier.fillMaxSize(),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(12.dp),
                          elevation = CardDefaults.cardElevation(2.dp)
                      ) {
                          LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                              item {
                                  Text("📘 ${chapter.title}", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = Color(0xFF0D276B))
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text(chapter.textbookSummary, fontSize = 14.sp, color = Color(0xFF334155), lineHeight = 22.sp)
                              }
                          }
                      }
                  } else {
                      LazyColumn(modifier = Modifier.fillMaxSize()) {
                          items(chapter.swadhyayAnswers) { qa ->
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 6.dp),
                                  colors = CardDefaults.cardColors(containerColor = Color.White),
                                  elevation = CardDefaults.cardElevation(2.dp),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Column(modifier = Modifier.padding(14.dp)) {
                                      Surface(
                                          color = Color(0xFFFFF3E0),
                                          shape = RoundedCornerShape(6.dp)
                                      ) {
                                          Text(
                                              text = qa.type,
                                              modifier = Modifier.padding(horizontal = 8.dp, vertical = 2.dp),
                                              fontSize = 11.sp,
                                              fontWeight = FontWeight.Bold,
                                              color = Color(0xFFE65100)
                                          )
                                      }
                                      Spacer(modifier = Modifier.height(6.dp))
                                      Text("પ્રશ્ન: ${qa.question}", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF1E293B))
                                      Spacer(modifier = Modifier.height(6.dp))
                                      Text(qa.answer, fontSize = 13.sp, color = Color(0xFF334155), lineHeight = 20.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          chmod +x gradlew || gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSEB-VidyaSetu-Edu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
