                              "Simple Past Tense (સાદો ભૂતકાળ)" to "બની ગયેલી ઘટના: I went to school. (હું શાળાએ ગયો હતો.)",
                              "Simple Future Tense (સાદો ભવિષ્યકાળ)" to "ભવિષ્યની વાત: I will come tomorrow. (હું કાલે આવીશ.)",
                              "Is / Am / Are નો ઉપયોગ" to "I am (હું છું), He/She/It is (તે છે), We/You/They are (અમે/તમે/તેઓ છે)"
                          )
                      ),
                      FolderItem(
                          title = "વાર્તાલાપ પ્રેક્ટિસ (Conversation Practice)",
                          subtitle = "School, Market & Doctor Conversations",
                          icon = "🤝",
                          details = listOf(
                              "શિક્ષક સાથે વાતચીત" to "May I come in, Sir? (હું અંદર આવી શકું સાહેબ?)",
