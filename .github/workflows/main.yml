          @Composable
          fun ChapterDetailScreen(chapter: Chapter, isGu: Boolean) {
              var selectedViewTab by remember { mutableStateOf(0) }

              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  TabRow(selectedTabIndex = selectedViewTab, containerColor = Color.White) {
                      Tab(
                          selected = selectedViewTab == 0,
                          onClick = { selectedViewTab = 0 },
                          text = { Text(if (isGu) "📖 સંપૂર્ણ વાર્તા & સારાંશ" else "📖 Full Story & Theory", fontWeight = FontWeight.Bold, fontSize = 13.sp) }
                      )
                      Tab(
                          selected = selectedViewTab == 1,
                          onClick = { selectedViewTab = 1 },
                          text = { Text(if (isGu) "✍️ સ્વાધ્યાય પ્રશ્નોત્તરો" else "✍️ Exercise Q&A", fontWeight = FontWeight.Bold, fontSize = 13.sp) }
                      )
                  }

                  Spacer(modifier = Modifier.height(10.dp))

                  if (selectedViewTab == 0) {
                      Card(
                          modifier = Modifier.fillMaxSize(),
                          colors = CardDefaults.cardColors(containerColor = Color.White),
                          shape = RoundedCornerShape(12.dp),
                          elevation = CardDefaults.cardElevation(2.dp)
                      ) {
                          LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                              item {
                                  Text(if (isGu) chapter.titleGu else chapter.titleEn, fontWeight = FontWeight.Bold, fontSize = 17.sp, color = Color(0xFF0D276B))
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Text(
                                      text = if (isGu) chapter.storyAndSummaryGu else chapter.storyAndSummaryEn,
                                      fontSize = 14.sp,
                                      color = Color(0xFF334155),
                                      lineHeight = 22.sp
                                  )
                              }
                          }
                      }
                  } else {
                      val qaList = if (isGu) chapter.swadhyayAnswersGu else chapter.swadhyayAnswersEn
                      LazyColumn(modifier = Modifier.fillMaxSize()) {
                          items(qaList) { qa ->
                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 6.dp),
                                  colors = CardDefaults.cardColors(containerColor = Color.White),
                                  elevation = CardDefaults.cardElevation(2.dp),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Column(modifier = Modifier.padding(14.dp)) {
                                      Surface(
                                          color = Color(0xFFFFF3E0),
                                          shape = RoundedCornerShape(6.dp)
                                      ) {
                                          Text(
                                              text = qa.type,
                                              modifier = Modifier.padding(horizontal = 8.dp, vertical = 2.dp),
                                              fontSize = 11.sp,
                                              fontWeight = FontWeight.Bold,
                                              color = Color(0xFFE65100)
                                          )
                                      }
                                      Spacer(modifier = Modifier.height(6.dp))
                                      Text("${if (isGu) "પ્રશ્ન" else "Question"}: ${qa.question}", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF1E293B))
                                      Spacer(modifier = Modifier.height(6.dp))
                                      Text(qa.answer, fontSize = 13.sp, color = Color(0xFF334155), lineHeight = 20.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          chmod +x gradlew || gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSEB-VidyaSetu-Edu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
