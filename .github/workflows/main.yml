          @Composable
          fun ChapterDetailScreen(chapter: Chapter, context: Context) {
              Column(modifier = Modifier.fillMaxSize().padding(14.dp)) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFE8F5E9)),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Row(
                          modifier = Modifier.padding(14.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text("સત્તાવાર પાઠ્યપુસ્તક PDF", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF2E7D32))
                              Text("ગુજરાત રાજ્ય શાળા પાઠ્યપુસ્તક મંડળ", fontSize = 11.sp, color = Color.DarkGray)
                          }
                          Button(
                              onClick = {
                                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(chapter.textbookUrl))
                                  context.startActivity(intent)
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2E7D32)),
                              contentPadding = PaddingValues(horizontal = 12.dp, vertical = 6.dp)
                          ) {
                              Text("PDF ખોલો 📥", fontSize = 12.sp)
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(14.dp))
                  Text("✍️ સ્વાધ્યાય & સ્વાધ્યાયપોથી સોલ્યુશન્સ (Q & A)", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFF1E293B))
                  Spacer(modifier = Modifier.height(8.dp))

                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                      items(chapter.swadhyayAnswers) { qa ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 6.dp),
                              colors = CardDefaults.cardColors(containerColor = Color.White),
                              elevation = CardDefaults.cardElevation(2.dp),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Column(modifier = Modifier.padding(14.dp)) {
                                  Surface(
                                      color = Color(0xFFFFF3E0),
                                      shape = RoundedCornerShape(6.dp)
                                  ) {
                                      Text(
                                          text = qa.type,
                                          modifier = Modifier.padding(horizontal = 8.dp, vertical = 2.dp),
                                          fontSize = 11.sp,
                                          fontWeight = FontWeight.Bold,
                                          color = Color(0xFFE65100)
                                      )
                                  }
                                  Spacer(modifier = Modifier.height(6.dp))
                                  Text("પ્રશ્ન: ${qa.question}", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF1E293B))
                                  Spacer(modifier = Modifier.height(6.dp))
                                  Text(qa.answer, fontSize = 13.sp, color = Color(0xFF334155), lineHeight = 20.sp)
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          chmod +x gradlew || gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSEB-VidyaSetu-Edu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
