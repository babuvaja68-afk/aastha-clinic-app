name: Build Aastha Clinic APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Professional Dashboard & Checked Slot Colors
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/java/com/aastha/clinic
          mkdir -p gradle/wrapper

          cat << 'EOF' > app/src/main/res/drawable/ic_aastha_brand_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="150dp"
              android:height="150dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M44,40 h12 v24 h-12 z"/>
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M38,46 h24 v12 h-24 z"/>
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M50,15 a4,4 0 1,0 0.1,0 z M42,22 c-3,0 -6,2 -7,5 l4,2 c1,-2 2,-3 3,-3 c2,0 3,1 4,3 l4,-2 c-1,-3 -4,-5 -8,-5 z M58,22 c-4,0 -7,2 -8,5 l4,2 c1,-2 2,-3 4,-3 c1,0 2,1 3,3 l4,-2 c-1,-3 -4,-5 -7,-5 z"/>
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M28,38 C28,52 38,62 50,66 C36,60 32,48 32,38 Z M72,38 C72,52 62,62 50,66 C64,60 68,48 68,38 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0D276B"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_aastha_brand_logo"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/java/com/aastha/clinic/MainActivity.kt
          package com.aastha.clinic

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          data class Patient(
              val id: Int,
              val name: String,
              val village: String,
              val age: String,
              val disease: String,
              val medicine: String,
              val amount: String,
              val paymentMode: String,
              val doctorName: String,
              val timeSlot: String,
              var isChecked: Boolean = false
          )

          enum class AppLang { GU, EN, HI }

          fun tr(key: String, lang: AppLang): String {
              return when (lang) {
                  AppLang.GU -> when (key) {
                      "app_title" -> "આસ્થા ક્લિનિક"
                      "home_btn" -> "હોમ"
                      "add_title" -> "દર્દી બુકિંગ ફોર્મ"
                      "records_title" -> "દર્દીઓનો રેકોર્ડ"
                      "slots_overview" -> "🕒 ટાઈમ સ્લોટ સ્ટેટસ (Green: બાકી | Red: પૂરું)"
                      "morning_shift" -> "🌅 મોર્નિંગ શિફ્ટ (સવાર)"
                      "evening_shift" -> "🌆 ઇવનિંગ શિફ્ટ (સાંજ)"
                      "new_booking" -> "➕ નવું દર્દી બુકિંગ"
                      "new_booking_sub" -> "૧૫ મિનિટમાં ૩ દર્દી લિમિટ મુજબ એપોઇન્ટમેન્ટ"
                      "view_records" -> "📋 દર્દીઓનો જૂનો રેકોર્ડ"
                      "view_records_sub" -> "દર્દીની જૂની દવાઓ, ગામ અને હિસાબ"
                      "total_patients" -> "કુલ દર્દીઓ"
                      "pending_patients" -> "તપાસવાના બાકી"
                      "completed_patients" -> "તપાસાઈ ગયા"
                      "total_collection" -> "કુલ ફી કલેક્શન"
                      "select_doctor" -> "ડોક્ટર પસંદ કરો:"
                      "time_slot_label" -> "૧૫ મિનિટ ટાઈમ સ્લોટ (વિગત માટે ટચ કરો):"
                      "patient_name" -> "દર્દીનું પૂરું નામ"
                      "village" -> "ગામ"
                      "age" -> "ઉંમર"
                      "disease" -> "રોગ / બીમારી"
                      "medicines" -> "દવાઓ"
                      "fee_amount" -> "ફી / રકમ ₹"
                      "payment_mode" -> "પેમેન્ટ મોડ:"
                      "save_booking" -> "બુકિંગ સેવ કરો"
                      "back" -> "પાછા જાઓ"
                      "close" -> "બંધ કરો"
                      "search_hint" -> "નામ, ગામ કે રોગ થી શોધો..."
                      "full" -> "Full (3/3)"
                      "no_patients_in_slot" -> "આ સ્લોટમાં હજુ કોઈ દર્દી બુક થયેલ નથી."
                      "patients_in_slot" -> "આ સ્લોટના દર્દીઓ:"
                      "patients_count" -> "દર્દી"
                      else -> key
                  }
                  AppLang.HI -> when (key) {
                      "app_title" -> "आस्था क्लिनिक"
                      "home_btn" -> "होम"
                      "add_title" -> "मरीज बुकिंग फॉर्म"
                      "records_title" -> "मरीजों का रिकॉर्ड"
                      "slots_overview" -> "🕒 टाइम स्लॉट स्थिति (🟢 बाकी | 🔴 पूर्ण)"
                      "morning_shift" -> "🌅 मॉर्निंग शिफ्ट"
                      "evening_shift" -> "🌆 इवनिंग शिफ्ट"
                      "new_booking" -> "➕ नया मरीज बुकिंग"
                      "new_booking_sub" -> "१५ मिनट में ३ मरीज लिमिट"
                      "view_records" -> "📋 पुराना मरीज रिकॉर्ड"
                      "view_records_sub" -> "पुरानी दवाइयां और पेमेंट रिकॉर्ड"
                      "total_patients" -> "कुल मरीज"
                      "pending_patients" -> "जांच बाकी"
                      "completed_patients" -> "जांच पूर्ण"
                      "total_collection" -> "कुल फीस संग्रह"
                      "select_doctor" -> "डॉक्टर चुनें:"
                      "time_slot_label" -> "१५ मिनट टाइम स्लॉट (विवरण हेतु टच करें):"
                      "patient_name" -> "मरीज का पूरा नाम"
                      "village" -> "गांव"
                      "age" -> "उम्र"
                      "disease" -> "बीमारी / लक्षण"
                      "medicines" -> "दवाइयां"
                      "fee_amount" -> "फीस / राशि ₹"
                      "payment_mode" -> "पेमेंट मोड:"
                      "save_booking" -> "बुकिंग सेव करें"
                      "back" -> "वापस जाएं"
                      "close" -> "बंद करें"
                      "search_hint" -> "नाम, गांव या बीमारी से खोजें..."
                      "full" -> "फुल (3/3)"
                      "no_patients_in_slot" -> "इस स्लॉट में कोई मरीज बुक नहीं है।"
                      "patients_in_slot" -> "इस स्लॉट के मरीज:"
                      "patients_count" -> "मरीज"
                      else -> key
                  }
                  AppLang.EN -> when (key) {
                      "app_title" -> "Aastha Clinic"
                      "home_btn" -> "Home"
                      "add_title" -> "Patient Booking Form"
                      "records_title" -> "Patient Records"
                      "slots_overview" -> "🕒 Time Slots Status (🟢 Pending | 🔴 Checked)"
                      "morning_shift" -> "🌅 Morning Shift"
                      "evening_shift" -> "🌆 Evening Shift"
                      "new_booking" -> "➕ New Patient Booking"
                      "new_booking_sub" -> "Appointment with 3 patients / 15-min limit"
                      "view_records" -> "📋 Patient Records & History"
                      "view_records_sub" -> "Medical history & billing"
                      "total_patients" -> "Total Patients"
                      "pending_patients" -> "Pending Checkup"
                      "completed_patients" -> "Checked Patients"
                      "total_collection" -> "Total Collection"
                      "select_doctor" -> "Select Doctor:"
                      "time_slot_label" -> "15-Min Time Slot (Tap for details):"
                      "patient_name" -> "Patient Full Name"
                      "village" -> "Village"
                      "age" -> "Age"
                      "disease" -> "Disease / Symptoms"
                      "medicines" -> "Medicines Prescribed"
                      "fee_amount" -> "Fee Amount ₹"
                      "payment_mode" -> "Payment Mode:"
                      "save_booking" -> "Save Appointment"
                      "back" -> "Back"
                      "close" -> "Close"
                      "search_hint" -> "Search by name, village or disease..."
                      "full" -> "Full (3/3)"
                      "no_patients_in_slot" -> "No patients in this slot yet."
                      "patients_in_slot" -> "Patients in this Slot:"
                      "patients_count" -> "pts"
                      else -> key
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      AasthaClinicApp()
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun AasthaClinicApp() {
              var currentScreen by remember { mutableStateOf("home") }
              var currentLang by remember { mutableStateOf(AppLang.GU) }
              var activeSlotDetail by remember { mutableStateOf<Pair<String, String>?>(null) }

              val patientList = remember {
                  mutableStateListOf(
                      Patient(1, "Ramesh Patel", "Veraval", "45", "Fever & Cold", "Paracetamol 500mg", "350", "Cash", "DR. BIRJU K. SIRODARIA", "11:00 AM - 11:15 AM", isChecked = false),
                      Patient(2, "Geetaben Shah", "Somnath", "38", "Acidity & BP", "Pantocid 40", "500", "Online (UPI)", "DR. NIDDHI JAVIA", "05:00 PM - 05:15 PM", isChecked = true),
                      Patient(3, "Kishorbhai Joshi", "Kodinar", "52", "Joint Pain", "Aceclofenac + Paracetamol", "400", "Cash", "DR. BIRJU K. SIRODARIA", "11:00 AM - 11:15 AM", isChecked = false)
                  )
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Text(
                                  text = when (currentScreen) {
                                      "home" -> "AASTHA CLINIC"
                                      "add" -> tr("add_title", currentLang)
                                      else -> tr("records_title", currentLang)
                                  },
                                  fontWeight = FontWeight.Black,
                                  letterSpacing = 1.sp,
                                  fontSize = 19.sp
                              )
                          },
                          actions = {
                              Row(modifier = Modifier.padding(end = 8.dp)) {
                                  listOf(
                                      AppLang.GU to "ગુજ",
                                      AppLang.HI to "हिं",
                                      AppLang.EN to "EN"
                                  ).forEach { (lang, label) ->
                                      FilledTonalButton(
                                          onClick = { currentLang = lang },
                                          colors = ButtonDefaults.filledTonalButtonColors(
                                              containerColor = if (currentLang == lang) Color.White else Color(0xFF1E3A8A),
                                              contentColor = if (currentLang == lang) Color(0xFF0D276B) else Color.White
                                          ),
                                          contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                          modifier = Modifier.padding(horizontal = 2.dp).height(32.dp)
                                      ) {
                                          Text(label, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      }
                                  }
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(
                              containerColor = Color(0xFF0D276B),
                              titleContentColor = Color.White
                          )
                      )
                  }
              ) { paddingValues ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(paddingValues)
                          .background(Color(0xFFF1F5F9))
                  ) {
                      when (currentScreen) {
                          "home" -> HomeScreen(
                              lang = currentLang,
                              patientList = patientList,
                              onAddClick = { currentScreen = "add" },
                              onRecordsClick = { currentScreen = "records" },
                              onSlotClick = { slot, doc -> activeSlotDetail = Pair(slot, doc) }
                          )
                          "add" -> AddPatientScreen(
                              lang = currentLang,
                              patientList = patientList,
                              onSave = { newPatient ->
                                  patientList.add(0, newPatient)
                                  currentScreen = "records"
                              },
                              onBack = { currentScreen = "home" },
                              onSlotInfoClick = { slot, doc -> activeSlotDetail = Pair(slot, doc) }
                          )
                          "records" -> PatientRecordsScreen(
                              lang = currentLang,
                              patients = patientList,
                              onBack = { currentScreen = "home" },
                              onToggleCheck = { patient ->
                                  val index = patientList.indexOfFirst { it.id == patient.id }
                                  if (index != -1) {
                                      patientList[index] = patientList[index].copy(isChecked = !patientList[index].isChecked)
                                  }
                              }
                          )
                      }

                      activeSlotDetail?.let { (slot, doc) ->
                          val slotPatients = patientList.filter { it.timeSlot == slot && it.doctorName.contains(doc.take(5)) }
                          AlertDialog(
                              onDismissRequest = { activeSlotDetail = null },
                              title = {
                                  Column {
                                      Text(text = "⏰ $slot", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = Color(0xFF0D276B))
                                      Text(text = "👨‍⚕️ $doc", fontSize = 13.sp, color = Color.Gray)
                                  }
                              },
                              text = {
                                  Column(modifier = Modifier.fillMaxWidth()) {
                                      Text(text = tr("patients_in_slot", currentLang), fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                      Spacer(modifier = Modifier.height(8.dp))
                                      if (slotPatients.isEmpty()) {
                                          Text(text = tr("no_patients_in_slot", currentLang), fontSize = 13.sp, color = Color.DarkGray)
                                      } else {
                                          slotPatients.forEachIndexed { index, p ->
                                              Card(
                                                  modifier = Modifier
                                                      .fillMaxWidth()
                                                      .padding(vertical = 4.dp),
                                                  colors = CardDefaults.cardColors(
                                                      containerColor = if (p.isChecked) Color(0xFFFFEBEE) else Color(0xFFE8F5E9)
                                                  )
                                              ) {
                                                  Column(modifier = Modifier.padding(10.dp)) {
                                                      Row(
                                                          modifier = Modifier.fillMaxWidth(),
                                                          horizontalArrangement = Arrangement.SpaceBetween,
                                                          verticalAlignment = Alignment.CenterVertically
                                                      ) {
                                                          Text(text = "${index + 1}. ${p.name}", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = Color(0xFF0D276B))
                                                          Button(
                                                              onClick = {
                                                                  val pIdx = patientList.indexOfFirst { it.id == p.id }
                                                                  if (pIdx != -1) {
                                                                      patientList[pIdx] = patientList[pIdx].copy(isChecked = !patientList[pIdx].isChecked)
                                                                  }
                                                              },
                                                              colors = ButtonDefaults.buttonColors(
                                                                  containerColor = if (p.isChecked) Color(0xFFDC2626) else Color(0xFF16A34A)
                                                              ),
                                                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                                              modifier = Modifier.height(30.dp)
                                                          ) {
                                                              Text(
                                                                  text = if (p.isChecked) "🔴 તપાસાઈ ગયા" else "🟢 બાકી",
                                                                  fontSize = 11.sp,
                                                                  color = Color.White
                                                              )
                                                          }
                                                      }
                                                      Spacer(modifier = Modifier.height(4.dp))
                                                      Text(text = "ગામ: ${p.village} | ઉંમર: ${p.age} વર્ષ", fontSize = 12.sp, color = Color.DarkGray)
                                                      Text(text = "રોગ: ${p.disease}", fontSize = 12.sp, color = Color(0xFFD32F2F))
                                                      Text(text = "ફી: ₹${p.amount} (${p.paymentMode})", fontSize = 12.sp, fontWeight = FontWeight.SemiBold, color = Color(0xFF2E7D32))
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { activeSlotDetail = null },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF0D276B))
                                  ) {
                                      Text(tr("close", currentLang))
                                  }
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen(
              lang: AppLang,
              patientList: List<Patient>,
              onAddClick: () -> Unit,
              onRecordsClick: () -> Unit,
              onSlotClick: (String, String) -> Unit
          ) {
              val totalPatients = patientList.size
              val pendingCount = patientList.count { !it.isChecked }
              val completedCount = patientList.count { it.isChecked }
              val totalCollection = patientList.sumOf { it.amount.toIntOrNull() ?: 0 }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp)
                      .verticalScroll(rememberScrollState()),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(16.dp),
                      colors = CardDefaults.cardColors(containerColor = Color.White),
                      elevation = CardDefaults.cardElevation(defaultElevation = 4.dp)
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(16.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.Center
                          ) {
                              Image(
                                  painter = painterResource(id = R.drawable.ic_aastha_brand_logo),
                                  contentDescription = "Aastha Logo",
                                  modifier = Modifier.size(52.dp)
                              )
                              Spacer(modifier = Modifier.width(12.dp))
                              Column {
                                  Text(
                                      text = "AASTHA",
                                      fontSize = 24.sp,
                                      fontWeight = FontWeight.Black,
                                      letterSpacing = 3.sp,
                                      color = Color(0xFF0D276B)
                                  )
                                  Text(
                                      text = "CLINIC",
                                      fontSize = 18.sp,
                                      fontWeight = FontWeight.Bold,
                                      letterSpacing = 2.sp,
                                      color = Color(0xFFD32F2F)
                                  )
                              }
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(14.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      MetricCard(
                          title = tr("total_patients", lang),
                          value = "$totalPatients",
                          color = Color(0xFF0288D1),
                          modifier = Modifier.weight(1f).padding(end = 4.dp)
                      )
                      MetricCard(
                          title = tr("pending_patients", lang),
                          value = "$pendingCount",
                          color = Color(0xFF16A34A),
                          modifier = Modifier.weight(1f).padding(start = 4.dp)
                      )
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      MetricCard(
                          title = tr("completed_patients", lang),
                          value = "$completedCount",
                          color = Color(0xFFDC2626),
                          modifier = Modifier.weight(1f).padding(end = 4.dp)
                      )
                      MetricCard(
                          title = tr("total_collection", lang),
                          value = "₹$totalCollection",
                          color = Color(0xFF7C3AED),
                          modifier = Modifier.weight(1f).padding(start = 4.dp)
                      )
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  DoctorInfoCard(
                      doctorName = "DR. BIRJU K. SIRODARIA",
                      shift = tr("morning_shift", lang),
                      time = "⏰ 11:00 AM - 03:30 PM",
                      bgColor = Color(0xFF0D276B)
                  )

                  Spacer(modifier = Modifier.height(8.dp))

                  DoctorInfoCard(
                      doctorName = "DR. NIDDHI JAVIA",
                      shift = tr("evening_shift", lang),
                      time = "⏰ 05:00 PM - 08:00 PM",
                      bgColor = Color(0xFF1E3A8A)
                  )

                  Spacer(modifier = Modifier.height(16.dp))

                  HomeMenuButton(
                      title = tr("new_booking", lang),
                      subtitle = tr("new_booking_sub", lang),
                      color = Color(0xFFD32F2F),
                      onClick = onAddClick
                  )

                  Spacer(modifier = Modifier.height(10.dp))

                  HomeMenuButton(
                      title = tr("view_records", lang),
                      subtitle = tr("view_records_sub", lang),
                      color = Color(0xFF0D276B),
                      onClick = onRecordsClick
                  )

                  Spacer(modifier = Modifier.height(18.dp))

                  Text(
                      text = tr("slots_overview", lang),
                      fontWeight = FontWeight.Bold,
                      fontSize = 13.sp,
                      color = Color(0xFF1E293B)
                  )
                  Spacer(modifier = Modifier.height(8.dp))

                  val morningSlots = listOf(
                      "11:00 AM - 11:15 AM", "11:15 AM - 11:30 AM", "11:30 AM - 11:45 AM", "11:45 AM - 12:00 PM",
                      "12:00 PM - 12:15 PM", "12:15 PM - 12:30 PM", "12:30 PM - 12:45 PM", "12:45 PM - 01:00 PM",
                      "01:00 PM - 01:15 PM", "01:15 PM - 01:30 PM", "01:30 PM - 01:45 PM", "01:45 PM - 02:00 PM",
                      "02:00 PM - 02:15 PM", "02:15 PM - 02:30 PM", "02:30 PM - 02:45 PM", "02:45 PM - 03:00 PM",
                      "03:00 PM - 03:15 PM", "03:15 PM - 03:30 PM"
                  )

                  morningSlots.chunked(2).forEach { rowSlots ->
                      Row(modifier = Modifier.fillMaxWidth()) {
                          rowSlots.forEach { slot ->
                              val doc = "DR. BIRJU K. SIRODARIA"
                              val slotPatients = patientList.filter { it.timeSlot == slot && it.doctorName.contains("BIRJU") }
                              val hasPatients = slotPatients.isNotEmpty()
                              val allChecked = hasPatients && slotPatients.all { it.isChecked }
                              val isPending = hasPatients && slotPatients.any { !it.isChecked }

                              val cardBgColor = when {
                                  allChecked -> Color(0xFFDC2626)
                                  isPending -> Color(0xFF16A34A)
                                  else -> Color.White
                              }

                              val textColor = if (hasPatients) Color.White else Color(0xFF0D276B)

                              Card(
                                  modifier = Modifier
                                      .weight(1f)
                                      .padding(3.dp)
                                      .clickable { onSlotClick(slot, doc) },
                                  colors = CardDefaults.cardColors(containerColor = cardBgColor),
                                  shape = RoundedCornerShape(8.dp)
                              ) {
                                  Column(modifier = Modifier.padding(10.dp)) {
                                      Text(text = slot, fontSize = 11.sp, fontWeight = FontWeight.Bold, color = textColor)
                                      Text(
                                          text = when {
                                              allChecked -> "🔴 તપાસાઈ ગયા (Red)"
                                              isPending -> "🟢 તપાસવાના બાકી (${slotPatients.size})"
                                              else -> "⚪ ખાલી (0/3)"
                                          },
                                          fontSize = 10.sp,
                                          color = if (hasPatients) Color.White.copy(alpha = 0.9f) else Color.Gray
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

