          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun GSEBVidyaSetuApp() {
              val context = LocalContext.current
              val coroutineScope = rememberCoroutineScope()

              var currentMedium by remember { mutableStateOf(AppMedium.GUJARATI) }
              val isGu = currentMedium == AppMedium.GUJARATI

              val standards = remember { EducationRepository.getStandards() }
              val computerFolders = remember { EducationRepository.getComputerFolders() }
              val spokenEnglishFolders = remember { EducationRepository.getSpokenEnglishFolders() }
              val knowledgeFolders = remember { EducationRepository.getKnowledgeFolders() }

              var selectedTab by remember { mutableStateOf(0) }
              var selectedStandard by remember { mutableStateOf<Standard?>(null) }
              var selectedSubject by remember { mutableStateOf<Subject?>(null) }
              var selectedChapter by remember { mutableStateOf<Chapter?>(null) }
              var activeFolder by remember { mutableStateOf<FolderItem?>(null) }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Image(
                                      painter = painterResource(id = R.drawable.ic_education_logo),
                                      contentDescription = "Logo",
                                      modifier = Modifier.size(36.dp)
                                  )
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Column {
                                      Text(
                                          text = when (selectedTab) {
                                              0 -> if (selectedChapter != null) (if (isGu) selectedChapter!!.titleGu else selectedChapter!!.titleEn)
                                                   else if (selectedSubject != null) (if (isGu) selectedSubject!!.nameGu else selectedSubject!!.nameEn)
                                                   else if (selectedStandard != null) (if (isGu) selectedStandard!!.nameGu else selectedStandard!!.nameEn)
                                                   else (if (isGu) "GSEB વિદ્યાસેતુ (ધોરણ ૧-૧૨)" else "GSEB VidyaSetu (Std 1-12)")
                                              1 -> if (activeFolder != null) (if (isGu) activeFolder!!.titleGu else activeFolder!!.titleEn) else (if (isGu) "💻 કમ્પ્યુટર કોર્સ" else "💻 Computer Course")
                                              2 -> if (activeFolder != null) (if (isGu) activeFolder!!.titleGu else activeFolder!!.titleEn) else (if (isGu) "🗣️ સ્પોકન ઇંગ્લિશ" else "🗣️ Spoken English")
                                              else -> if (activeFolder != null) (if (isGu) activeFolder!!.titleGu else activeFolder!!.titleEn) else (if (isGu) "🇮🇳 ભારત & વિશ્વ જ્ઞાન" else "🇮🇳 India & World GK")
                                          },
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 16.sp,
                                          color = Color.White,
                                          maxLines = 1
                                      )
                                      Text(
                                          text = if (isGu) "સંપૂર્ણ અભ્યાસક્રમ • કમ્પ્યુટર • ઇંગ્લિશ" else "Complete Curriculum • Computer • English",
                                          fontSize = 11.sp,
                                          color = Color(0xFFE1F5FE)
                                      )
                                  }
                              }
                          },
                          actions = {
                              // Language Medium Switcher Button
                              Button(
                                  onClick = {
                                      currentMedium = if (isGu) AppMedium.ENGLISH else AppMedium.GUJARATI
                                  },
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFC107)),
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 2.dp)
                              ) {
                                  Text(
                                      text = if (isGu) "English" else "ગુજરાતી",
                                      color = Color(0xFF0D276B),
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 12.sp
                                  )
                              }
                          },
                          navigationIcon = {
                              val canGoBack = (selectedTab == 0 && selectedStandard != null) || (selectedTab != 0 && activeFolder != null)
                              if (canGoBack) {
