                          icon = "📖",
                          details = listOf(
                              "Knowledge (નોલેજ)" to "જ્ઞાન / વિદ્યા",
                              "Courage (કરેજ)" to "હિંમત / સાહસ",
                              "Opportunity (ઓપોર્ચ્યુનિટી)" to "તક / મોકો",
